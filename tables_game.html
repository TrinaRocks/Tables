    if (progressive) dealRow(i);                   // the row's dots arrive WITH its loop
    loopRect({ x: g.cx(0) - m, y: g.cy(i) - m, width: (g.cols - 1) * g.cell + 2 * m, height: 2 * m, rx: m,
      fill: "none", stroke: TT_SCAFFOLD_ORANGE, "stroke-width": 2.5 });
    if (countAxis === "rows") setNum(leftEl, g.ox - g.cell * 0.95, g.cy(i), s.ordinal, TT_SCAFFOLD_ORANGE);
    else staticLeft();                             // a is given — it does not count
    staticTop();                                   // b = dots in a row (idempotent)
    setNum(dotEl, g.cx(g.cols - 1) + g.cell * 0.95, g.cy(i), s.dots, TT_SCAFFOLD_DOT);   // black count — RIGHT
  }
  function drawCol(s) {
    var j = s.index - 1, m = g.cell * 0.42;
    if (progressive) dealCol(j);                   // the column's dots arrive WITH its loop
    loopRect({ x: g.cx(j) - m, y: g.cy(0) - m, width: 2 * m, height: (g.rows - 1) * g.cell + 2 * m, rx: m,
      fill: "none", stroke: TT_SCAFFOLD_BLUE, "stroke-width": 2.5 });
    if (countAxis === "cols") setNum(topEl, g.cx(j), g.oy - g.cell * 0.9, s.ordinal, TT_SCAFFOLD_BLUE);
    else staticTop();                              // b is given — it does not count
    staticLeft();                                  // a = dots in a column (idempotent)
    setNum(dotEl, g.cx(j), g.cy(g.rows - 1) + g.cell * 0.9, s.dots, TT_SCAFFOLD_DOT);    // black count — BOTTOM
  }
  // Between phases (L2, both dims given): loops + numbers go, the array stays.
  // When the array is dealt out progressively there is no `clear` step, but a
  // replay must restart from an empty panel — so the dots go too in that mode.
  function clearArray() {
    if (loopLayer) loopLayer.innerHTML = "";
    if (progressive && dotLayer) dotLayer.innerHTML = "";
    if (leftEl) leftEl.textContent = "";
    if (topEl) topEl.textContent = "";
    if (dotEl) dotEl.textContent = "";
  }
  function applyStep(s) {
    switch (s.kind) {
      case "row":      drawRow(s); break;
      case "col":      drawCol(s); break;
      case "clear":    clearArray(); break;
      case "equation": showTerminal(); break;      // already built + reserved at mount
      case "sentence": showTerminal(); break;
    }
  }

  // --- playback -------------------------------------------------------------
  var timer = null;
  function stop() { if (timer) { clearTimeout(timer); timer = null; } }

  function renderFinal() {
    clearArray(); hideTerminal();
    if (hasArray && !progressive) dealAll();
    var lastPhase = null;
    script.steps.forEach(function (s) { if (s.kind === "row" || s.kind === "col") lastPhase = s.kind; });
    if (lastPhase) script.steps.filter(function (s) { return s.kind === lastPhase; })
      .forEach(function (s) { s.kind === "row" ? drawRow(s) : drawCol(s); });
    showTerminal();
  }

  function play() {
    stop(); clearArray(); hideTerminal();
    if (hasArray && !progressive) dealAll();       // both dims given: the array is there from the start
    if (reduceMotion) { renderFinal(); if (opts.onDone) opts.onDone(); return; }
    var i = 0;
    function tick() {
      if (i >= script.steps.length) { timer = null; if (opts.onDone) opts.onDone(); return; }
      applyStep(script.steps[i++]);
      timer = (i < script.steps.length) ? setTimeout(tick, stepMs) : null;
      if (!timer && opts.onDone) opts.onDone();
    }
    tick();
  }

  play();

  return {
    replay: function () { play(); },
    stop: stop,
    destroy: function () { stop(); mountEl.innerHTML = ""; },
  };
}

if (typeof module !== "undefined" && module.exports) {
  module.exports = { ttPlayScaffold: ttPlayScaffold, ttScaffoldGeom: ttScaffoldGeom };
}
// ==== MODULE tt_scaffold_play.js [END] ====
</script>
<script>
// ==== MODULE tt_panels.js [BEGIN] ====
// ============================================================================
// tt_panels.js — DOM renderers (skin-side). Thin wrappers over tt_view's pure
// ----------------------------------------------------------------------------
// view-model. Each factory takes a mount element + optional callback, renders
// into it, and emits answers OUT via the callback. NO engine calls, NO mastery
// state — the flow controller (tt_flow.js) wires engine ↔ panels. Appearance is
// deliberately minimal: semantic markup + CSS class hooks a skin styles later.
// Depends on tt_view.js (ttQuestionView / TT_BLANK). Assembled by cat.
// ============================================================================

// --- P1 Question (with the INLINE answer box in place of the missing number) ---
// The entry box IS the blank slot in the equation (§ user h10). Entry STATE lives
// in tt_flow (one place, shared with the keypad + physical keyboard); this panel
// only renders the box and exposes setEntry/mark to update its text + feedback tint.
function ttMountQuestion(el) {
  var entryEl = null;
  return {
    render: function (view) {
      el.innerHTML = ""; entryEl = null;
      view.slots.forEach(function (s) {
        if (s.blank) {
          entryEl = document.createElement("span");
          entryEl.className = "tt-slot tt-inline-entry"; entryEl.textContent = "";
          el.appendChild(entryEl);
        } else {
          var span = document.createElement("span");
          span.className = "tt-slot" + (s.sep ? " tt-sep" : "");
          span.textContent = s.text;
          el.appendChild(span);
        }
      });
    },
    setEntry: function (str) { if (entryEl) { entryEl.textContent = str; entryEl.classList.toggle("filled", !!str); } },
    mark: function (cls) { if (entryEl) entryEl.className = "tt-slot tt-inline-entry" + (cls ? " " + cls : ""); },
    // h15 copy-to-proceed hint: the child must COPY the revealed answer into this box
    // to advance, which is not self-evident. tt_flow arms it after an idle spell; all
    // this does is carry the class the skin styles.
    hint: function (on) { if (entryEl) entryEl.classList.toggle("tt-hint", !!on); }
  };
}

// --- P2/P3 Input (tiles OR keypad). DUMB: forwards presses; no entry state. -----
// handlers = { key: fn("0".."9"|"clear"|"enter"), submit: fn(value) }. Keypad keys
// call key(); a tile calls submit() directly. Physical keyboard is wired in tt_flow.
function ttMountInput(el, handlers) {
  function key(k) { if (handlers && handlers.key) handlers.key(k); }
  function submit(v) { if (handlers && handlers.submit) handlers.submit(v); }
  function renderTiles(view) {
    // >6 options can't fit one full-height landscape column at full size — flag
    // it so the skin drops the tile size a step (tt_skin_drill.css .tt-tiles-many).
    el.className = "tt-input tt-tiles" + (view.options.length > 6 ? " tt-tiles-many" : "");
    // Publish HALF the option count, rounded up, for the skin to lay the tiles out
    // in at most two lines (Kath, h14: "2 rows of 6 rather than 2 rows of 5") —
    // 12 options → 6 per line. This is arithmetic on the option count, a data fact;
    // the skin decides whether to spend it on columns (portrait) or rows (landscape).
    // Set in JS because CSS ceil() is too new to rely on in the target browser.
    el.style.setProperty("--tt-tile-half", Math.ceil(view.options.length / 2));
    view.options.forEach(function (opt) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "tt-tile"; b.textContent = opt;
      b.addEventListener("click", function () { submit(opt); });
      el.appendChild(b);
    });
  }
  function renderKeypad(view) {
    el.className = "tt-input tt-keypad";
    var pad = document.createElement("div"); pad.className = "tt-pad";
    ["1", "2", "3", "4", "5", "6", "7", "8", "9", "clear", "0", "enter"].forEach(function (k) {
      var b = document.createElement("button"); b.type = "button";
      b.className = "tt-key tt-key-" + k;
      b.textContent = k === "clear" ? "⌫" : (k === "enter" ? "OK" : k);
      b.addEventListener("click", function () { key(k); });
      pad.appendChild(b);
    });
    el.appendChild(pad);
  }
  return {
    render: function (view) {
      el.innerHTML = "";
      if (view.inputType === "tiles") renderTiles(view); else renderKeypad(view);
    }
  };
}

// --- P5 Feedback (S2a: inline, temporary; anti-praise / corrective) ------------
function ttMountFeedback(el) {
  return {
    show: function (fbView) { el.className = "tt-feedback tt-fb-" + fbView.kind; el.textContent = fbView.text; },
    clear: function () { el.className = "tt-feedback"; el.textContent = ""; }
  };
}

// --- Scaffold panel (Game 3): plays a tt_scaffold script + a replay button ------
// Generic DOM host for the array-scaffolding subsystem. Depends on ttBuildScaffold
// (tt_scaffold.js) + ttPlayScaffold (tt_scaffold_play.js). info = {a,b,op,level}.
// The corrective/copy-to-proceed GATE lives in tt_flow; this only renders + replays.
function ttMountScaffold(el) {
  var handle = null, wrap = null, onResize = null;
  // Fit-to-space (h12, Kath's "cap size, shrink beyond"): the pure generator
  // emits a full-size card; the SKIN owns appearance, so fitting the card to its
  // slot is a layout concern and lives here, not in tt_scaffold.js. When the slot
  // has a bounded box (the landscape grid's array cell — a definite minmax(0,1fr)
  // height with overflow:hidden), scale the card DOWN to fit; never scale up.
  // Portrait leaves the slot content-sized, so avail == natural → scale 1 (no-op).
  function fit() {
    if (!wrap) return;
    wrap.style.transform = "";                                  // measure natural size unscaled
    var availW = el.clientWidth, availH = el.clientHeight;
    // Measure the PANEL (the real content), NOT the wrap: the wrap is a flex item
    // in the slot and gets stretched to the slot's clamped height, so its
    // offsetHeight reports the CLAMP (availH), not the content — which made fit()
    // compute scale 1 and never shrink, so a tall array (10×5) overflowed and its
    // bottom rows were clipped by the slot (h12). The panel is a normal block,
    // so its offset size is the true natural size.
    var content = wrap.querySelector(".tt-scaffold-panel") || wrap;
    var w = content.offsetWidth, h = content.offsetHeight;
    if (!w || !h || !availW || !availH) return;
    var s = Math.min(1, availW / w, availH / h);
    // top-anchored: the panel starts at the wrap's top, so scale from the top so a
    // too-tall panel shrinks UP into view (center-origin would push its bottom out).
    wrap.style.transformOrigin = "center top";
    wrap.style.transform = s < 1 ? "scale(" + s + ")" : "";
  }
  return {
    show: function (info) {
      el.innerHTML = "";
      // wrap(relative) > stage(player mounts here) + replay(absolute, over the panel).
      // The player clears only `stage` on replay, so the ↻ button survives re-plays.
      wrap = document.createElement("div"); wrap.className = "tt-scaffold"; wrap.style.cssText = "position:relative;display:inline-block;";
      var stage = document.createElement("div"); stage.className = "tt-scaffold-stage";
      wrap.appendChild(stage);
      // L3 is the terminal caption only — nothing animates, so no "show me again"
      // (and the absolute ↻ would overlap the answer the child must copy; h12).
      if (info.level < 3) {
        var replay = document.createElement("button");
        replay.type = "button"; replay.className = "tt-scaffold-replay"; replay.textContent = "↻";
        replay.title = "Show me again"; replay.setAttribute("aria-label", "Show me again");
        replay.addEventListener("click", function () { if (handle) handle.replay(); });
        wrap.appendChild(replay);
      }
      el.appendChild(wrap);
      var script = ttBuildScaffold({ a: info.a, b: info.b, op: info.op, level: info.level, unknown: info.unknown,
                                     lead: info.lead });
      // onDone (h15): the copy-to-proceed hint must not be armed until the count has
      // FINISHED — at 1s per loop an 8-column array plays for 8 seconds, so a timer
      // started on entry would fire mid-explanation. Fires again after a replay.
      handle = ttPlayScaffold(stage, script, { onDone: info.onDone });
      el.style.display = "";
      if (typeof requestAnimationFrame !== "undefined") requestAnimationFrame(fit); else fit();
      if (typeof window !== "undefined" && !onResize) { onResize = fit; window.addEventListener("resize", onResize); }
    },
    // h15: carry the copy-to-proceed hint on the SLOT, so the skin can reach the
    // terminal answer inside without this module knowing the caption's structure.
    hint: function (on) { el.classList.toggle("tt-hint", !!on); },
    clear: function () {
      if (typeof window !== "undefined" && onResize) { window.removeEventListener("resize", onResize); onResize = null; }
      if (handle) { handle.destroy(); handle = null; } wrap = null; el.innerHTML = ""; el.style.display = "none";
      el.classList.remove("tt-hint");
    }
  };
}

// --- P6 Progress / achievements map (ported from tt_shell buildGridTable) -------
// The truthful progress visual: full N×N times-table square, mirrored cells share
// a colour (commutativity made visible). Header fill = per-table fluency ("getting
// speedy"); fluent spark; improved = outlined. Engine-agnostic: takes plain data, not `eng`.
// data: { N, grid (tt_getMasteryGrid output), tableFluency:{t:pct}, improved:[keys],
//         best:{key: tier} }  — best = BEST-EVER achievement tier (h16, tt_getAchievements).
// The child sees best-ever (a demotion never takes a star away); the adult card is honest.
// (`bridged` is no longer drawn: a ÷ unlock is now visible as the ÷ symbol, and it is
// already in `improved` — tt_openBridge adds it to factsImproved.)
// h16 (Kath "more colourful"): each cell is coloured + marked by its BEST-EVER stage —
// · × ? ÷ ★ ★ — replacing the old 9-step blue shading by confirmedRung (finer than a child
// needs, and all one hue). Classes tt-map-t0..t5 carry the palette (game_template CSS).
var TT_MAP_SYMS = ["", "×", "?", "÷", "★", "★"];
function ttMapKey() {
  var labels = ["", "times", "missing number", "divide", "silver star", "gold star"];
  var key = document.createElement("div"); key.className = "tt-map-key";
  for (var t = 1; t <= 5; t++) {
    var it = document.createElement("span"); it.className = "tt-map-key-item";
    it.innerHTML = "<span class='tt-map-sw tt-map-t" + t + "'>" + TT_MAP_SYMS[t] + "</span>" + labels[t];
    key.appendChild(it);
  }
  return key;
}
function ttMountMap(el) {
  function factKey(a, b) { var lo = Math.min(a, b), hi = Math.max(a, b); return lo + "x" + hi; }
  return {
    render: function (data) {
      var N = data.N, grid = data.grid || {}, fl = data.tableFluency || {}, best = data.best || {};
      var improved = {};
      (data.improved || []).forEach(function (k) { improved[k] = true; });
      function header(t) {
        var th = document.createElement("th"); th.textContent = t;
        var pct = fl[t] || 0;
        if (pct > 0) th.style.backgroundImage = "linear-gradient(to top, var(--tt-orange) " + pct + "%, transparent " + pct + "%)";
        return th;
      }
      var tbl = document.createElement("table"); tbl.className = "tt-map";
      var hr = document.createElement("tr"); hr.appendChild(document.createElement("th"));
      for (var c = 1; c <= N; c++) hr.appendChild(header(c));
      tbl.appendChild(hr);
      for (var r = 1; r <= N; r++) {
        var row = document.createElement("tr"); row.appendChild(header(r));
        for (var c2 = 1; c2 <= N; c2++) {
          var td = document.createElement("td");
          var k = factKey(r, c2), f = grid[k], t = best[k] || 0;
          td.className = "tt-map-t" + t;
          td.textContent = TT_MAP_SYMS[t];
          if (f && f.fluent) td.classList.add("tt-fluent");
          if (improved[k]) td.classList.add("tt-improved");   // got better THIS session (incl. ÷ unlocked)
          row.appendChild(td);
        }
        tbl.appendChild(row);
      }
      el.innerHTML = ""; el.appendChild(tbl); el.appendChild(ttMapKey());
    }
  };
}

// --- S3 Progress map (overlay: the achievements map) ----------------------------
// Not a nav screen — no back button. Shown on leaving a game and on demand from the
// Games menu (h16; the old timed mid-game checkpoint + its 5s auto-continue are gone —
// a map the child asked for must stay until they dismiss it). ▶ or a backdrop tap
// closes. show(mapData, onDone).
function ttMountCheckpoint(el) {
  var mapPanel = null;
  function done(cb) { el.style.display = "none"; if (cb) cb(); }
  return {
    show: function (mapData, onDone) {
      el.style.display = "";
      el.className = "tt-checkpoint";
      el.innerHTML = "<div class='tt-cp-card'><div class='tt-cp-title'>How you're doing</div>" +
                     "<div class='tt-cp-map'></div><button class='tt-cp-go' type='button'>▶</button></div>";
      mapPanel = ttMountMap(el.querySelector(".tt-cp-map"));
      mapPanel.render(mapData);
      el.querySelector(".tt-cp-go").onclick = function () { done(onDone); };
      el.onclick = function (e) { if (e.target === el) done(onDone); }; // tap the backdrop closes
    }
  };
}

// --- Adult progress card (h16; mirrors the reef's locked "Adult — progress summary") --
// HONEST current FOCUS tiers (tt_focusTier: what each fact is practised as now; the child
// map shows best-ever monotonic stages). Engine-
// agnostic: takes plain data. Lives on the adult screen, behind the grown-up gate.
// data: { N, ach (tt_getAchievements output), scopeText }
var TT_ACH_VIEW = [
  { sym: "·", label: "not started",                cls: "tt-map-t0" },   // same palette as the child map
  { sym: "×", label: "practising multiplication",  cls: "tt-map-t1" },
  { sym: "?", label: "practising missing numbers", cls: "tt-map-t2" },
  { sym: "÷", label: "practising division",        cls: "tt-map-t3" },
  { sym: "★", label: "silver — knows it every way", cls: "tt-map-t4" },
  { sym: "★", label: "gold — mastered",            cls: "tt-map-t5" },
];
function ttMountAchievements(el) {
  function factKey(a, b) { var lo = Math.min(a, b), hi = Math.max(a, b); return lo + "x" + hi; }
  return {
    render: function (data) {
      var N = data.N, ach = data.ach, facts = ach.facts;
      var card = document.createElement("div"); card.className = "tt-ach-card";
      var h = document.createElement("div"); h.className = "tt-ach-title"; h.textContent = "Progress summary"; card.appendChild(h);
      var ex = document.createElement("div"); ex.className = "tt-ach-explain";
      ex.innerHTML = "<b>×</b> <b>?</b> <b>÷</b> show what each fact is being practised as <b>right now</b>. " +
        "Every fact goes round × → ? → ÷ twice: first choosing from tiles, then typing from memory — so a fact " +
        "showing × again after ÷ has moved UP to recall, not slipped. " +
        "<span class='tt-map-sw tt-map-t4'>★</span> silver = every form, from memory. <span class='tt-map-sw tt-map-t5'>★</span> gold = also fast, and still right after time away. " +
        "<b>Silver is competent but may be slow or recent — only gold means long-term, automatic recall.</b> " +
        "This view is honest (a fact that slips shows it); the child's own map only ever shows their best. " +
        ach.total + " facts — 3×4 and 4×3 count once.";
      card.appendChild(ex);
      var counts = document.createElement("div"); counts.className = "tt-ach-counts";
      TT_ACH_VIEW.forEach(function (v, i) {
        var s = document.createElement("span");
        s.innerHTML = "<b>" + ach.counts[i] + "</b> <span class='tt-map-sw " + v.cls + "'>" + v.sym + "</span> " + v.label;
        counts.appendChild(s);
      });
      card.appendChild(counts);
      var tbl = document.createElement("table"); tbl.className = "tt-map tt-ach-grid";
      var hr = document.createElement("tr"); hr.appendChild(document.createElement("th"));
      for (var c = 1; c <= N; c++) { var th = document.createElement("th"); th.textContent = c; hr.appendChild(th); }
      tbl.appendChild(hr);
      for (var r = 1; r <= N; r++) {
        var row = document.createElement("tr"), rh = document.createElement("th"); rh.textContent = r; row.appendChild(rh);
        for (var c2 = 1; c2 <= N; c2++) {
          var td = document.createElement("td"), f = facts[factKey(r, c2)], t = f ? f.tier : 0;
          td.textContent = TT_ACH_VIEW[t].sym; td.className = TT_ACH_VIEW[t].cls;
          row.appendChild(td);
        }
        tbl.appendChild(row);
      }
      card.appendChild(tbl);
      if (data.scopeText) { var sc = document.createElement("div"); sc.className = "tt-ach-row"; sc.innerHTML = "Tables chosen by: <b>" + data.scopeText + "</b>"; card.appendChild(sc); }
      el.innerHTML = ""; el.appendChild(card);
    }
  };
}

<script>
// ==== MODULE tt_skin_pairs.js [BEGIN] ====
// ============================================================================
// tt_skin_pairs.js — GAME 1 "Pairs" SKIN, PURE half (DOM-free, cold-run tested)
// ----------------------------------------------------------------------------
// A Class-C chillout game (tables_architecture.md §3): engine-served content,
// records GRADED evidence. Full design: tables_game1_pairs_design.md.
//
// This module owns every DECISION; tt_skin_pairs_play.js owns the DOM and holds
// the engine context. Split so the rules that matter — which facts reach the
// board, and which answers are allowed to move the mastery model — are testable
// without a browser.
//
//   ttPairsPlan(states, opts)        → which facts, in board order, at which rung
//   ttPairsDeal(entries, rng)        → the shuffled 2N cards
//   ttPairsResolve(c1, c2)           → what a tap-pair means (match by VALUE)
//   ttPairsEvidenceOK(...)           → the §2.1 four-part evidence gate
//
// `states` come from tt_getFactStates (read-only, D2 — the skin never touches
// eng.facts). `rungSpecs` is the engine's real TT_RUNGS, passed in: the evidence
// gate is DERIVED from the ladder, so it cannot drift from the engine's grading.
// Assembled by cat (never a PowerShell round-trip).
// ============================================================================

var TT_PAIRS_N = 12;        // pairs per board (24 cards, 4 × 6)
var TT_PAIRS_COLS = 4;      // grid columns
// Reported reaction time. Deliberately far above every fast bar (max 9000 ms,
// tt_engine.js:53) so a Pairs answer can NEVER mark a rung fluent — the speed
// axis is meaningless when the child is scanning a board (game_layer §2a).
var TT_PAIRS_RT = 60000;
// Rung used to DISPLAY a fact whose own rung doesn't match the chosen form. Such
// a card is exposure only (never recorded), so this only has to produce a
// well-formed ask of the right shape.
var TT_PAIRS_SHOW_RUNG = { x: 3, q: 4, div: 5 };

// Setup-strip op id → the engine's rung form.
function ttPairsFormOf(op) {
  return op === "div" ? "division" : op === "q" ? "missingFactor" : "product";
}

// --- the evidence gate ------------------------------------------------------
// Rule 4 of §2.1: the fact's CURRENT working rung must ask exactly this form,
// with tiles. × → R1–R3 · ? → R4 · ÷ → R5; R6–R8 are keypad recall and record
// nothing ("it does not count as evidence where the question asked is already at
// a higher level and requires keypad entry for progress" — Kath h13). R5 is
// bridge-gated by the engine, so "no ÷ evidence before the bridge" is automatic.
function ttPairsRecordable(s, op, rungSpecs) {
  if (!s.seen) return false;                       // rule 3: top-ups are exposure only
  var spec = rungSpecs[s.rung];
  if (!spec || spec.opts === null || spec.opts === "intro") return false;
  return spec.form === ttPairsFormOf(op);
}

// Rules 1, 2 and 3/4 together, at the moment a tap-pair resolves.
//   res          — from ttPairsResolve
//   entry        — the board entry for the question card (carries .attempted, .recordable)
//   matchedCount — pairs already cleared BEFORE this resolution
//   n            — pairs on the board
function ttPairsEvidenceOK(res, entry, matchedCount, n) {
  if (!res || res.kind !== "qa") return false;     // two of a kind: not an answer to anything
  if (!entry || entry.attempted) return false;     // rule 1: first attempt per question card
  if (!entry.recordable) return false;             // rules 3 + 4
  return matchedCount < Math.ceil(n / 2);          // rule 2: first half only
}

// --- selection --------------------------------------------------------------
// Priority tier (design §5.1) — Kath's "in flight, fairly new, being reinforced".
// Lower = asked sooner.
function ttPairsTier(s, nowTs) {
  if (s.reinforceLeft > 0) return 0;                          // post-error rebuild
  if (s.inFlux) return 1;                                     // counts toward the WIP cap
  if (s.phase === "acquiring") return 2;                      // new / unconfirmed
  if (s.dueAtTs !== 0 && nowTs >= s.dueAtTs) return 3;        // retention overdue
  return 4;                                                   // resting
}

// Rank every in-scope fact. Seen facts first (by tier, then recordable-for-this-
// form, then stalest); unseen facts last, easiest first — they are the §5.2
// top-up that keeps the board at 12 for a child who has barely played.
function ttPairsRank(states, opts) {
  var op = opts.op, specs = opts.rungSpecs, tables = opts.tables || [];
  var nowTs = opts.nowTs || 0, qCount = opts.qCount || 0, rng = opts.rng || Math.random;
  var seen = [], unseen = [];
  for (var i = 0; i < states.length; i++) {
    var s = states[i];
    if (tables.length && tables.indexOf(s.a) < 0 && tables.indexOf(s.b) < 0) continue;
    // One random key per fact per call — the FINAL tiebreak (below). Drawn here,
    // not inside the comparator, because a comparator that isn't a consistent
    // ordering produces undefined sort results.
    if (s.seen) { seen.push({ s: s, r: rng() }); } else { unseen.push(s); }
  }
  seen.sort(function (P, Q) {
    var p = P.s, q = Q.s;
    var tp = ttPairsTier(p, nowTs), tq = ttPairsTier(q, nowTs);
    if (tp !== tq) return tp - tq;
    // Within a tier, facts Pairs can actually record for go first (Kath's "prefer
    // bridged" for ÷, generalised to all three forms — design §5.1).
    var rp = ttPairsRecordable(p, op, specs) ? 0 : 1, rq = ttPairsRecordable(q, op, specs) ? 0 : 1;
    if (rp !== rq) return rp - rq;
    // "In flight" means PRACTISED, not merely introduced. Placement seeds a large
    // block of facts at once (measured h13: a 16-question start left all 78 seen
    // facts in the same tier, never asked), so without this a placement-seeded
    // fact the child has never actually answered outranks one they are working on.
    var ap = p.lastAskedAtQ > -999 ? 0 : 1, aq = q.lastAskedAtQ > -999 ? 0 : 1;
    if (ap !== aq) return ap - aq;
    var sp = qCount - p.lastAskedAtQ, sq = qCount - q.lastAskedAtQ;
    if (sp !== sq) return sq - sp;                  // stalest first
    return P.r - Q.r;                               // equals: RANDOM, not introIdx
  });
  // Unseen top-ups keep the easiest-first order — a fact the drill has never
  // taught should at least be an easy one (§5.2).
  unseen.sort(function (p, q) { return p.introIdx - q.introIdx; });
  return seen.map(function (P) { return P.s; }).concat(unseen);
}

// Which table should sit in the SECOND / divisor slot. 0 = no preference (no
// table chosen, a square, or both factors chosen — let the coin decide).
function ttPairsOrientTable(a, b, tables) {
  if (!tables || !tables.length || a === b) return 0;
  var ia = tables.indexOf(a) >= 0, ib = tables.indexOf(b) >= 0;
  if (ia && ib) return 0;
  return ia ? a : ib ? b : 0;
}

// tt_describe reads its coin flips in a fixed order — swap (tt_engine.js:399),
// then hideFirst (:415) or byA (:422). Scripting those flips is how Pairs pins
// the chosen table into the second / divisor slot ("3 × 7 =", "▢ × 7 = 21",
// "21 ÷ 7 =") the way the exemplar does, WITHOUT hand-building a descriptor.
// [] = leave orientation to chance (the engine's default, SPEC §1 both orders).
function ttPairsOrientSeq(op, a, b, table) {
  if (!table) return [];
  var aIsTable = (a === table);
  if (op === "div") return [0.5, aIsTable ? 0.25 : 0.75];   // byA → divide BY the table
  var swap = aIsTable ? 0.25 : 0.75;                        // put the table second
  return op === "q" ? [swap, 0.25] : [swap];                // q: hide the FIRST factor
}
// Feed a scripted head, then fall through to the real rng (distractor draws must
// stay random — a fixed tail would make every R2/R3 board identical).
function ttPairsRng(seq, base) {
  var i = 0, r = base || Math.random;
  return function () { return i < seq.length ? seq[i++] : r(); };
}

// The board plan: which facts, in order, at which rung, oriented how, and whether
// their answers will be evidence. Descriptors are built by the caller (it holds
// the engine) — everything else is decided here.
function ttPairsPlan(states, opts) {
  var op = opts.op, specs = opts.rungSpecs, n = opts.n || TT_PAIRS_N;
  var ranked = ttPairsRank(states, opts), plan = [];
  for (var i = 0; i < ranked.length && plan.length < n; i++) {
    var s = ranked[i], rec = ttPairsRecordable(s, op, specs);
    plan.push({
      key: s.key, a: s.a, b: s.b,
      rung: rec ? s.rung : TT_PAIRS_SHOW_RUNG[op],
      recordable: rec,
      orient: ttPairsOrientSeq(op, s.a, s.b, ttPairsOrientTable(s.a, s.b, opts.tables)),
    });
  }
  return plan;
}

// --- cards ------------------------------------------------------------------
// Card face for a question. A TRAILING blank is dropped ("3 × 7 =", as the
// exemplar reads); a mid-expression blank keeps the drill's ▢ glyph so the two
// games spell a missing number the same way.
function ttPairsCardText(view) {
  var s = view.slots;
  if (s.length && s[s.length - 1].blank) s = s.slice(0, s.length - 1);
  return s.map(function (x) { return x.blank ? TT_BLANK : x.text; }).join(" ");
}

function ttPairsShuffle(arr, rng) {
  var r = rng || Math.random;
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(r() * (i + 1)), t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}

// entries[i] = { qText, answer, ... } → the shuffled 2N cards.
function ttPairsDeal(entries, rng) {
  var cards = [];
  for (var i = 0; i < entries.length; i++) {
    cards.push({ id: "q" + i, kind: "q", item: i, value: entries[i].answer, text: entries[i].qText });
    cards.push({ id: "a" + i, kind: "a", item: i, value: entries[i].answer, text: String(entries[i].answer) });
  }
  return ttPairsShuffle(cards, rng);
}

function ttPairsGrid(cardCount) {
  return { cols: TT_PAIRS_COLS, rows: Math.ceil(cardCount / TT_PAIRS_COLS) };
}

// What a tap-pair means. Match is by answer VALUE, never card identity (§5.4):
// with 3×8 and 4×6 both on the board, either 24 card answers "3 × 8 =" — because
// it does. Marking that wrong to protect a pairing would be dishonest, and the
// distinctness constraint is what forced the exemplar to drop facts it wanted.
function ttPairsResolve(c1, c2) {
  if (!c1 || !c2 || c1.id === c2.id) return null;
  if (c1.kind === c2.kind) return { kind: "same", match: false, qIndex: null };
  var q = c1.kind === "q" ? c1 : c2, ans = c1.kind === "q" ? c2 : c1;
  return { kind: "qa", match: ans.value === q.value, qIndex: q.item };
}

if (typeof module !== "undefined" && module.exports) {
  module.exports = {
    TT_PAIRS_N: TT_PAIRS_N, TT_PAIRS_RT: TT_PAIRS_RT, TT_PAIRS_SHOW_RUNG: TT_PAIRS_SHOW_RUNG,
    ttPairsFormOf: ttPairsFormOf, ttPairsRecordable: ttPairsRecordable,
    ttPairsEvidenceOK: ttPairsEvidenceOK, ttPairsTier: ttPairsTier, ttPairsRank: ttPairsRank,
    ttPairsOrientTable: ttPairsOrientTable, ttPairsOrientSeq: ttPairsOrientSeq, ttPairsRng: ttPairsRng,
    ttPairsPlan: ttPairsPlan, ttPairsCardText: ttPairsCardText, ttPairsShuffle: ttPairsShuffle,
    ttPairsDeal: ttPairsDeal, ttPairsGrid: ttPairsGrid, ttPairsResolve: ttPairsResolve,
  };
}

// ============================================================================
// end tt_skin_pairs.js
// ============================================================================
// ==== MODULE tt_skin_pairs.js [END] ====
</script>
<script>
// ==== MODULE tt_skin_pairs_play.js [BEGIN] ====
// ============================================================================
// tt_skin_pairs_play.js — GAME 1 "Pairs" SKIN, DOM half (browser-verified)
// ----------------------------------------------------------------------------
// Renders the setup strip + the card board, and drives taps. Every DECISION —
// which facts, which orientation, what a tap-pair means, whether an answer is
// evidence — lives in tt_skin_pairs.js (pure, cold-run tested). This file holds
// only DOM and the engine CONTEXT handed in by tt_flow (D2: no engine reference).
//
//   ttMakePairs(els) → { start(ctx), stop() }   — tt_flow calls these on entering
//                                                 and leaving the Pairs screen.
// ctx (from tt_flow):
//   rungSpecs              the engine's real TT_RUNGS (the evidence gate reads it)
//   scope()                { control:"game"|"adult"|"child", tables, strict }
//   factStates()           tt_getFactStates — read-only scheduling state
//   qCount()               engine question counter (staleness ranking)
//   describe(key,rung,seq) a REAL engine descriptor, orientation scripted by seq
//   record(d, correct)     serve + record, reveal-safe (tt_flow.pairsRecord)
// Design: tables_game1_pairs_design.md. Assembled by cat.
// ============================================================================

// Photos revealed under the cards. Attribution is a LICENCE REQUIREMENT for the
// CC BY / CC BY-SA images — the credit line is not decoration, don't drop it.
//
// `focal: [x, y]` (OPTIONAL, 0..1) is the photo's `object-position`. The board is
// `object-fit: cover`, and its aspect is NOT fixed — 0.568 in computer-picks
// portrait (no table row → tallest board, narrowest crop window), 0.729 with the
// table row, 2.76 in landscape. A centre crop therefore cuts any subject that
// isn't near the middle. Omit `focal` when the subject IS central (ten of these);
// set it when it is not, so the crop follows the animal instead of the frame.
// This replaces hand-cropping the files (h13): a crop throws away the margin the
// other board shapes need, which is what clipped the goat in landscape. Pick a new
// photo's focal point ONCE; never edit the image. Design §12.
var TT_PAIRS_ANIMALS = [
  { src: "images/panda.jpg", alt: "Baby panda cub", credit: "Sheila Lau, public domain, via Wikimedia Commons" },
  { src: "images/bunny.jpg", alt: "Baby rabbit", credit: "Siddharth Patil, CC0, via Wikimedia Commons", focal: [0.62, 0.30] },   // rabbit sits right of centre, low in the grass
  { src: "images/fox.jpg", alt: "Young red fox", credit: "CC0, via Wikimedia Commons" },
  { src: "images/kitten.jpg", alt: "Curious kitten", credit: "Dimitri Houtteman, CC0, via Wikimedia Commons" },
  { src: "images/puppy.jpg", alt: "Puppy in leaves", credit: "C. E. Price, public domain, via Wikimedia Commons" },
  { src: "images/piglet.jpg", alt: "Piglet", credit: "Petr Kratochvil, CC0, via Wikimedia Commons", focal: [0.5, 0.35] },   // portrait source: head high in a wide strip
  { src: "images/chick_duckling.jpg", alt: "Chick and duckling", credit: "CDC, public domain, via Wikimedia Commons", focal: [0.5, 0.18] },   // portrait source: both heads near the top
  { src: "images/lamb.jpg", alt: "Lamb", credit: "Virginie Moerenhout, CC BY 2.0, via Wikimedia Commons", focal: [0.5, 0.15] },   // portrait source: head near the top
  { src: "images/elephant.jpg", alt: "Elephant calf with mother", credit: "Tontan Travel, CC BY-SA 2.0, via Wikimedia Commons" },
  // goat sits in the left third of its frame; rat: frames the right-hand rat
  { src: "images/goat.jpg", alt: "Young goat jumping", credit: "Wilfredor, CC0, via Wikimedia Commons", focal: [0.19, 0.49] },
  { src: "images/rat.jpg", alt: "Young pet rat", credit: "Sarah Fleming (SMercury98), CC BY 2.0, via Wikimedia Commons", focal: [0.94, 0.58] },
  { src: "images/hedgehog.jpg", alt: "Young hedgehog", credit: "Tony Wills, CC BY-SA 3.0, via Wikimedia Commons", focal: [0.5, 0.40] }   // portrait-ish source, subject above centre
];

// This project's difficulty groups (TT_GROUPS), NOT the exemplar's level sets.
var TT_PAIRS_GROUPS = [[1, 2, 5, 10], [3, 4, 8, 11], [6, 7, 9, 12]];
var TT_PAIRS_TABLES_UP_TO = 12;
var TT_PAIRS_MATCH_MS = 350, TT_PAIRS_WRONG_MS = 650;

function ttMakePairs(els) {
  var ctx = null, live = false;
  var op = null;                    // "x" | "q" | "div"
  var entries = [], firstPick = null, busy = false, matched = 0;

  // --- setup strip ---------------------------------------------------------
  (function buildOps() {
    var defs = [
      { op: "x", label: "3 " + String.fromCharCode(215) + " 7 =" },
      { op: "q", label: TT_BLANK + " " + String.fromCharCode(215) + " 7 = 21" },
      { op: "div", label: "21 " + String.fromCharCode(247) + " 7 =" }
    ];
    defs.forEach(function (d) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "tt-chip tt-pairs-op"; b.textContent = d.label; b.dataset.op = d.op;
      b.addEventListener("click", function () {
        op = d.op;
        Array.prototype.forEach.call(els.ops.children, function (c) { c.classList.toggle("sel", c === b); });
        hint("");
      });
      els.ops.appendChild(b);
    });
  })();

  (function buildTables() {
    for (var t = 1; t <= TT_PAIRS_TABLES_UP_TO; t++) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "tt-chip"; b.textContent = t; b.dataset.t = t;
      b.addEventListener("click", function () { this.classList.toggle("sel"); hint(""); });
      els.tables.appendChild(b);
    }
    TT_PAIRS_GROUPS.forEach(function (g) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "tt-group"; b.textContent = g.join("·"); b.dataset.g = g.join(",");
      b.addEventListener("click", function () {
        var set = g.map(String);
        Array.prototype.forEach.call(els.tables.children, function (c) {
          if (set.indexOf(c.dataset.t) >= 0 && !c.disabled) c.classList.add("sel");
        });
        hint("");
      });
      els.groups.appendChild(b);
    });
  })();

  function hint(m) { els.hint.textContent = m; }
  function selectedTables() {
    return Array.prototype.map.call(els.tables.querySelectorAll(".sel"), function (c) { return +c.dataset.t; });
  }

  // Which table chips this mode allows. game → the row is hidden entirely (the
  // engine picks); adult → only the adult's tables (their restriction still
  // binds inside Pairs); child → all of them, and the choice overrides the daily
  // pick FOR PAIRS ONLY (it never writes flow.setChildTables). Design §3.
  function syncScope() {
    var s = ctx.scope(), control = s.control;
    els.tablesWrap.style.display = (control === "game") ? "none" : "";
    if (control === "game") return;
    var allowed = (control === "adult" && s.tables.length) ? s.tables : null;
    Array.prototype.forEach.call(els.tables.children, function (c) {
      var ok = !allowed || allowed.indexOf(+c.dataset.t) >= 0;
      c.disabled = !ok;
      c.classList.toggle("off", !ok);
      c.classList.toggle("sel", !!allowed && ok);     // adult set → preselect it all
    });
  }

  // --- board ---------------------------------------------------------------
  function status() {
    els.status.textContent = entries.length
      ? matched + " of " + entries.length + " pairs found"
      : "Pick how the question looks, then press New Game";
  }

  function newGame() {
    if (!op) { hint("Pick how the question looks first."); return; }
    var control = ctx.scope().control;
    var tables = (control === "game") ? [] : selectedTables();
    if (control !== "game" && !tables.length) { hint("Pick a times table first."); return; }
    hint("");

    var plan = ttPairsPlan(ctx.factStates(), {
      op: op, tables: tables, rungSpecs: ctx.rungSpecs,
      nowTs: Date.now(), qCount: ctx.qCount(), n: TT_PAIRS_N
    });
    entries = [];
    for (var i = 0; i < plan.length; i++) {
      var p = plan[i], d = ctx.describe(p.key, p.rung, p.orient);
      if (!d) continue;
      entries.push({
        d: d, answer: d.correctAnswer, qText: ttPairsCardText(ttQuestionView(d)),
        recordable: p.recordable, attempted: false
      });
    }
    if (!entries.length) { hint("No questions available yet — try the drill first."); return; }

    firstPick = null; busy = false; matched = 0;
    els.done.textContent = "";
    var animal = TT_PAIRS_ANIMALS[Math.floor(Math.random() * TT_PAIRS_ANIMALS.length)];
    els.img.src = animal.src; els.img.alt = animal.alt;
    // Follow the subject, not the frame's centre (see TT_PAIRS_ANIMALS). Cleared,
    // not left set, when a photo has no focal point — the element is reused.
    els.img.style.objectPosition = animal.focal
      ? (animal.focal[0] * 100) + "% " + (animal.focal[1] * 100) + "%" : "";
    els.credit.textContent = "Photo: " + animal.alt + " — " + animal.credit;

    var cards = ttPairsDeal(entries), g = ttPairsGrid(cards.length);
    els.grid.innerHTML = "";
    els.grid.style.gridTemplateColumns = "repeat(" + g.cols + ", minmax(0, 1fr))";
    els.grid.style.gridTemplateRows = "repeat(" + g.rows + ", minmax(0, 1fr))";
    cards.forEach(function (card) {
      var el = document.createElement("div");
      el.className = "tt-pairs-card tt-pairs-" + card.kind;
      el.textContent = card.text;
      el.addEventListener("click", function () { onTap(el, card); });
      els.grid.appendChild(el);
    });
    status();
  }

  function onTap(el, card) {
    if (busy || !entries.length) return;
    if (el.classList.contains("matched") || el.classList.contains("sel")) return;
    el.classList.add("sel");
    if (!firstPick) { firstPick = { el: el, card: card }; return; }

    busy = true;
    var res = ttPairsResolve(firstPick.card, card);
    if (res && res.kind === "qa") {
      var entry = entries[res.qIndex];
      // §2.1: the gate decides; `attempted` is set either way, so a retry after a
      // miss can never be a second recorded wrong (which is what demotes).
      if (ttPairsEvidenceOK(res, entry, matched, entries.length)) ctx.record(entry.d, res.match);
      entry.attempted = true;
    }
    if (res && res.match) settle(el, true); else settle(el, false);
  }

  function settle(secondEl, isMatch) {
    var a = firstPick.el, b = secondEl;
    if (!isMatch) { a.classList.add("wrong"); b.classList.add("wrong"); }
    setTimeout(function () {
      a.classList.remove("sel", "wrong"); b.classList.remove("sel", "wrong");
      if (isMatch) {
        a.classList.add("matched"); b.classList.add("matched");
        matched++;
        status();
        // Anti-praise (PRINCIPLES §1): state the fact, no celebration. The photo
        // is left completely clear — no overlay, no dimming (Kath h13).
        if (matched === entries.length) els.done.textContent = "All done!";
      }
      firstPick = null; busy = false;
    }, isMatch ? TT_PAIRS_MATCH_MS : TT_PAIRS_WRONG_MS);
  }

  function reset() {
    entries = []; firstPick = null; busy = false; matched = 0;
    els.grid.innerHTML = ""; els.img.removeAttribute("src"); els.img.alt = ""; els.img.style.objectPosition = "";
    els.credit.textContent = ""; els.done.textContent = ""; hint("");
    status();
  }

  els.newGame.addEventListener("click", function () { if (live) newGame(); });

  return {
    start: function (c) { ctx = c; live = true; reset(); syncScope(); },
    stop: function () { live = false; reset(); },
  };
}

// ============================================================================
// end tt_skin_pairs_play.js
// ============================================================================
// ==== MODULE tt_skin_pairs_play.js [END] ====
</script>
<script>
// ==== MODULE tt_skin_pop.js [BEGIN] ====
// ============================================================================
// tt_skin_pop.js — GAME 2 "Pop" SKIN, PURE half (DOM-free, cold-run tested)
// ----------------------------------------------------------------------------
// A Class-C chillout game (tables_architecture.md §3). Answer bubbles rise
// through a cave; pop the one that fills the box. Exemplar: Small maths
// games/Pop/index.html. Design: tables_game2_pop_design.md.
//
// The QUESTION and the WRONG ANSWERS both come from the engine: the fact is
// chosen from tt_getFactStates, the ask is a real tt_describe descriptor at the
// fact's own rung, and the bubbles are that descriptor's scaffold.options.
// Pop's own random generator is gone.
//
//   ttPopRecordable(s, rungSpecs)   → is this fact's answer evidence? (tile rung)
//   ttPopShowRung(s, rungSpecs)     → rung to DISPLAY it at
//   ttPopPick(states, opts)         → the next fact (recordable first; R6+ only if needed)
//   ttPopEquation(d)                → coloured tokens + array dimensions for a descriptor
//   ttPopEvidenceOK(q)              → first answer on a recordable question only
//
// Reuses ttPairsTier (tt_skin_pairs.js) — the same "in flight" priority. Load order:
// tt_skin_pairs.js before this file. Assembled by cat.
// ============================================================================

// Far above every fast bar (max 9000 ms) — a bubble can take seconds to surface,
// so reaction time is not retrieval time and Pop must never mark a rung fluent.
var TT_POP_RT = 60000;
// Facts served in the last N questions are skipped while anything else is available.
var TT_POP_RECENT = 3;
// Pick at random among the top N of the ranked list — variety without losing priority.
var TT_POP_TOP = 3;

// Evidence (Kath h17): only where the drill would be asking with TILES (R1–R5).
// Keypad rungs (R6–R8) can still be SHOWN (if needed) but never record —
// popping a bubble is recognition, not recall.
function ttPopRecordable(s, specs) {
  if (!s || !s.seen) return false;
  var spec = specs[s.rung];
  return !!spec && spec.opts !== null && spec.opts !== "intro";
}

// Display rung. A recordable fact is shown at its own rung (so the form and the
// bubbles are exactly what the drill would ask). A keypad-rung fact is shown at
// the tile rung of the same form: R6 × → R3, R7 ? → R4, R8 ÷ → R5 (R8 implies the
// bridge is open, so R5 is reachable). Unseen top-ups show at R1.
function ttPopShowRung(s, specs) {
  if (ttPopRecordable(s, specs)) return s.rung;
  if (!s.seen) return 1;
  var spec = specs[s.rung] || {};
  if (spec.form === "division") return 5;
  if (spec.form === "missingFactor") return 4;
  return 3;
}

function ttPopInScope(s, tables) {
  return !tables || !tables.length || tables.indexOf(s.a) >= 0 || tables.indexOf(s.b) >= 0;
}

// Order one tier: priority (ttPairsTier), then stalest. Random final tiebreak,
// drawn once per fact (a comparator must be a consistent ordering).
function ttPopRank(list, nowTs, qCount, rng) {
  var keyed = list.map(function (s) { return { s: s, r: rng() }; });
  keyed.sort(function (P, Q) {
    var tp = ttPairsTier(P.s, nowTs), tq = ttPairsTier(Q.s, nowTs);
    if (tp !== tq) return tp - tq;
    var sp = qCount - P.s.lastAskedAtQ, sq = qCount - Q.s.lastAskedAtQ;
    if (sp !== sq) return sq - sp;
    return P.r - Q.r;
  });
  return keyed.map(function (k) { return k.s; });
}

// The next fact.
//   opts.rungSpecs  TT_RUNGS
//   opts.kind       "any" | "mainly" | "only"   (tt_modeInfo of the session mode)
//   opts.tables     focus tables or null
//   opts.recent     fact keys served most recently (newest last)
//   opts.nowTs, opts.qCount, opts.rng
// Tiers, first non-empty wins: (A) seen + recordable → (B) seen keypad-rung, shown
// but not recorded — "if needed" (Kath h17) → (C) unseen, easiest first, exposure.
// Recency is honoured across tiers first; only if EVERY tier is exhausted by it
// is it waived. So one lonely tile-rung fact alternates with R6+ facts rather
// than being asked back-to-back.
function ttPopPick(states, opts) {
  var specs = opts.rungSpecs, rng = opts.rng || Math.random;
  var recent = opts.recent || [], tables = opts.tables || null;
  var pool = states;
  if (tables && tables.length) {
    var inScope = states.filter(function (s) { return ttPopInScope(s, tables); });
    // "only" restricts; "mainly" prefers but falls back to everything.
    if (opts.kind === "only" || inScope.some(function (s) { return s.seen; })) pool = inScope;
  }
  var A = [], B = [], C = [];
  pool.forEach(function (s) {
    if (ttPopRecordable(s, specs)) A.push(s);
    else if (s.seen) B.push(s);
    else C.push(s);
  });
  C.sort(function (p, q) { return p.introIdx - q.introIdx; });

  function choose(ignoreRecent) {
    var tiers = [A, B, C];
    for (var t = 0; t < tiers.length; t++) {
      var list = ignoreRecent ? tiers[t] : tiers[t].filter(function (s) { return recent.indexOf(s.key) < 0; });
      if (!list.length) continue;
      var ranked = t === 2 ? list : ttPopRank(list, opts.nowTs || 0, opts.qCount || 0, rng);
      var top = Math.min(TT_POP_TOP, ranked.length);
      return ranked[Math.floor(rng() * top)];
    }
    return null;
  }
  var s = choose(false) || choose(true);
  if (!s) return null;
  return { key: s.key, a: s.a, b: s.b, rung: ttPopShowRung(s, specs), recordable: ttPopRecordable(s, specs) };
}

// Descriptor → Pop's coloured equation. Roles (Pop's array): a = ROWS (orange,
// left), b = COLUMNS (blue, top), c = the product (inside the grid).
//   product      a × b = ?
//   missing 1st  ? × b = c        missing 2nd  a × ? = c
//   division     c ÷ a = ?        (divisor = rows, quotient = columns)
// toks: strings are operators; [role, value] are numbers. `miss` = the unknown's role.
function ttPopEquation(d) {
  var p = d.presented, ans = d.correctAnswer, a, b, c, toks, miss;
  if (p.op === "÷") {
    c = p.left; a = p.right; b = ans; miss = "b";
    toks = [["c", c], "÷", ["a", a], "=", ["b", b]];
  } else if (p.missingSlot === "factor1") {
    a = ans; b = p.left; c = p.right; miss = "a";
    toks = [["a", a], "×", ["b", b], "=", ["c", c]];
  } else if (p.missingSlot === "factor2") {
    a = p.left; b = ans; c = p.right; miss = "b";
    toks = [["a", a], "×", ["b", b], "=", ["c", c]];
  } else {
    a = p.left; b = p.right; c = a * b; miss = "c";
    toks = [["a", a], "×", ["b", b], "=", ["c", c]];
  }
  return { a: a, b: b, c: c, toks: toks, miss: miss, ans: ans };
}

// The bubble values: the engine's options (they include the answer). Deduped —
// a value already floating is never spawned twice.
function ttPopBubbleValues(d) {
  var o = (d.scaffold && d.scaffold.options) || [d.correctAnswer], seen = {}, out = [];
  for (var i = 0; i < o.length; i++) if (!seen[o[i]]) { seen[o[i]] = true; out.push(o[i]); }
  if (!seen[d.correctAnswer]) out.push(d.correctAnswer);
  return out;
}

// One answer per question is evidence: the FIRST, and only if recordable.
// q = { recordable, attempted }.
function ttPopEvidenceOK(q) {
  return !!q && !!q.recordable && !q.attempted;
}

if (typeof module !== "undefined" && module.exports) {
  module.exports = {
    TT_POP_RT: TT_POP_RT, TT_POP_RECENT: TT_POP_RECENT, TT_POP_TOP: TT_POP_TOP,
    ttPopRecordable: ttPopRecordable, ttPopShowRung: ttPopShowRung, ttPopPick: ttPopPick,
    ttPopEquation: ttPopEquation, ttPopBubbleValues: ttPopBubbleValues, ttPopEvidenceOK: ttPopEvidenceOK,
  };
}

// ============================================================================
// end tt_skin_pop.js
// ============================================================================
// ==== MODULE tt_skin_pop.js [END] ====
</script>
<script>
// ==== MODULE tt_skin_pop_play.js [BEGIN] ====
// ============================================================================
// tt_skin_pop_play.js — GAME 2 "Pop" SKIN, DOM half (browser-verified)
// ----------------------------------------------------------------------------
// Ported from the Pop exemplar (Small maths games/Pop/index.html): rising answer
// bubbles, the cave scene, the crab. Every DECISION — which fact, which rung,
// which bubbles, whether an answer is evidence — lives in tt_skin_pop.js (pure,
// cold-run tested). This file holds only DOM/canvas and the engine CONTEXT handed
// in by tt_flow (D2: no engine reference).
//
//   ttMakePop(root) → { start(ctx), stop() }   — tt_flow calls these on entering
//                                                 and leaving the Pop screen.
// ctx (from tt_flow — the same surface Pairs gets, plus focus()):
//   rungSpecs, factStates(), qCount(), describe(key,rung,seq), record(d,correct),
//   focus() → { kind, tables }   the session's resolved scope (tt_modeInfo)
//
// Kath h17 changes from the exemplar: question + bubbles from the engine; the
// array card is HIDDEN until the first wrong tap (then it stays, as help); a
// wrong tap only wiggles — no message — and the bubbles keep rising. Score,
// streak lines and crab celebrations are kept as the exemplar has them.
// Scene code is the exemplar's (ES6), kept close to the original on purpose.
// Design: tables_game2_pop_design.md. Assembled by cat.
// ============================================================================

function ttMakePop(root) {
  'use strict';
  // ───────── tunables (exemplar values) ─────────
  const CROSS_MIN = 6.5, CROSS_MAX = 10;   // seconds for a bubble to cross the screen
  const SPAWN_MIN = 0.9, SPAWN_MAX = 1.4;  // seconds between spawns
  const HOLD_BY_TIER = [1700, 1800, 2400, 3000];
  const MAX_DIGITS = 3;

  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = rnd(0, i); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };

  // ───────── DOM (built once, inside the screen section) ─────────
  root.innerHTML =
    '<canvas class="tt-pop-cave"></canvas>' +
    '<div class="tt-pop-top"><span class="tt-pop-score"></span><span class="tt-pop-streak"></span><button class="tt-pop-mute" type="button" title="Sound">🔊</button></div>' +
    '<div class="tt-pop-eq"></div>' +
    '<div class="tt-pop-fb"></div>' +
    '<div class="tt-pop-panel"><div class="tt-pop-card hidden"></div></div>' +
    '<div class="tt-pop-empty" style="display:none"></div>' +
    '<div class="tt-pop-stage"></div>';
  const $ = cls => root.querySelector('.tt-pop-' + cls);
  const stage = $('stage'), cv = $('cave'), g = cv.getContext('2d');

  // ───────── state ─────────
  let ctx = null, live = false, raf = 0;
  let q = null, state = 'play', typed = '';
  let score = 0, total = 0, streak = 0;
  let bubbles = [], bag = [], spawnTimer = 0.2, exprTimer = null, newQTimer = null;
  let recent = [];                       // fact keys, newest last (ttPopPick recency)

  // ───────── sound ─────────
  let actx = null, muted = false;
  function audio() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } return actx; }
  function tone(freq, t0, dur, type, vol, freq2) {
    const a = audio(); if (!a || muted) return;
    const o = a.createOscillator(), gn = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, a.currentTime + t0);
    if (freq2) o.frequency.exponentialRampToValueAtTime(freq2, a.currentTime + t0 + dur);
    gn.gain.setValueAtTime(vol, a.currentTime + t0);
    gn.gain.exponentialRampToValueAtTime(0.001, a.currentTime + t0 + dur);
    o.connect(gn); gn.connect(a.destination); o.start(a.currentTime + t0); o.stop(a.currentTime + t0 + dur + 0.02);
  }
  function snd(k) {
    if (k === 'pop')    tone(420, 0, 0.09, 'sine', 0.25, 1000);
    if (k === 'ding')   { tone(660, 0.05, 0.25, 'sine', 0.18); tone(880, 0.12, 0.3, 'sine', 0.15); }
    if (k === 'wrong')  tone(220, 0, 0.3, 'sawtooth', 0.1, 110);
    if (k === 'streak') [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.09, 0.25, 'triangle', 0.16));
  }
  $('mute').onclick = () => { muted = !muted; $('mute').textContent = muted ? '🔇' : '🔊'; };
  root.addEventListener('pointerdown', () => audio());

  // ───────── question: from the ENGINE (tt_skin_pop.js decides) ─────────
  function makeQuestion() {
    const f = ctx.focus();
    const pick = ttPopPick(ctx.factStates(), {
      rungSpecs: ctx.rungSpecs, kind: f.kind, tables: f.tables, recent: recent,
      nowTs: Date.now(), qCount: ctx.qCount(), rng: Math.random
    });
    if (!pick) return null;
    const d = ctx.describe(pick.key, pick.rung, []);
    if (!d) return null;
    recent.push(pick.key); if (recent.length > TT_POP_RECENT) recent.shift();
    const eq = ttPopEquation(d);
    return { d: d, a: eq.a, b: eq.b, c: eq.c, toks: eq.toks, miss: eq.miss, ans: eq.ans,

             wrong: false, revealed: false, cardShown: false };
  }
  // The first answer to a question is the only one that can be evidence (and only
  // on a tile-rung fact). Everything after it is play.
  function noteAnswer(correct) {
    if (ttPopEvidenceOK(q)) ctx.record(q.d, correct);
    q.attempted = true;
  }

  // ───────── equation + panel ─────────
  function renderEq() {
    const eq = $('eq'); eq.innerHTML = '';
    q.toks.forEach(t => {
      const s = document.createElement('span');
      if (typeof t === 'string') { s.className = 'op'; s.textContent = t; }
      else if (t[0] === q.miss) { s.className = 'box miss ' + t[0] + (q.revealed ? ' solved' : ''); s.dataset.miss = 1; s.dataset.eqbox = 1; s.textContent = q.revealed ? q.ans : '?'; }
      else { s.className = 'tok ' + t[0]; s.textContent = t[1]; }
      eq.appendChild(s);
    });
  }
  // The array card is help, not a crutch: hidden until the first wrong tap (Kath h17).
  function renderPanel() {
    const panel = $('panel'), card = $('card');
    card.classList.toggle('hidden', !q || !q.cardShown);
    if (!q || !q.cardShown) { card.innerHTML = ''; return; }
    const { a, b, c } = q;
    const pw = panel.clientWidth, ph = panel.clientHeight;
    const LAB = clamp(Math.round(Math.min(pw, ph) * 0.11), 36, 56), PAD = clamp(Math.round(LAB * 0.26), 8, 14);
    const cell = Math.max(8, Math.floor(Math.min((pw - 2 * PAD - LAB - 6) / b, (ph - 2 * PAD - LAB - 6) / a, 56)));
    const gw = cell * b, gh = cell * a;
    card.style.cssText = `--lab:${LAB}px;padding:${PAD}px;grid-template-columns:${LAB}px ${gw}px;grid-template-rows:${LAB}px ${gh}px`;
    card.innerHTML = '';
    const mk = (cls, parent) => { const d = document.createElement('div'); d.className = cls; parent.appendChild(d); return d; };
    mk('', card);                                            // corner
    const top = mk('dim top', card), left = mk('dim left', card), gb = mk('gridbox', card);
    const chip = (parent, role, val) => {
      const el = mk('chip ' + role, parent);
      if (q.miss === role) { el.classList.add('miss'); el.dataset.miss = 1; if (q.revealed) { el.classList.add('solved'); el.textContent = q.ans; } else el.textContent = '?'; }
      else el.textContent = val;
    };
    chip(top, 'b', b); chip(left, 'a', a);
    let svg = `<svg width="${gw}" height="${gh}" viewBox="0 0 ${gw} ${gh}"><rect width="${gw}" height="${gh}" fill="#eaf3ff"/>`;
    for (let i = 1; i < b; i++) svg += `<line x1="${i * cell}" y1="0" x2="${i * cell}" y2="${gh}" stroke="#111" stroke-opacity=".6" stroke-width="1.3"/>`;
    for (let j = 1; j < a; j++) svg += `<line x1="0" y1="${j * cell}" x2="${gw}" y2="${j * cell}" stroke="#111" stroke-opacity=".6" stroke-width="1.3"/>`;
    svg += `<rect x=".75" y=".75" width="${gw - 1.5}" height="${gh - 1.5}" fill="none" stroke="#111" stroke-width="1.5"/>`;
    svg += `<line x1="0" y1="2" x2="${gw}" y2="2" stroke="#2060c0" stroke-width="4"/><line x1="2" y1="0" x2="2" y2="${gh}" stroke="#e07010" stroke-width="4"/></svg>`;
    gb.innerHTML = svg;
    const cb = mk('cbadge', gb);
    cb.style.fontSize = clamp(Math.min(gw, gh) * 0.42, 18, 46) + 'px';
    if (q.miss === 'c') { cb.classList.add('miss'); cb.dataset.miss = 1; if (q.revealed) { cb.classList.add('solved'); cb.textContent = q.ans; } else cb.textContent = '?'; }
    else cb.textContent = c;
  }
  function reveal() {
    q.revealed = true; typed = '';
    root.querySelectorAll('[data-miss]').forEach(el => { el.textContent = q.ans; el.classList.remove('typing'); el.classList.add('solved'); });
  }

  // ───────── bubbles ─────────
  let SW = innerWidth, SH = innerHeight;
  function bubbleR() { return clamp(Math.min(SW, SH) / 11, 26, 42); }

  function refillBag() {
    bag = shuffle(q.values.slice());
    const i = bag.indexOf(q.ans), j = Math.max(0, bag.length - 1 - rnd(0, 4));   // answer surfaces within the first few spawns (pop from end)
    [bag[i], bag[j]] = [bag[j], bag[i]];
  }
  function spawn(val) {
    const r = bubbleR(), amp = rnd(10, 22);
    let best = r + amp, bestD = -1;
    for (let k = 0; k < 6; k++) {
      const x = r + amp + Math.random() * Math.max(1, SW - 2 * (r + amp));
      let d = 1e9;
      bubbles.forEach(o => { if (o.y > SH * 0.55) d = Math.min(d, Math.abs(o.x0 - x)); });
      if (d > bestD) { bestD = d; best = x; }
    }
    const el = document.createElement('div'); el.className = 'bubble';
    const inn = document.createElement('div'); inn.className = 'in';
    inn.style.cssText = `width:${2 * r}px;height:${2 * r}px;font-size:${r * (val > 99 ? 0.68 : 0.82)}px`;
    inn.textContent = val; el.appendChild(inn);
    el.style.transform = `translate3d(${best - r}px,${SH}px,0)`;   // start off-screen: without this it flashes at top-left until the first update
    stage.appendChild(el);
    const b = { el, inn, val, r, x0: best, x: best, y: SH + r, amp, ph: Math.random() * 6.28, fq: 1 + Math.random() * 1.2,
                speed: SH / (CROSS_MIN + Math.random() * (CROSS_MAX - CROSS_MIN)) };

  }
  function spawnNext() {
    for (let guard = 0; guard < 12; guard++) {
      if (!bag.length) refillBag();

      if (!bubbles.some(o => o.val === v)) { spawn(v); return; }

  function removeBubble(b) { const i = bubbles.indexOf(b); if (i >= 0) bubbles.splice(i, 1); b.el.remove(); }
  function clearBubbles() { bubbles.forEach(b => b.el.remove()); bubbles = []; }

  function updateBubbles(dt, now) {
    for (let i = bubbles.length - 1; i >= 0; i--) {

      b.y -= b.speed * dt;
      b.x = b.x0 + Math.sin(b.ph + now / 1000 * b.fq) * b.amp;
      b.el.style.transform = `translate3d(${b.x - b.r}px,${b.y - b.r}px,0)`;
      if (b.y < -b.r) {
        removeBubble(b);

      if (spawnTimer <= 0) { spawnNext(); spawnTimer = SPAWN_MIN + Math.random() * (SPAWN_MAX - SPAWN_MIN); }
    }
  }

  // ───────── effects ─────────
  function burstAt(x, y, n, glyph) {
    for (let i = 0; i < n; i++) {

      p.style.setProperty('--dx', Math.cos(ang) * dist + 'px'); p.style.setProperty('--dy', Math.sin(ang) * dist + 'px');

  function showFb(msg, col) { const f = $('fb'); f.textContent = msg; f.style.color = col; }

  function tap(b) {

  }
  // Kath h17: a chill game — the bubble wiggles, no message, bubbles keep rising
  // for more chances. The first wrong also brings up the array card as help.
  function wrong(b) {
    if (!q.wrong) {
      q.wrong = true; total++; streak = 0; $('streak').textContent = ''; updateScore();
      noteAnswer(false);
      q.cardShown = true; renderPanel();
    }
    snd('wrong'); setExpr('sad', 1000);

    else { const bx = root.querySelector('[data-eqbox]'); if (bx) { bx.classList.remove('shake'); void bx.offsetWidth; bx.classList.add('shake'); } }
  }
  function correct(b) {
    state = 'solved';
    noteAnswer(true);                    // no-op if a wrong answer already took the evidence slot
    bubbles.slice().forEach(o => {
      if (o === b) { o.inn.classList.add('pop'); burstAt(o.x, o.y, 9, false); setTimeout(() => removeBubble(o), 270); }
      else { o.inn.classList.add('fade'); setTimeout(() => removeBubble(o), 450); }
    });
    bubbles = [];
    snd('pop'); reveal();
    let tier = 1;
    if (!q.wrong) { total++; score++; streak++; tier = handleStreak(); }
    else { showFb('✓ Got it! 🦀', '#40ffa0'); snd('ding'); setExpr('happy'); celebrate(1); }
    updateScore();
    clearTimeout(newQTimer); newQTimer = setTimeout(newQuestion, HOLD_BY_TIER[tier]);
  }
  const STREAK_MSGS = {
    3: ['3 in a row! 🦀', '#40ffcc'], 5: ['5 in a row — nice focus! 🦀', '#00d4ff'],
    10: ['10 in a row! Great going ⭐', '#ffff60'], 20: ['20 in a row! You\'re not giving up 🏆', '#ff80c0'],
    50: ['50 in a row! That\'s a lot of hard work 🌟', '#ff40ff'], 75: ['75 in a row! You\'ve really stuck with it 🔱', '#40ffff'],
    100: ['100 in a row! All that effort paid off 👑', '#ffffff']
  };
  const STREAK_TIER = { 3: 1, 5: 1, 10: 2, 20: 2, 50: 3, 75: 3, 100: 3 };
  const BRILLIANT = ['✓ Keep it up! 💎', '✓ You\'re on a roll! 🦀', '✓ Dig deeper! ⭐', '✓ Keep scuttling! 🦀',
    '✓ Shiny! 💎', '✓ Nice! 🐚', '✓ Watch that streak! 🦀', '✓ Way to go! 🐚'];
  function handleStreak() {              // returns celebration tier 1..3

      showFb(m, col); lab.textContent = `🌊 ${streak} in a row!`; snd('streak');
      const cr = $('eq').getBoundingClientRect();

      setExpr('happy'); celebrate(tier);

    else { lab.textContent = ''; showFb('✓ Correct! Well done! 🦀', '#40ffa0'); }

  }

  function newQuestion() {

  // ───────── keyboard entry: digits, Backspace, Enter (exemplar behaviour) ─────────
  function showTyped() {

    bx.textContent = typed || '?'; bx.classList.toggle('typing', !!typed);
  }
  function submitTyped() {
    if (!typed) return;

  }
  function onKey(e) {
    if (!live || !q || state !== 'play' || e.ctrlKey || e.metaKey || e.altKey) return;

  // ───────── CAVE SCENE (exemplar: walls, ceiling, sand, crystals, crab) ─────────
  let CW = 0, CH = 0, K = 1, SAND_TOP = 0, DPR = 1;
  const COL = {
    bg: '#060e1a', wall: '#091825', ceil: '#0a1e30', sand: '#a89060', sandLt: '#b8a070', ripple: '#cdb87a',
    purpFill: '#7a22c4', purpHi: '#c090ff', tealFill: '#0d9990', tealHi: '#60ffe0', viotFill: '#6a18b0', viotHi: '#b070f0',
    cyanFill: '#0b8080', cyanHi: '#40e0c0', lilFill: '#9a3fe0', lilHi: '#d0a0ff',
    legDark: '#a03810', legMid: '#c86030', shell: '#e06820', carap: '#d45c18', rib: '#f08040',
    armDark: '#a03810', armLt: '#d07030', clawUp: '#d4631f', clawDn: '#bf4010', clawK: '#c05018',

  function layout() {
    SW = innerWidth; SH = innerHeight;
    DPR = devicePixelRatio || 1;
    CW = SW; CH = SH;
    cv.width = Math.round(CW * DPR); cv.height = Math.round(CH * DPR);

  }

  function jag(seed, n = 11) { let s = seed; return Array.from({ length: n }, () => { s = (s * 1664525 + 1013904223) & 0xffffffff; return ((s >>> 0) / 4294967296 - 0.5) * 3.5; }); }
  function mkPoly(x, baseY, h, hw, jv) {
    return [[x - hw + jv[0], baseY], [x + hw + jv[1], baseY], [x + hw * 0.7 + jv[2], baseY - h * 0.42 + jv[3]], [x + hw * 0.5 + jv[4], baseY - h * 0.72 + jv[5]],
      [x + jv[6], baseY - h], [x - hw * 0.5 + jv[7], baseY - h * 0.72 + jv[8]], [x - hw * 0.7 + jv[9], baseY - h * 0.42 + jv[10]]];
  }
  function mkHorizArm(tx, sy, side, hlen, hw) {

    return { pts: [[tx, sy + hw * 0.75], [tx, sy - hw * 0.75], [ex + side * 2, sy - hw * 0.5], [ex + side * 3, sy], [ex + side * 2, sy + hw * 0.5]], ex, ey: sy };
  }
  function buildCrystal(seed, frac, sc, col, hi, trunkH, trunkHW, arms) {

    const ba = arms.map((a, i) => {
      const hz = mkHorizArm(0, -trunkH * a.frac, a.side, a.hlen, a.hw);
      return { hz, vp: mkPoly(hz.ex, hz.ey, a.vH, a.hw * 0.88, jag(seed * 13 + i * 31 + a.vH | 0)) };
    });

  }
  function poly(pts, fill) { g.fillStyle = fill; g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); g.closePath(); g.fill(); }
  function drawCrystal(c) {
    g.save(); g.translate(c.frac * CW, SAND_TOP + 3 * K); g.scale(K * c.sc, K * c.sc);
    for (const a of c.ba) {
      poly(a.hz.pts, c.col);
      g.strokeStyle = c.hi; g.lineWidth = 1; g.beginPath(); g.moveTo(a.hz.pts[1][0], a.hz.pts[1][1]); g.lineTo(a.hz.pts[2][0], a.hz.pts[2][1]); g.stroke();
      poly(a.vp, c.col);
      g.lineWidth = 1.2; g.beginPath(); g.moveTo(a.vp[4][0], a.vp[4][1]); g.lineTo((a.vp[1][0] + a.vp[4][0]) / 2, (a.vp[0][1] + a.vp[4][1]) / 2); g.lineTo(a.vp[1][0], a.vp[0][1]); g.stroke();
    }

    g.strokeStyle = c.hi; g.lineWidth = 1.2; g.beginPath(); g.moveTo(c.tp[4][0], c.tp[4][1]); g.lineTo((c.tp[1][0] + c.tp[4][0]) / 2, (c.tp[0][1] + c.tp[4][1]) / 2); g.lineTo(c.tp[1][0], c.tp[0][1]); g.stroke();
    g.restore();
  }
  const CRYSTALS = [
    buildCrystal(1, 0.06, 1.0, COL.purpFill, COL.purpHi, 68, 10, [{ side: -1, frac: .32, hlen: 20, vH: 28, hw: 6 }, { side: 1, frac: .58, hlen: 18, vH: 24, hw: 5 }]),
    buildCrystal(2, 0.15, 0.85, COL.tealFill, COL.tealHi, 58, 9, [{ side: 1, frac: .35, hlen: 22, vH: 26, hw: 5 }, { side: -1, frac: .62, hlen: 16, vH: 22, hw: 5 }]),
    buildCrystal(3, 0.25, 1.05, COL.viotFill, COL.viotHi, 72, 11, [{ side: -1, frac: .28, hlen: 24, vH: 30, hw: 7 }, { side: 1, frac: .55, hlen: 20, vH: 25, hw: 6 }]),
    buildCrystal(4, 0.74, 1.0, COL.cyanFill, COL.cyanHi, 64, 10, [{ side: -1, frac: .38, hlen: 19, vH: 27, hw: 6 }, { side: 1, frac: .60, hlen: 21, vH: 23, hw: 5 }]),
    buildCrystal(5, 0.84, 0.85, COL.lilFill, COL.lilHi, 60, 9, [{ side: 1, frac: .30, hlen: 20, vH: 25, hw: 5 }, { side: -1, frac: .57, hlen: 18, vH: 22, hw: 5 }]),
    buildCrystal(6, 0.94, 1.1, COL.purpFill, COL.purpHi, 66, 10, [{ side: -1, frac: .33, hlen: 22, vH: 27, hw: 6 }, { side: -1, frac: .60, hlen: 18, vH: 22, hw: 5 }]),
    buildCrystal(7, 0.34, 0.6, COL.tealFill, COL.tealHi, 55, 8, [{ side: 1, frac: .36, hlen: 16, vH: 22, hw: 5 }, { side: 1, frac: .62, hlen: 14, vH: 18, hw: 4 }]),
    buildCrystal(8, 0.66, 0.6, COL.viotFill, COL.viotHi, 55, 8, [{ side: -1, frac: .36, hlen: 16, vH: 22, hw: 5 }, { side: -1, frac: .62, hlen: 14, vH: 18, hw: 4 }]),
  ];

  const DOTS = [[127, 164], [212, 219], [282, 142], [367, 197], [113, 285], [311, 263], [410, 142]];
  const WALL = [[0, 0], [0, 460], [64, 460], [50, 373], [40, 307], [56, 263], [35, 219], [42, 164], [21, 110], [28, 55]];
  const CEIL_PTS = [[0, 55], [56, 71], [99, 53], [141, 79], [184, 49], [226, 82], [268, 55], [311, 88], [353, 49], [395, 77], [438, 44], [480, 66]];
  function drawBackground() {
    g.fillStyle = COL.bg; g.fillRect(0, 0, CW, CH);
    g.fillStyle = 'rgba(0,180,200,0.03)';
    for (let i = 0; i < 6; i++) { g.beginPath(); g.ellipse((85 + i * 64) / 480 * CW, CH * 0.5, 42 / 480 * CW, CH * 0.43, 0, 0, Math.PI * 2); g.fill(); }
    g.fillStyle = 'rgba(120,255,240,0.5)';
    for (const [dx, dy] of DOTS) { g.beginPath(); g.arc(dx / 480 * CW, dy / 460 * CH, 2, 0, Math.PI * 2); g.fill(); }
  }
  function drawWalls() {
    const wx = Math.min(CW / 480, 1.3);
    g.fillStyle = COL.wall;
    [false, true].forEach(right => {
      g.beginPath();
      WALL.forEach(([x, y], i) => { const px = right ? CW - x * wx : x * wx, py = y / 460 * CH; i ? g.lineTo(px, py) : g.moveTo(px, py); });
      g.closePath(); g.fill();
    });

    for (let i = CEIL_PTS.length - 1; i >= 0; i--) g.lineTo(CEIL_PTS[i][0] / 480 * CW, CEIL_PTS[i][1] * K * 0.9);
    g.closePath(); g.fill();
  }
  function drawSand() {
    g.fillStyle = COL.sand; g.fillRect(0, SAND_TOP, CW, CH - SAND_TOP);
    g.fillStyle = COL.sandLt; g.fillRect(0, SAND_TOP, CW, 7 * K);
    g.strokeStyle = COL.ripple; g.lineWidth = 2;
    [{ cx: .21, y: 14, ph: 0, amp: 5 }, { cx: .5, y: 22, ph: 1.9, amp: 6 }, { cx: .79, y: 16, ph: .8, amp: 4 }].forEach(r => {
      const half = 113 * K, cx = r.cx * CW; g.beginPath();
      for (let x = cx - half, first = true; x <= cx + half; x += 3, first = false) {
        const t = (x - (cx - half)) / (2 * half), edge = Math.sin(t * Math.PI), mod = 0.72 + 0.28 * Math.cos((x - cx) * 0.018 + r.ph * 0.5);

        first ? g.moveTo(x, y) : g.lineTo(x, y);

    });
  }

  // crab (local coords: origin at sand-top, crab centred on x=0)
  const ARM_OFF_L = 22, ARM_OFF_R = 16, ARM_UP_L = 6, ARM_UP_R = 10, ARM_LEN_L = 43, ARM_LEN_R = 34;
  const BASE_L = Math.PI + 0.30, BASE_R = -0.55, CRAB_BASE_Y = -34, CELEB_FPB = 36;

<script>
// ==== MODULE tt_flow.js [BEGIN] ====
// ============================================================================
// tt_flow.js — child-facing SCREEN CONTROLLER (S0–S3), shared across ALL skins
// ----------------------------------------------------------------------------

// screen shows a top-left back button whose target is fixed by BACK below.
//

//   opts.eng / opts.config     engine instance, or config → tt_newEngine

//   opts.mounts {question,input,feedback,checkpoint}   play + overlay mounts
//   opts.pairs                 Game 1 skin controller (ttMakePairs) — start/stop
//   opts.pop                   Game 2 skin controller (ttMakePop) — start/stop
//   opts.profile {age}         single hardcoded child for now (S0 create = later)

// ============================================================================

  var rng = opts.rng || Math.random;

  var profile = opts.profile || { age: 8 };
  var sessionCtx = { mode: opts.mode || "any", nowTs: Date.now() };

  var S = opts.screens || {};
  var backBtn = opts.back;
  var qPanel = ttMountQuestion(opts.mounts.question);
  var iPanel = ttMountInput(opts.mounts.input, { key: pressKey, submit: submitTile });
  var fbPanel = ttMountFeedback(opts.mounts.feedback);
  var cpPanel = ttMountCheckpoint(opts.mounts.checkpoint);
  var achPanel = opts.mounts.achievements ? ttMountAchievements(opts.mounts.achievements) : null;   // adult card (h16)

  // quiet spell the box takes a white outline + underline and the revealed answer and the

  function openSession() {

  }
