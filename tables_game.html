    sessionLive = false;
    current = null;
    return summary;
  }

  // --- drive loop (faithful to tt_shell) ------------------------------------
  function nextQuestion() {
    submitLock = false;
    correctiveMode = false;
    cancelHint();
    setButtons("normal");
    entry = "";                          // fresh box for the next question (renderQuestion draws it empty)
    if (opts.scaffold) opts.scaffold.clear();
    fbPanel.clear();
    if (screen !== "play" || !sessionLive) return;   // a delayed advance after the child left
    sessionCtx.nowTs = Date.now();
    current = tt_nextQuestion(eng, sessionCtx, rng);
    if (!current) { goSelect(); return; }
    renderQuestion();
  }

  function renderQuestion() {
    renderCount++;                       // test seam: monotonic per served question (advance detection)
    var view = ttQuestionView(current);
    qPanel.render(view);
    iPanel.render(view);
    renderTs = now();
    if (current.revealAnswer) {
      fbPanel.show({ kind: "corrective", text: ttSolvedText(current) });
      // Engine-initiated reveal — "where scaffolding is required". The revealAnswer gate
      // (onAnswer) enforces the copy; the scaffold teaches.
      // h15: the §7 reveal (the re-ask the engine schedules after ANY wrong answer) is
      // caption-only with "Show me why", exactly like the immediate correction — otherwise
      // the array the child just skipped simply plays one question later and the whole
      // speed-up is halved. The INTRO reveal is exempt: first sight of a fact is a teaching
      // moment, not a correction, so it keeps its array automatically.
      var isIntro = !!(current.flags && current.flags.intro);
      setButtons(isIntro ? "normal" : "why");
      if (opts.scaffold) opts.scaffold.show(current, workingRungOf(current), armHint, isIntro ? null : 3);
    }
  }

  // --- copy-to-proceed hint (h15) -------------------------------------------
  // Armed only from the scaffold's onDone: at 1s per loop an 8-column array plays for
  // 8 seconds, so arming on entry would point at the box mid-explanation.
  function inCopyState() { return correctiveMode || !!(current && current.revealAnswer); }
  function setHint(on) {
    qPanel.hint(on);
    if (opts.scaffold && opts.scaffold.hint) opts.scaffold.hint(on);
  }
  function cancelHint() { if (hintTimer) { clearTimeout(hintTimer); hintTimer = null; } setHint(false); }
  function armHint() {
    cancelHint();
    if (!inCopyState()) return;
    hintTimer = setTimeout(function () { hintTimer = null; if (inCopyState() && entry === "") setHint(true); }, TT_COPY_HINT_MS);
  }

  // --- inline answer-box entry (shared by keypad + physical keyboard) --------
  function updateEntry() { qPanel.setEntry(entry); }
  function clearEntry() { entry = ""; updateEntry(); }
  function pressKey(k) {                              // k: "0".."9" | "clear" | "enter"
    if (screen !== "play" || !current) return;
    cancelHint();                                     // typing = the mechanic is understood
    if (k === "clear") entry = entry.slice(0, -1);
    else if (k === "enter") { submitEntry(); return; }
    else if (k >= "0" && k <= "9") entry = (entry + k).slice(0, 3);
    updateEntry();
  }
  function submitEntry() { if (entry !== "") onAnswer(parseInt(entry, 10)); }   // entry stays on screen; cleared on advance/corrective
  function submitTile(v) { entry = String(v); updateEntry(); onAnswer(v); }

  // Post-record working rung for a fact (design §5) — via the read accessor, never eng.facts (D2).
  function workingRungOf(d) { var g = tt_getMasteryGrid(eng), gf = g[d.factKey]; return gf ? gf.rung : d.rung; }
  // Enter the corrective scaffold: report already recorded; show the scaffold, await the copy.
  // forceL3: a WRONG answer gets the caption only, with "Show me why" offered. "Help me
  // out" does NOT — the child has just asked for help, so make them ask twice would be
  // perverse; they get the array straight away.
  function enterCorrective(d, forceL3) {
    submitLock = false; correctiveMode = true; clearEntry(); fbPanel.clear(); cancelHint();
    setButtons(forceL3 ? "why" : "none");
    opts.scaffold.show(d, workingRungOf(d), armHint, forceL3 ? 3 : null);
  }
  // "Show me why" — the child asks for the array they were not given. Teaching only: it
  // records NOTHING (the wrong answer was already recorded when corrective opened), so it
  // must never be confused with "Help me out", which reports as a wrong answer.
  function showMeWhy() {
    if (!current || screen !== "play") return;
    if (!correctiveMode && !current.revealAnswer) return;   // both copy-to-proceed states
    setButtons("none");                               // asked and answered — nothing left to offer
    cancelHint();
    opts.scaffold.show(current, workingRungOf(current), armHint, null);
  }
  // Correct: show "correct" and keep the answer + message on screen for 1s, then advance (§ user h10).
  function correctThenAdvance() { qPanel.mark("correct"); fbPanel.show({ kind: "correct", text: "correct" }); setTimeout(nextQuestion, 1000); }

  function onAnswer(val) {
    if (!current || screen !== "play") return;
    var correct = val === current.correctAnswer;
    if (correctiveMode) {                          // §7 copy-to-proceed: only the right answer advances
      if (correct) { correctiveMode = false; submitLock = true; correctThenAdvance(); }
      else { clearEntry(); armHint(); }            // a wrong copy leaves the scaffold up; clear the box and re-offer the hint
      return;
    }
    if (submitLock) return;
    var rt = Math.round(now() - renderTs);
    if (current.revealAnswer && !correct) { fbPanel.show({ kind: "corrective", text: ttSolvedText(current) }); clearEntry(); return; }
    submitLock = true;
    sessionCtx.nowTs = Date.now();
    tt_recordAnswer(eng, current, correct, rt, profile.age);
    persist();
    if (!correct && opts.scaffold) { enterCorrective(current, true); return; }   // §7: wrong → caption + copy (array on request)
    if (correct) { correctThenAdvance(); return; }
    fbPanel.show(ttFeedbackView(correct, current)); setTimeout(nextQuestion, 900);   // wrong, no scaffold (other skins)
  }

  // "Help me out" — reported to the engine AS A WRONG ANSWER (§7), then teaches via the scaffold.
  function helpMeOut() {
    if (!current || correctiveMode || submitLock || screen !== "play" || current.revealAnswer) return;
    sessionCtx.nowTs = Date.now();
    tt_recordAnswer(eng, current, false, HELP_RT, profile.age);
    persist();
    if (opts.scaffold) enterCorrective(current, false);   // asked for help → give the array at once
    else { fbPanel.show({ kind: "corrective", text: ttSolvedText(current) }); setTimeout(nextQuestion, 900); }
  }

  // --- Class-C skin context (Game 1 Pairs, Game 2 Pop) — the narrow surface a skin is given ---
  // The skin holds no engine reference (D2): it reads scheduling state through
  // tt_getFactStates, gets descriptors by key, and records through here.
  var skinCtx = {
    rungSpecs: TT_RUNGS,
    scope: getScope,
    // the live session's RESOLVED scope ({kind:"any"|"mainly"|"only", tables}) — Pop
    // follows it as the drill does; Pairs has its own per-board table picker instead.
    focus: function () { return tt_modeInfo(sessionCtx.mode); },
    factStates: function () { return tt_getFactStates(eng); },
    qCount: function () { return eng.qCount; },
    // A REAL engine descriptor, at a rung the SKIN chose (the child picked the
    // question form; the ladder didn't). `orient` scripts tt_describe's coin flips
    // so a selected table lands in the second/divisor slot — see ttPairsOrientSeq.
    describe: function (key, rung, orient) {
      return tt_describeFactKey(eng, key, rung, ttPairsRng(orient || [], rng), {});
    },
    // Serve + record. The skin's gate has already decided this answer is evidence.
    // pendingReveal is snapshotted and restored: Kath h13 — a Pairs miss must not
    // hijack the opening question of the child's next DRILL session (design §2.3).
    // Same for Pop: it teaches its own miss in-game (the array card). Consequence (h17,
    // settled by Kath): the §7 re-ask chain is queued FROM the reveal (tt_engine.js ~1475),
    // so a Pairs/Pop miss arms reinforcement + lapses the fact but schedules no re-asks.
    record: function (d, correct) {
      sessionCtx.nowTs = Date.now();
      tt_markServed(eng, d, sessionCtx);
      var heldReveal = eng.pendingReveal;
      tt_recordAnswer(eng, d, correct, TT_PAIRS_RT, profile.age);
      eng.pendingReveal = heldReveal;
      persist();
    },
  };

  // S3 progress map. summary = a session summary (exit) or omitted → the last closed
  // session (Games-menu button). Highlights mark what THAT session improved/bridged.
  function showMap(summary) {
    cpPanel.show(mapData(summary || eng.lastSession), null);
  }

  function mapData(summary) {
    var N = eng.config.tablesUpTo || 12, fl = {};
    for (var t = 1; t <= N; t++) { var p = tt_getTableProgress(eng, t); fl[t] = p.total ? Math.round(100 * p.fluent / p.total) : 0; }
    var ach = tt_getAchievements(eng).facts, best = {};
    for (var k in ach) best[k] = ach[k].best;          // child map = BEST-EVER stars (h16)
    return {
      N: N, grid: tt_getMasteryGrid(eng), tableFluency: fl, best: best,
      improved: (summary && summary.factsImproved) || [], bridged: (summary && summary.bridgesOpened) || []
    };
  }

  if (backBtn) backBtn.addEventListener("click", back);
  // Physical keyboard (PC number row + numpad + Enter/Backspace) → the inline box (§ user h10).
  if (typeof document !== "undefined") document.addEventListener("keydown", function (e) {
    if (screen !== "play") return;
    if (e.key >= "0" && e.key <= "9") { pressKey(e.key); e.preventDefault(); }
    else if (e.key === "Backspace") { pressKey("clear"); e.preventDefault(); }
    else if (e.key === "Enter") { pressKey("enter"); e.preventDefault(); }
  });
  showScreen("who");   // start at S0; host wires child→goSelect, drill→goPlay

  return { goWho: goWho, goSelect: goSelect, goPlay: goPlay, goPairs: goPairs, goPop: goPop,showMap: showMap, goSettings: goSettings, goAdult: goAdult, selectPlayer: selectPlayer, back: back, helpMeOut: helpMeOut, showMeWhy: showMeWhy, isReveal: function () { return !!(current && current.revealAnswer); }, qCount: function () { return renderCount; }, setScope: setScope, getScope: getScope, setChildTables: setChildTables, getChildPick: getChildPick, engine: function () { return eng; } };
}

// ============================================================================
// end tt_flow.js
// ============================================================================
// ==== MODULE tt_flow.js [END] ====
</script>
<script>
// ==== MODULE tt_skin_drill.js [BEGIN] ====
// ============================================================================
// tt_skin_drill.js — Game 3 "Plain" drill SKIN (D10). Owns scaffold POLICY.
// ----------------------------------------------------------------------------
// The drill is driven by the SHARED controller (tt_flow.js) + the engine; this
// module adds what makes it Game 3: the corrective array-scaffolding. It owns
// the two policy decisions the design assigns to the skin (game3_design §6.4):
//   • rung → scaffold level (§5)          — ttDrillRungToLevel (PURE)
//   • descriptor → array dims/op (§3)     — ttDrillScaffoldDims (PURE)
// and wires a scaffold CONTROLLER (the object tt_flow calls as opts.scaffold):
//   controller.show(descriptor, workingRung)  → render the scaffold at the level
//   controller.clear()                        → tear it down (on advance)
// Rendering is delegated to ttMountScaffold (tt_panels) → tt_scaffold_play →
// tt_scaffold. This module holds NO engine reference (D2): tt_flow passes the
// already-read workingRung in. The pure fns are cold-run tested (skin.test.js);
// the controller is DOM and browser-verified in the skin playtest. Assembled by cat.
// ============================================================================

// Rung → scaffold level (game3_design §5, Kath h10): R0–R2 = L1 (rows),
// R3–R5 = L2 (rows+columns/commutativity), R6–R8 = L3 (answer only).
function ttDrillRungToLevel(rung) {
  return rung <= 2 ? 1 : rung <= 5 ? 2 : 3;
}

// Scaffold level for a specific descriptor (h12 — the shell owns scaffold
// appearance; the engine only schedules the reveal and classifies the ask).
// The input⟺scaffold invariant (Kath h11): a RECALL question — keypad input
// (no tiles), answered cold — shows NO array, only the L3 caption; showing an
// L1/L2 array under a keypad is the h11 bug (a placement/seedVerify ask presents
// a keypad rung while the fact's WORKING rung is low → L1/L2). A revealAnswer
// TEACHING moment (R0 intro, §7 error reveal) keeps its array whatever the
// input — that is the point of the reveal. Input mode = scaffold.options
// present (tt_view §), reveal = descriptor.revealAnswer; both are engine-honest
// signals, not appearance dictated by the engine.
function ttDrillScaffoldLevel(d, workingRung) {
  var isKeypad = !(d.scaffold && d.scaffold.options);
  if (isKeypad && !d.revealAnswer) return 3;        // recall → caption only, no array
  return ttDrillRungToLevel(workingRung);
}

// Descriptor → array {a rows, b cols, op, unknown} (game3_design §3).
// `unknown` names which DIMENSION the child does not know, and drives the whole
// h14 reveal rule in tt_scaffold/tt_scaffold_play: a given number is static, a
// discovered one counts up, and the array is dealt out along the unknown axis.
//  ÷ : the array is (quotient) rows × (divisor) cols — division always asks the
//      quotient (engine :427), so a = correctAnswer, b = the shown divisor, and
//      the ROW COUNT is what the loops discover.
//  × result form (a × b = ?) : honour the PRESENTED orientation (4×3 → 4 rows of
//      3); both dimensions are given, so nothing counts but the dot total.
//  × missing-factor : honour the PRESENTED display order, which `missingSlot`
//      fixes (engine :394) — "factor1" shows `? × left = right` so the hidden
//      factor is the ROW count; "factor2" shows `left × ? = right` so it is the
//      COLUMN count. (h14 replaced the old canonical-a×b fallback, which threw
//      the display order away and so could not say which side was unknown.)
function ttDrillScaffoldDims(d) {
  var p = d.presented;
  if (p.op === "÷") return { a: d.correctAnswer, b: p.right, op: "÷", unknown: "rows" };
  if (p.missingSlot === "factor1") return { a: d.correctAnswer, b: p.left, op: "×", unknown: "rows" };
  if (p.missingSlot === "factor2") return { a: p.left, b: d.correctAnswer, op: "×", unknown: "cols" };
  if (p.missingSlot === "result") return { a: p.left, b: p.right, op: "×", unknown: null };
  return { a: d.a, b: d.b, op: "×", unknown: null };          // defensive: unknown slot kind
}

// Which array phase LEADS (§6.4 policy, h15). The row phase counts in steps of the SECOND
// displayed factor, the column phase in steps of the FIRST. A step the child has never met
// is not a scaffold: `2 x 8` led by rows counts 8, 16 — skip-counting a table they have not
// been introduced to — while leading with columns counts 2, 4 ... 16 on the same dots, every
// hop inside a table they have. So: lead with the countable axis.
//   * ONLY for the plain product form. When a dimension is unknown the build axis is already
//     forced by h14's reveal rule (§3.2) and must not be overridden.
//   * Both tables started, or neither -> rows (status quo). Preferring the FEWER hops once
//     both are known is a later efficiency tier, not this.
//   * `tableStarted` absent (an older or hand-built descriptor) -> rows. Fails safe.
function ttDrillScaffoldLead(d, dims) {
  if (!dims || dims.unknown !== null) return "rows";
  var started = d.tableStarted || {};
  var rowStep = dims.b, colStep = dims.a;          // row phase counts in b, column phase in a
  return (!started[rowStep] && started[colStep]) ? "cols" : "rows";
}

// The scaffold controller tt_flow drives (opts.scaffold). `panel` is a
// ttMountScaffold instance (tt_panels). Pure policy in, DOM out.
function ttMakeScaffoldController(panel) {
  return {
    // levelOverride (h15): the corrective flow shows L3 only — the caption, no array —
    // until the child asks "show me why". Everything else still derives the level.
    show: function (descriptor, workingRung, onDone, levelOverride) {
      var dims = ttDrillScaffoldDims(descriptor);
      panel.show({ a: dims.a, b: dims.b, op: dims.op, unknown: dims.unknown,
                   lead: ttDrillScaffoldLead(descriptor, dims),
                   onDone: onDone,
                   level: levelOverride || ttDrillScaffoldLevel(descriptor, workingRung) });
    },
    clear: function () { panel.clear(); },
    hint: function (on) { if (panel.hint) panel.hint(on); },
  };
}

if (typeof module !== "undefined" && module.exports) {
  module.exports = {
    ttDrillRungToLevel: ttDrillRungToLevel,
    ttDrillScaffoldLead: ttDrillScaffoldLead,
    ttDrillScaffoldLevel: ttDrillScaffoldLevel,
    ttDrillScaffoldDims: ttDrillScaffoldDims,
    ttMakeScaffoldController: ttMakeScaffoldController,
  };
}
// ==== MODULE tt_skin_drill.js [END] ====
</script>
<script>
  function ttEl(id) { return document.getElementById(id); }

  // --- avatars: each has a NAME to aid memory (bonds names reused where they exist) ----
  var AVATARS = [
    { e: "🐠", name: "Rainbow" }, { e: "🐟", name: "Dart" }, { e: "🐡", name: "Puff" }, { e: "🦈", name: "Spike" },
    { e: "🐙", name: "Ozzy" }, { e: "🦑", name: "Inky" }, { e: "🦀", name: "Snap" }, { e: "🦞", name: "Nipper" },
    { e: "🐬", name: "Flash" }, { e: "🐳", name: "Splash" }, { e: "🦭", name: "Pebble" }, { e: "🐚", name: "Pearl" },
    { e: "🦐", name: "Skip" }, { e: "🪸", name: "Coral" }, { e: "⭐", name: "Shimmer" }, { e: "🐢", name: "Sage" }
  ];
  function avatarBtn(a, onClick) {
    var b = document.createElement("button"); b.type = "button"; b.className = "tt-avatar-btn";
    b.innerHTML = "<span class='tt-av-e'>" + a.e + "</span><span class='tt-av-n'>" + a.name + "</span>";
    b.addEventListener("click", onClick);
    return b;
  }

  // --- player manager (S0): many children on one machine, one engine PER player -------
  var players = [];
  try { players = JSON.parse(localStorage.getItem("tt_players") || "[]"); } catch (e) { players = []; }
  function savePlayers() { try { localStorage.setItem("tt_players", JSON.stringify(players)); } catch (e) {} }
  var currentPlayerId = null;

  function loadEng(id) {
    var e = null;
    try { var s = localStorage.getItem("tt_eng_" + id); if (s) e = tt_deserialize(s); } catch (_) { e = null; }
    return e || tt_newEngine({ tablesUpTo: 12, age: 8, mode: "any" });
  }

  function loadChildPick(id) { try { var s = localStorage.getItem("tt_childpick_" + id); if (s) return JSON.parse(s); } catch (_) {} return { date: null, tables: [] }; }

  // Game 3 drill scaffolding: controller (tt_skin_drill) over the DOM panel (tt_panels).
  var ttScaffold = ttMakeScaffoldController(ttMountScaffold(ttEl("ttScaffold")));

  // Game 1 Pairs skin (tt_skin_pairs_play). tt_flow start/stops it with the screen.
  var ttPairs = ttMakePairs({
    ops: ttEl("ttPairsOps"), tablesWrap: ttEl("ttPairsTablesWrap"), tables: ttEl("ttPairsTables"),
    groups: ttEl("ttPairsGroups"), newGame: ttEl("ttPairsNew"), status: ttEl("ttPairsStatus"),
    hint: ttEl("ttPairsHint"), img: ttEl("ttPairsImg"), grid: ttEl("ttPairsGrid"),
    done: ttEl("ttPairsDone"), credit: ttEl("ttPairsCredit")
  });

  // Game 2 Pop skin (tt_skin_pop_play). Builds its scene inside #ttPop.
  var ttPop = ttMakePop(ttEl("ttPop"));

  var flow = ttStartFlow({
    screens: { who: ttEl("ttWho"), select: ttEl("ttSelect"), settings: ttEl("ttSettings"), adult: ttEl("ttAdult"), play: ttEl("ttPlay"), pairs: ttEl("ttPairs"), pop: ttEl("ttPop") },
    back: ttEl("ttBack"),
    // h15: the flow swaps these two — they share one slot and are never both live.
    helpBtn: ttEl("ttHelp"), whyBtn: ttEl("ttWhy"),
    mounts: { question: ttEl("ttQuestion"), input: ttEl("ttInput"), feedback: ttEl("ttFeedback"), checkpoint: ttEl("ttCheckpoint"), achievements: ttEl("ttAdultProgress") },
    scaffold: ttScaffold,
    pairs: ttPairs,
    pop: ttPop,
    profile: { age: 8 },
    onState: function (e) { if (currentPlayerId) { try { localStorage.setItem("tt_eng_" + currentPlayerId, tt_serialize(e)); } catch (_) {} } },
    onChildPick: function (pick) { if (currentPlayerId) { try { localStorage.setItem("tt_childpick_" + currentPlayerId, JSON.stringify(pick)); } catch (_) {} } }
  });
  ttEl("ttHelp").addEventListener("click", flow.helpMeOut);
  ttEl("ttWhy").addEventListener("click", flow.showMeWhy);

  function pickPlayer(id) { currentPlayerId = id; flow.selectPlayer(loadEng(id), loadChildPick(id)); }
  function renderPlayers() {
    var box = ttEl("ttPlayers"); box.innerHTML = "";
    players.forEach(function (p) { box.appendChild(avatarBtn({ e: p.avatar, name: p.name || "" }, function () { pickPlayer(p.id); })); });
  }
  function createPlayer(a) {
    var id = "p" + Date.now();
    players.push({ id: id, avatar: a.e, name: a.name }); savePlayers();
    ttEl("ttAvatarPop").style.display = "none";
    renderPlayers();
    pickPlayer(id);
  }
  (function buildAvatarGrid() {
    var g = ttEl("ttAvatarGrid");
    AVATARS.forEach(function (a) { g.appendChild(avatarBtn(a, function () { createPlayer(a); })); });
  })();
  ttEl("ttCreate").onclick = function () { ttEl("ttAvatarPop").style.display = ""; };
  ttEl("ttAvatarPop").onclick = function (e) { if (e.target === ttEl("ttAvatarPop")) ttEl("ttAvatarPop").style.display = "none"; };
  renderPlayers();

  // --- Games + child settings ----------------------------------------------
  // Four game slots. 1 = Pairs, 2 = Pop, 3 = the drill; 4 is a stub for now.
  Array.prototype.forEach.call(document.querySelectorAll(".tt-game"), function (b) {
    b.addEventListener("click", function () {
      if (this.id === "ttDrill") { ttEl("ttGamesMsg").textContent = ""; flow.goPlay(); }
      else if (this.id === "ttPairsBtn") { ttEl("ttGamesMsg").textContent = ""; flow.goPairs(); }
      else if (this.id === "ttPopBtn") { ttEl("ttGamesMsg").textContent = ""; flow.goPop(); }
      else { ttEl("ttGamesMsg").textContent = "This game isn't built yet."; }
    });
  });
  ttEl("ttGear").onclick = function () { renderChildPicker(); flow.goSettings(); };
  ttEl("ttMapBtn").onclick = function () { ttEl("ttGamesMsg").textContent = ""; flow.showMap(); };

  // child settings prefs (sound/timer). Stored now; wiring to real audio/timer is a later todo.
  var prefs = { sound: true, timer: false };
  try { prefs = Object.assign(prefs, JSON.parse(localStorage.getItem("tt_settings") || "{}")); } catch (e) {}
  ttEl("ttSound").checked = prefs.sound; ttEl("ttTimer").checked = prefs.timer;
  function savePrefs() { prefs.sound = ttEl("ttSound").checked; prefs.timer = ttEl("ttTimer").checked; try { localStorage.setItem("tt_settings", JSON.stringify(prefs)); } catch (e) {} }
  ttEl("ttSound").onchange = savePrefs; ttEl("ttTimer").onchange = savePrefs;
  ttEl("ttSettingsDone").onclick = flow.goSelect;   // explicit return to Games (clearer than the back arrow)

  // --- adult gate: linked FROM child settings (a hard times-table question) --
  // Gate: a FRESH random hard product each time it opens (a child can't memorise one answer).
  // Both factors drawn from the HARD tables {6,7,8,9,12} → hard for the target child, trivial
  // for an adult. TIMES char via charCode to dodge the project's multi-byte-encoding hazard.
  var GATE_ANSWER = 0, TIMES = String.fromCharCode(215), GATE_FACTORS = [6, 7, 8, 9, 12];
  function newGateQuestion() {
    var a = GATE_FACTORS[Math.floor(Math.random() * GATE_FACTORS.length)], b = GATE_FACTORS[Math.floor(Math.random() * GATE_FACTORS.length)];
    GATE_ANSWER = a * b;
    ttEl("ttGateQ").textContent = a + " " + TIMES + " " + b + " = ?";
  }
  ttEl("ttAdultLink").onclick = function () { newGateQuestion(); ttEl("ttGateMsg").textContent = ""; ttEl("ttGateIn").value = ""; ttEl("ttGate").style.display = ""; ttEl("ttGateIn").focus(); };
  function submitGate() {
    if (parseInt(ttEl("ttGateIn").value, 10) === GATE_ANSWER) { ttEl("ttGate").style.display = "none"; syncScopeUI(); flow.goAdult(); }
    else { ttEl("ttGateIn").value = ""; ttEl("ttGateMsg").textContent = ""; ttEl("ttGateIn").focus(); }  // reject silently — no "try again" prompt
  }
  ttEl("ttGateOk").onclick = submitGate;
  ttEl("ttGateIn").addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); submitGate(); } });

  // --- child table picker (in child Settings; only when adult policy = child-picks) --
  // Neutral tiles, no evaluation shown. Applied live as the child's daily `only` pick;
  // engine reads it via flow, resetting to engine each new calendar date. Blank on a new day.
  var TABLES_UP_TO = 12;
  (function buildChildTiles() {
    var box = ttEl("ttChildTables");
    for (var t = 1; t <= TABLES_UP_TO; t++) {
      var b = document.createElement("button"); b.type = "button"; b.className = "tt-chip"; b.textContent = t; b.dataset.t = t;
      b.addEventListener("click", function () { this.classList.toggle("sel"); commitChildTables(); });
      box.appendChild(b);
    }
  })();
  function commitChildTables() {
    flow.setChildTables(Array.prototype.map.call(ttEl("ttChildTables").querySelectorAll(".sel"), function (c) { return +c.dataset.t; }));
  }
  function renderChildPicker() {
    var show = flow.getScope().control === "child";
    ttEl("ttChildPickWrap").style.display = show ? "" : "none";
    if (!show) return;
    var today = flow.getChildPick().today;   // [] on a new day (blank)
    Array.prototype.forEach.call(ttEl("ttChildTables").children, function (t) { t.classList.toggle("sel", today.indexOf(+t.dataset.t) >= 0); });
  }

  // --- S1b: 3-way scope control + adult table picker (chips + group selectors) --
  (function buildChips() {
    var box = ttEl("ttChips");
    for (var t = 1; t <= TABLES_UP_TO; t++) {
      var b = document.createElement("button"); b.type = "button"; b.className = "tt-chip"; b.textContent = t; b.dataset.t = t;
      b.addEventListener("click", function () { this.classList.toggle("sel"); });
      box.appendChild(b);
    }
  })();
  // Scoped to #ttAdultTables / #ttChips ON BOTH SIDES. `.tt-chip` and `.tt-group` are
  // shared STYLE classes — the child picker (#ttChildTables) and Game 1 Pairs
  // (#ttPairsTables) use them too, so an unscoped querySelectorAll here wrote the
  // adult's group selection into every picker on the page (h13: getScope() returned
  // [3,4,8,11] three times over). Each picker owns its own chips.
  Array.prototype.forEach.call(document.querySelectorAll("#ttAdultTables .tt-group"), function (gb) {
    gb.addEventListener("click", function () {
      var set = this.dataset.g.split(",");
      Array.prototype.forEach.call(document.querySelectorAll("#ttChips .tt-chip"), function (c) { if (set.indexOf(c.dataset.t) >= 0) c.classList.add("sel"); });
    });
  });
  function scopeControlValue() { var r = document.querySelector('input[name="scope"]:checked'); return r ? r.value : "game"; }
  function strictValue() { var r = document.querySelector('input[name="strict"]:checked'); return r ? r.value : "mainly"; }
  function selectedTables() { return Array.prototype.map.call(document.querySelectorAll("#ttChips .tt-chip.sel"), function (c) { return +c.dataset.t; }); }
  function syncScopeUI() {
    var s = flow.getScope();
    (document.querySelector('input[name="scope"][value="' + s.control + '"]') || {}).checked = true;
    (document.querySelector('input[name="strict"][value="' + s.strict + '"]') || {}).checked = true;
    Array.prototype.forEach.call(document.querySelectorAll("#ttChips .tt-chip"), function (c) { c.classList.toggle("sel", s.tables.indexOf(+c.dataset.t) >= 0); });
    ttEl("ttAdultTables").style.display = (s.control === "adult") ? "" : "none";
  }
  Array.prototype.forEach.call(document.querySelectorAll('input[name="scope"]'), function (r) {
    r.addEventListener("change", function () { ttEl("ttAdultTables").style.display = (scopeControlValue() === "adult") ? "" : "none"; });
  });
  ttEl("ttAdultApply").onclick = function () {
    flow.setScope({ control: scopeControlValue(), tables: selectedTables(), strict: strictValue() });
    flow.goSelect();
  };
</script>
</body>
</html>
