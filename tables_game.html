<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tables — playtest host (slice 5)</title>
<style>
  /* Playtest host, not a skin. Ocean colour scheme (matches the bonds game / tt_shell). */
  :root {
    --blue: #3477b5; --blue-dark: #1d4e7e; --orange: #e08214;
    --bg: #f6f8fa; --card: #ffffff; --ink: #24313f; --grey: #b8c4cf;
    --tt-orange: var(--orange); --tt-blue-dark: var(--blue-dark); --tt-ink: var(--ink); --tt-line: #dde5ec;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: 'Trebuchet MS', sans-serif; background: var(--bg); color: var(--ink); }
  button, input, select, textarea { font-family: inherit; }   /* native controls don't inherit font by default */
  #app { max-width: 480px; margin: 0 auto; min-height: 100%; position: relative; }

  .tt-back { position: absolute; top: 12px; left: 12px; z-index: 5; width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--grey); background: var(--card); color: var(--blue-dark); font-size: 22px; line-height: 1; cursor: pointer; }
  .tt-back:active { background: #e3eefc; }
  .tt-gear { position: absolute; top: 12px; right: 12px; z-index: 5; width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--grey); background: var(--card); font-size: 22px; cursor: pointer; }

  .tt-screen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; }
  .tt-h { font-size: 26px; font-weight: 700; margin: 0 0 6px; color: var(--blue-dark); }
  .tt-choice { font-size: 22px; font-weight: 600; padding: 16px 26px; border-radius: 16px; border: 1px solid var(--grey); background: var(--card); color: var(--ink); cursor: pointer; min-width: 260px; }
  .tt-choice:active { background: #e3eefc; }
  .tt-subtle { font-size: 16px; font-weight: 600; padding: 8px 16px; border-radius: 12px; border: 1px solid var(--grey); background: var(--card); color: var(--blue-dark); cursor: pointer; }

  /* S0 players + avatar picker (each avatar has a NAME to aid memory) */
  .tt-players { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; max-width: 380px; }
  .tt-avatar-btn { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 78px; padding: 8px 4px; border-radius: 18px; border: 1px solid var(--grey); background: var(--card); cursor: pointer; }
  .tt-avatar-btn:active { background: #e3eefc; }
  .tt-av-e { font-size: 38px; line-height: 1; }
  .tt-av-n { font-size: 14px; font-weight: 600; color: var(--blue-dark); }
  .tt-avatars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: 360px; }

  /* settings + grown-up settings */
  .tt-field { background: var(--card); border: 1px solid var(--grey); border-radius: 14px; padding: 14px 18px; min-width: 300px; }
  .tt-label { font-weight: 700; color: var(--blue-dark); margin-bottom: 8px; }
  .tt-field label { display: block; font-size: 18px; padding: 6px 0; cursor: pointer; }
  .tt-chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 10px; }
  .tt-chip { min-width: 38px; height: 38px; border-radius: 19px; border: 1px solid var(--grey); background: var(--card); font-size: 16px; font-weight: 600; color: var(--ink); cursor: pointer; }
  .tt-chip.sel { background: var(--blue); color: #fff; border-color: var(--blue-dark); }
  .tt-groups { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .tt-group { font-size: 14px; padding: 6px 10px; border-radius: 12px; border: 1px solid var(--grey); background: var(--card); color: var(--blue-dark); cursor: pointer; }

  /* S2 play */
  .tt-question { font-size: 44px; font-weight: 700; letter-spacing: 2px; margin: 8px 0 20px; min-height: 56px; color: var(--blue-dark); }
  .tt-slot { margin: 0 6px; }
  .tt-blank { display: inline-block; min-width: 44px; border-bottom: 4px solid var(--grey); color: transparent; }
  .tt-sep { color: var(--grey); }
  .tt-input { width: 100%; }
  .tt-tiles { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .tt-tile { font-size: 26px; font-weight: 600; min-width: 68px; height: 68px; border-radius: 12px; border: 1px solid var(--grey); background: var(--card); color: var(--ink); cursor: pointer; }
  .tt-tile:active { background: #e3eefc; }
  .tt-keypad { max-width: 300px; margin: 0 auto; }
  .tt-entry { font-size: 40px; font-weight: 700; height: 56px; text-align: center; border-bottom: 3px solid var(--grey); margin-bottom: 14px; color: var(--blue-dark); }
  .tt-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .tt-key { font-size: 26px; height: 60px; border-radius: 12px; border: 1px solid var(--grey); background: var(--card); color: var(--ink); cursor: pointer; }
  .tt-key:active { background: #e3eefc; }
  .tt-key-enter { background: #e3eefc; }
  .tt-feedback { min-height: 30px; font-size: 20px; margin-top: 18px; text-align: center; }
  .tt-fb-correct { color: #2c7a3f; }
  .tt-fb-corrective { color: var(--orange); font-weight: 600; }

  /* overlays */
  .tt-overlay, .tt-checkpoint { position: absolute; inset: 0; background: rgba(36,49,63,.55); display: flex; align-items: center; justify-content: center; z-index: 8; }
  .tt-gate-card, .tt-cp-card { background: var(--card); border-radius: 16px; padding: 22px; display: flex; flex-direction: column; align-items: center; gap: 14px; max-width: 92vw; max-height: 90vh; overflow: auto; }
  .tt-gate-q { font-size: 26px; font-weight: 700; color: var(--blue-dark); }
  .tt-gate-in { font-size: 26px; width: 120px; text-align: center; padding: 6px; border: 2px solid var(--grey); border-radius: 10px; }
  .tt-gate-msg { color: var(--orange); min-height: 20px; }
  .tt-cp-title { font-size: 22px; font-weight: 700; color: var(--blue-dark); }
  .tt-cp-go { font-size: 28px; padding: 8px 32px; border-radius: 14px; border: none; background: #e3eefc; color: var(--blue-dark); cursor: pointer; }
  table.tt-map { border-collapse: collapse; }
  table.tt-map td, table.tt-map th { width: 26px; height: 26px; text-align: center; font-size: 12px; border: 1px solid var(--tt-line); }
  table.tt-map th { background: var(--bg); color: var(--ink); font-weight: 600; }
  table.tt-map td.tt-improved { outline: 3px solid var(--tt-orange); }
  /* fluent spark: white with a dark rim so it reads on every stage colour */
  table.tt-map td.tt-fluent   { background-image: radial-gradient(circle at top right, #fff 0 3.5px, #123 3.6px 4.5px, transparent 4.6px); }
  /* stage palette (h16, Kath "more colourful") — child map = best-ever, adult grid = current focus.
     × orange / ? purple / ÷ teal echo the scaffold's warm-cool family; stars sit on deep blues. */
  table.tt-map td { font-weight: 700; font-size: 15px; line-height: 1; }
  .tt-map-t0 { background: #eef1f4; color: #b0bcc8; }
  .tt-map-t1 { background: #ffb347; color: #5a2d00; }
  .tt-map-t2 { background: #b388ff; color: #2a0a5e; }
  .tt-map-t3 { background: #26c6da; color: #003a40; }
  .tt-map-t4 { background: #3949ab; color: #e8edf3; font-size: 17px !important; }
  .tt-map-t5 { background: #1a237e; color: #ffcc33; font-size: 17px !important; }
  .tt-map-key { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 12px; margin-top: 10px; font-size: 13px; color: var(--blue-dark); }
  .tt-map-key-item { display: inline-flex; align-items: center; gap: 4px; }
  .tt-map-sw { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 5px; font-weight: 700; font-size: 14px; }
  /* adult progress card (h16) — honest current tiers; mirrors the reef's adult summary */
  .tt-ach-card { background: var(--card); color: var(--blue-dark); border-radius: 14px; padding: 14px; margin-bottom: 14px; max-width: 92vw; }
  .tt-ach-title { font-weight: 700; font-size: 16px; margin-bottom: 6px; }
  .tt-ach-explain { font-size: 13px; line-height: 1.5; margin-bottom: 10px; }
  .tt-ach-counts { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; margin-bottom: 10px; }
  .tt-ach-row { font-size: 13px; margin-top: 8px; }

  /* === dark Plain colour scheme (h10) — navy page, tile-navy buttons, WHITE pop-ups ===
     Overrides only screen-level surfaces; the white-card machinery (--card / --bg map
     headers / --blue-dark card text) is left intact so overlays + the map stay readable. */
  html, body { background: #0a1a3a; color: #d0eeff; }          /* Plain navy page + light text */
  .tt-h { color: #d0eeff; }
  /* typical buttons + inline fields: paler navy than the page = the game-3 tile colour */
  .tt-choice, .tt-subtle, .tt-avatar-btn, .tt-back, .tt-gear, .tt-chip, .tt-group, .tt-field {
    background: #0e3a6a; color: #d0eeff; border-color: #1a5090; }
  .tt-choice, .tt-subtle { color: #d0eeff; }
  .tt-label, .tt-av-n, .tt-field label { color: #d0eeff; }
  .tt-choice:active, .tt-subtle:active, .tt-avatar-btn:active, .tt-back:active, .tt-gear:active,
  .tt-chip:active, .tt-group:active { background: #2060b0; }
  .tt-chip.sel { background: #00b8d4; color: #002030; border-color: #00b8d4; }
  /* pop-up panels stay WHITE via --card; their inner text uses --blue-dark (dark) → unchanged. */
</style>
<style>
/* ==== CSS tt_skin_drill.css [BEGIN] ==== */
/* ============================================================================
   tt_skin_drill.css — Game 3 "Plain" drill SKIN presentation (REAL skin code).
   ----------------------------------------------------------------------------
   Single source of truth for the drill's look. Inlined into BOTH the deliverable
   (game_template.html → tables_game.html, via build.sh <!--INLINECSS-->) AND the
   playtest harness (<link>). Never duplicated. Scoped under `.tt-drill` (applied
   to the play screen in the deliverable, to <body> in the harness) so it themes
   ONLY the drill and leaves the shell's other screens untouched. Keyed off the
   classes the modules emit (tt_panels / tt_flow / tt_scaffold_play). Colours from
   the OceanReefAndCave Plain skin (ocean_number_bonds_v7.html): background #0a1a3a,
   keypad/tile #0e3a6a on #d0eeff, question green #40ffcc, entry #0e2040 / #1a5090.
   ============================================================================ */

.tt-drill { font-family:'Trebuchet MS', sans-serif; color:#d0eeff; background:#0a1a3a; }

/* ---------------------------------------------------------------------------
   Play-screen layout — fill the screen's SHORT axis (Kath h12, game3 mobile).
   ONE source of truth for BOTH surfaces: the deliverable (#ttPlay.tt-play) and
   the skin playtest (#play.tt-play).
     • PORTRAIT (short axis = width) : column — array on top, tiles as a
       HORIZONTAL row spanning the FULL WIDTH beneath it.
     • LANDSCAPE (short axis = height): grid — array + question on the left,
       tiles as a VERTICAL column filling the FULL HEIGHT on the right.
   The array scales to its slot via the JS fit-helper (ttFitScaffold, tt_panels)
   so a tall fact never overflows; the tiles own the short axis either way.
   --------------------------------------------------------------------------- */
.tt-play { display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:14px; min-height:100vh; padding:18px 14px; }
/* PORTRAIT: cap the array at ~60% of the height so the horizontal tile row stays
   on-screen (no scroll to reach the answers). Small arrays are under the cap and
   untouched; a big fact (e.g. 8×7) is scaled to fit by ttFitScaffold. */
.tt-play .tt-scaffold-slot { display:flex; justify-content:center; min-height:0; min-width:0;
  max-height:52vh; overflow:hidden; }
/* PORTRAIT: tiles horizontal, full width under the array. NB the input MOUNT is
   itself `.tt-input.tt-tiles` (tt_panels renderTiles sets el.className) — the
   tile buttons are its direct children, so `.tt-tiles` IS the flex row. */
.tt-play .tt-input { width:100%; }
.tt-play .tt-tiles { display:flex; flex-flow:row wrap; justify-content:space-evenly;
  align-content:center; width:100%; gap:12px; }

/* LANDSCAPE (short axis = height): only when tiles+array coexist (recognition).
   Keypad recall (no array) keeps the plain centred stack. */
@media (orientation:landscape) and (max-height:600px) {
  /* FLANK the input into a full-height column on the right whenever it would
     otherwise overflow the short viewport — i.e. a scaffold card is on screen
     (tiles+array OR keypad+L3-caption corrective) OR the input is the KEYPAD
     (its 4-row pad + question overflows a plain centred stack at ~360px).
     `.tt-scaffold` exists only while a caption/array is shown (tt_panels clear()
     empties the slot). The one case left as a plain centred stack is a NORMAL
     recognition question (a short tile row, no scaffold) — it already fits. */
  .tt-play:has(.tt-scaffold), .tt-play:has(.tt-keypad) {
    display:grid; align-items:center; justify-items:center; gap:6px 18px; padding:10px 16px;
    /* DEFINITE height (not just min-height) so minmax(0,1fr) truly bounds the
       array row — otherwise a tall card grows the grid and the fit-helper sees
       the grown cell as "available" and never shrinks. overflow:hidden keeps
       the whole play within one screen (no scroll in landscape). */
    height:100vh; overflow:hidden;
    grid-template-columns:1fr auto; grid-template-rows:auto auto minmax(0,1fr) auto;
    grid-template-areas:"question input" "feedback input" "array input" "help input"; }
  .tt-play:has(.tt-scaffold) .tt-question, .tt-play:has(.tt-keypad) .tt-question { grid-area:question; margin:0; }
  .tt-play:has(.tt-scaffold) .tt-feedback, .tt-play:has(.tt-keypad) .tt-feedback { grid-area:feedback; text-align:center; }
  /* array cell has a DEFINITE height (minmax(0,1fr)); ttFitScaffold scales the
     card to fit and overflow:hidden clips the untransformed footprint so the
     grid row never grows to the card's natural size. */
  .tt-play:has(.tt-scaffold) .tt-scaffold-slot, .tt-play:has(.tt-keypad) .tt-scaffold-slot {
    grid-area:array; align-self:stretch; height:100%; width:100%; overflow:hidden; }
  .tt-play:has(.tt-scaffold) .tt-help, .tt-play:has(.tt-keypad) .tt-help { grid-area:help; }
  .tt-play:has(.tt-scaffold) .tt-input, .tt-play:has(.tt-keypad) .tt-input { grid-area:input; width:auto; height:100%; }
  /* recognition tiles: VERTICAL column filling the full height (short axis). */
  .tt-play:has(.tt-scaffold) .tt-tiles { flex-flow:column wrap; width:auto; height:100%;
    justify-content:space-between; align-content:center; gap:6px; }
  /* ...but a MANY set is a grid (see below), so flow it the other way: two full-height
     COLUMNS of `--tt-tile-half` rows, which is the landscape reading of the same
     two-line rule. grid-template-columns:none cancels the portrait column track. */
  .tt-play:has(.tt-scaffold) .tt-tiles.tt-tiles-many {
    grid-auto-flow:column; grid-template-columns:none;
    grid-template-rows:repeat(var(--tt-tile-half, 6), minmax(0, 1fr));
    width:auto; height:100%; gap:6px 8px; }
  /* recall keypad: its 3-col pad stays intact, just centred in the full-height column. */
  .tt-play:has(.tt-keypad) .tt-keypad { justify-content:center; height:100%; }
}

/* question — 40px bold, green writing; the inline answer box replaces the missing number */
.tt-drill .tt-question { font-size:40px; font-weight:bold; color:#40ffcc; letter-spacing:0;
  display:flex; align-items:center; justify-content:center; gap:0 .12em; white-space:nowrap; min-height:52px; }
.tt-drill .tt-inline-entry { display:inline-flex; align-items:center; justify-content:center;
  min-width:1.6em; min-height:1.05em; padding:0 .16em; margin:0 .06em; font-weight:bold;
  color:#fff; background:#0e2040; border:3px solid #1a5090; border-radius:16px; vertical-align:middle; }
.tt-drill .tt-inline-entry.correct { border-color:#40ffcc; color:#40ffcc; }

/* feedback (ttMountFeedback) */
.tt-drill .tt-feedback { min-height:34px; font-size:28px; font-weight:bold; }
.tt-drill .tt-fb-correct { color:#40ffcc; }
.tt-drill .tt-fb-corrective { color:#ffb347; }

/* input — keypad + recognition tiles (ttMountInput). Buttons = Plain num-pad colour. */
/* centre the KEYPAD block (fixed-width grid; without this it sits left of centre
   inside the deliverable's width:100% mount — h11). Scoped to .tt-keypad, NOT the
   generic .tt-input: the tiles mount is ALSO .tt-input and its flex-direction is
   owned by the responsive .tt-play rules (row portrait / column landscape); a
   generic .tt-input{flex-direction:column} here overrode that (h12). */
.tt-drill .tt-keypad { display:flex; flex-direction:column; align-items:center; }
.tt-drill .tt-pad { display:grid; grid-template-columns:repeat(3,72px); gap:6px; margin-top:10px; }
.tt-drill .tt-key { height:48px; border:none; border-radius:7px; background:#0e3a6a; color:#d0eeff;
  font-size:20px; font-weight:bold; font-family:inherit; cursor:pointer; }
.tt-drill .tt-key:active { transform:scale(.92); background:#2060b0; }
.tt-drill .tt-tiles { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }

/* MANY options (>6, i.e. the R3+ 12-tile discrimination set): AT MOST TWO LINES
   (Kath, h14 — "2 rows of 6 rather than 2 rows of 5"). Free wrapping gave ragged
   3-4 rows because the tiles are different widths (measured at 375px: 4/4/4 for
   two-digit options, 3/3/3/3 for three-digit ones). A grid of `--tt-tile-half`
   equal columns (tt_panels publishes ceil(options/2)) forces 6+6 and makes every
   tile the same width regardless of how many digits it holds.
   `minmax(0,1fr)` is what keeps six tiles inside the container instead of
   overflowing it; the smaller type is then required, not cosmetic. It applies in
   portrait too now (it used to be landscape-only, where the tiles were already
   being shrunk to fit one full-height column). */
.tt-drill .tt-tiles.tt-tiles-many { display:grid; justify-content:center; gap:8px;
  grid-template-columns:repeat(var(--tt-tile-half, 6), minmax(0, 1fr)); width:100%; }
/* Six across at 375px forces 18px type in a ~47px-wide tile, which at the old 6px
   padding was only 33px TALL — too small a target for a child's finger. Vertical
   padding costs nothing horizontally, so it is bought back here: 12px gives a
   ~46px-high tile at the same width (h14, measured). */
.tt-drill .tt-tiles.tt-tiles-many .tt-tile { font-size:18px; padding:12px 10px; min-width:0; }
.tt-drill .tt-tile { font-size:26px; font-weight:bold; padding:12px 20px; border:none; border-radius:7px;
  background:#0e3a6a; color:#d0eeff; cursor:pointer; }

/* scaffold replay (ttMountScaffold) — circular arrow, bottom-right of the white panel,
   same colour as the keypad tiles */
.tt-drill .tt-scaffold-replay { position:absolute; bottom:8px; right:8px; width:40px; height:40px; border-radius:50%;
  border:none; background:#0e3a6a; color:#d0eeff; font-size:22px; font-weight:700; line-height:1;
  cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,.2); }

/* ↻ clearance (Kath, h14): the button is absolutely positioned over the panel's
   bottom-right corner, which is exactly where the terminal caption sits — so on a
   TALL, NARROW panel (few columns: 10×2, 12×3) the equation ran under the button,
   and a ÷ sentence whose last line reached the right edge did the same. Measured
   at h14: 10×2 overlapped by 16px, a 2-line ÷ sentence by 25px.
   The clearance belongs HERE, with the button: the player knows nothing about a
   skin-owned button, so the skin that adds it pays for its space. Symmetric, so
   the caption stays centred under the array, and the panel grows only when the
   CAPTION is what drives its width — a wide array already has room, and is untouched.
   Geometry: the button occupies 48px (40 wide + 8 inset) of the panel's 18px-padded
   box, and the caption is centred, so the resulting gap is exactly (padding − 30)px.
   42px therefore buys a 12px gap. Scoped by :has() so an L3 caption-only panel,
   which has no ↻, is not needlessly widened. */
.tt-drill .tt-scaffold:has(.tt-scaffold-replay) .tt-scaffold-caption { padding:0 42px; }

/* Help me out — same colour AND squareness as the keypad tiles (radius 7px, not a pill) */
.tt-drill .tt-help { border:none; border-radius:7px; padding:12px 20px; font-weight:700; font-family:inherit;
  background:#0e3a6a; color:#d0eeff; cursor:pointer; margin-top:6px; }

/* --- copy-to-proceed hint (h15) ------------------------------------------------
   After a wrong answer the child is shown the right one and must COPY it into the
   box to advance (game3 §4.1). That is not self-evident, so after a quiet spell
   (TT_COPY_HINT_MS, armed in tt_flow from the scaffold's onDone — never before the
   count has finished) the box takes a white outline + underline, and the revealed
   answer and the box pulse ALTERNATELY: "that one" ... "goes here".
   Deliberately understated and geometry-free — no arrow, so nothing depends on the
   scaffold panel's scale transform (ttMountScaffold.fit), which would make any
   positional cue fragile. White is otherwise unused in this skin, so it reads as
   guidance rather than content, and it is safe for every CVD type. */
/* TWO MATCHING UNDERLINES carry the pairing (Kath h15): black under the revealed
   answer on its white card, white under the empty box on the dark ground — the same
   mark in each place's own ink. The visual rhyme says "this one belongs there"; no
   arrow, so nothing depends on the scaffold panel's scale transform. Both are real
   bars, NOT box-shadows: a shadow follows the box's 16px border-radius and reads as a
   faint crescent rather than a line (measured in the browser, h15).
   They fade alternately — slow and low-amplitude, to lead the eye from the answer up
   to the box. This is a fade on the MARKS, not the glow behind the digits that it
   replaces. Make them static by deleting the two animation lines. */
.tt-drill .tt-inline-entry { position:relative; }           /* anchor for the underline */
.tt-drill .tt-scaffold-answer { position:relative; }        /* ditto, on the white card */
/* the BOX also glows (Kath h15: useful, keep it) — in phase with its own white
   underline, so the box cue and the answer's black underline still alternate. */
.tt-drill .tt-inline-entry.tt-hint {
  border-color:#fff;
  animation:tt-hint-box 2.4s ease-in-out infinite;
}
@keyframes tt-hint-box { 0%, 100% { background:#2a4a7a; } 50% { background:#0e2040; } }
.tt-drill .tt-inline-entry.tt-hint::after,
.tt-drill .tt-scaffold-slot.tt-hint .tt-scaffold-answer::after {
  content:""; position:absolute; height:3px; border-radius:2px;
}
.tt-drill .tt-inline-entry.tt-hint::after {
  left:12%; right:12%; bottom:-9px; background:#fff;
  animation:tt-hint-mark 2.4s ease-in-out infinite;
}
.tt-drill .tt-scaffold-slot.tt-hint .tt-scaffold-answer::after {
  left:0; right:0; bottom:-6px; background:#000;
  animation:tt-hint-mark 2.4s ease-in-out infinite reverse;   /* half-cycle apart */
}
@keyframes tt-hint-mark { 0%, 100% { opacity:1; } 50% { opacity:.3; } }
/* reduce-motion: keep the steady outline + underline, drop the pulsing entirely.
   ttPlayScaffold already honours the same preference for the count itself. */
@media (prefers-reduced-motion: reduce) {
  .tt-drill .tt-inline-entry.tt-hint,

/* ==== CSS tt_skin_pairs.css [BEGIN] ==== */
/* ============================================================================
   tt_skin_pairs.css — GAME 1 "Pairs" SKIN presentation (REAL skin code).
   ----------------------------------------------------------------------------
   Single source of truth for the Pairs look. Inlined into the deliverable
   (game_template.html -> tables_game.html via build.sh <!--INLINECSS-->) and
   byte-identity-guarded by build.sh --check. Scoped under `.tt-pairs` so it
   themes ONLY Game 1. Colours from the Plain ocean skin, same values the drill
   uses (tt_skin_drill.css): page #0a1a3a, tile #0e3a6a on #d0eeff, border

   Design: tables_game1_pairs_design.md.

/* Full-height column: setup strip at fixed height, board takes the rest. The
   shell's .tt-screen centres its children vertically; Pairs needs the board to
   FILL, so the layout is re-stated here rather than inherited. */

  gap:6px; height:100vh; min-height:0; padding:8px 10px 6px; overflow:hidden;
  font-family:'Trebuchet MS', sans-serif; color:#d0eeff; }

.tt-pairs .tt-pairs-title { font-size:20px; font-weight:700; color:#d0eeff; margin:0; flex:0 0 auto; }

.tt-pairs .tt-pairs-setup { width:100%; max-width:460px; flex:0 0 auto; }
/* The shell's back button is an absolute 44px circle at (12,12) inside #app, over
   everything (z-index 5). Measured portrait 375x812: it covers y12-56, and the
   first setup row lands at y39 — under it, unclickable. Indent the first row past

  font-size:14px; font-weight:600; cursor:pointer; }
.tt-pairs .tt-chip:active { background:#2060b0; }
.tt-pairs .tt-chip.sel { background:#00b8d4; color:#002030; border-color:#00b8d4; }
/* A table the adult has ruled out: visible (the child can see the whole row) but

.tt-pairs .tt-chip.off { opacity:.3; cursor:default; }
.tt-pairs .tt-pairs-op { font-size:13px; padding:0 10px; }
.tt-pairs .tt-groups { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 4px; }
.tt-pairs .tt-group { font-size:12px; padding:5px 9px; border-radius:7px; border:1px solid #1a5090;

.tt-pairs .tt-group:active { background:#2060b0; }

.tt-pairs .tt-pairs-bar { display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  width:100%; max-width:460px; flex:0 0 auto; margin-bottom:2px; }
.tt-pairs .tt-pairs-new { border:none; border-radius:7px; padding:9px 18px; font-family:inherit;
  font-size:14px; font-weight:700; background:#0e3a6a; color:#40ffcc; cursor:pointer; }
.tt-pairs .tt-pairs-new:active { transform:scale(.95); background:#2060b0; }

.tt-pairs .tt-pairs-hint { font-size:12px; font-weight:600; color:#ffb347; min-height:14px; }

/* --- board ---------------------------------------------------------------- */
.tt-pairs .tt-pairs-board { position:relative; width:100%; max-width:460px;
  flex:1 1 auto; min-height:0; border-radius:12px; overflow:hidden; background:#06122a; }
/* The photo is the BACKDROP, never dimmed or overlaid (Kath h13) — matched cards
   simply stop covering it. No translucent banner sits on top of it at any point. */
.tt-pairs .tt-pairs-img { position:absolute; inset:0; width:100%; height:100%;
  object-fit:cover; object-position:center; }
.tt-pairs .tt-pairs-grid { position:absolute; inset:0; display:grid; gap:4px; padding:4px; }

.tt-pairs .tt-pairs-card { display:flex; align-items:center; justify-content:center; text-align:center;
  background:#0e3a6a; border:2px solid #1a5090; border-radius:8px; color:#d0eeff;
  /* Size off the SHORT axis as well as the width: a card must hold the longest
     face ("144 ÷ 12 =") on ONE line. Width-only scaling clipped it on a short
     landscape board (measured h13: 6 rows of ~45px, two lines of 26px). */
  font-weight:700; font-size:clamp(10px, min(4.2vw, 4.6vh), 24px); line-height:1.05; padding:2px;
  min-width:0; min-height:0; overflow:hidden; overflow-wrap:break-word; cursor:pointer;

.tt-pairs .tt-pairs-card.sel { background:#2060b0; border-color:#00b8d4; transform:scale(1.05); }
.tt-pairs .tt-pairs-card.wrong { background:#5a2430; border-color:#ffb347; }

  .tt-pairs .tt-pairs-board { max-width:none; }
  .tt-pairs .tt-chip { height:26px; font-size:13px; }

  .tt-pairs .tt-pairs-credit { font-size:8px; min-height:9px; }
}

<script>
// ==== MODULE tt_engine.js [BEGIN] ====
// ============================================================
// tt_engine.js — times-tables engine (Stage 1)
// ------------------------------------------------------------
// PURE: no DOM, no clock reads (time arrives via sessionCtx.nowTs and rides
// descriptors), rng injected. Same file drives the shell (tt_shell.html) and
// the sim harness (tt_sim.js). Canonical shapes: TABLES_HOOKS.md. Design:
// TABLES_ENGINE_SPEC.md (§refs below). Laws: TABLES_PRINCIPLES.md.
//
// Stage-1 stubs (BUILD_PROMPT): bridge (§6) — division rungs R6/R7 locked,
// bridge state carried but inert; re-entry probes; anomaly gate; accelerated
// promotion. Each marked TODO(SPEC §n).
// ============================================================

// --- calibratables (SPEC §12) — the ONE place defaults live -----------------
var TT_C = {
  RETENTION_CURVE_DAYS: [1, 1, 1, 2, 2, 3, 5, 7, 10, 14, 21, 30, 45, 60],
  SETPOINT: 0.80,             // success band target (guess, not law — PRINCIPLES §2.3)
  BAND_TOL: 0.10,             // band half-width before rung-adjust kicks in
  WIP_CAP_DEFAULT: 5,         // BASE new facts in flight (h-user: 3 felt too narrow in play)
  // bored release valve (h-user v2): challenge index, not streak — single lapses
  // are mistypes, not struggle; proficient children run at ~90%. Per-answer score
  // (h-user formula): accuracy(0/1) × speed(0.5–1.5 vs rung fast-bar) ×
  // difficulty(a+b) × (rung+10), averaged over a rolling window. Windowed average
  // means one wrong costs ~1/COMP_WINDOW of the index instead of resetting it.
  COMP_WINDOW: 12,            // answers in the competence window
  COMP_MIN_SAMPLES: 6,        // no valve opinion before this many samples
  CHALLENGE_PER_EXTRA: 25,    // index points per +1 effective WIP
  CHALLENGE_FLOOR: 40,        // below this index: no bonus at all
  SPEED_SCORE_MIN: 0.5, SPEED_SCORE_MAX: 1.5,
  WIP_BONUS_MAX: 10,          // effective WIP ≤ base + this
  BORED_INTRO_GAP: 2,         // intro spacing while escalated (else INTRO_MIN_GAP_Q)
  LAPSE_STEPBACK: 2,          // curvePtr on single lapse
  SAME_FACT_GAP: 6,           // questions (error re-asks exempt)
  SAME_PRODUCT_GAP: 8,        // questions between facts sharing a product
  NEIGHBOUR_GAP: 4,           // questions between {a,b} and {a,b±1}
  ERROR_REASK_MIN: 3, ERROR_REASK_MAX: 5,   // §7 step 3
  ERROR_REASK2_MIN: 12, ERROR_REASK2_MAX: 15, // §7 step 3b, questions after the first re-ask
  SESSION_WARM_QUESTIONS: 2,  // each game entry opens on comfortably-known facts
  INTRO_MIN_GAP_Q: 4,         // min questions between introductions
  ATTEMPTS_CAP: 20,           // rolling per-fact log
  ROLLING_WINDOW: 20,         // child rolling accuracy (non-ceremonial)
  PROBE_MAX_MISSES: 2,        // placement stop rule
  // rung trial machine (h-user): clean fast+correct hits needed at a rung to
  // confirm+promote, and rebuild questions required after an error before the
  // next rung may be trialled. Indexed by rung; harder rungs cost more.
  PROMOTE_HITS:          [1, 2, 2, 2, 3, 3, 3, 3, 3],
  REINFORCE_AFTER_ERROR: [0, 2, 2, 2, 3, 3, 3, 3, 3],
  MASTERED_MIN_PTR: 2,        // "mastered" phase also needs retention (honesty gate)
  CONSOLIDATING_MIN_RUNG: 4,  // below this, still product-from-tiles (recognition) = acquiring,
                              // NOT consolidating (h-user: rung-2 tile recognition overstated it)
  // fast-bars (ms) per rung — latency ≤ bar counts as "fast"/FLUENT (per-rung, SPEC §2)
  FAST_BAR_BY_RUNG: [8000, 4000, 4500, 5000, 5500, 5500, 7000, 8000, 9000],
  // T13 (h-user): SPEED is a SEPARATE axis from promotion. **h6 (h-user): promotion/confirmation is
  // gated on ACCURACY ALONE — a correct spaced answer confirms/climbs regardless of speed.** Speed only
  // marks a rung FLUENT (≤ fast-bar) and gates "mastered" (fluency at R8, tt_phase). Rationale: gating
  // promotion on speed is a learning dead-end for a reliable-but-slow DERIVER — unpromoted → never asked
  // the next rung → never practises it. This completes T13's loosening (originally fast; T13 → 2.5×
  // `CONFIRM_BAR_MULT`; h6 → accuracy, so the confirm-bar is RETIRED). A deriver climbs R1→R8 on
  // derivation and ends R8-confirmed-but-not-mastered (honest: they never automatize).
  AGE_FAST_MULT: function (age) { return age <= 7 ? 1.5 : age <= 9 ? 1.2 : 1.0; },
  AGE_INTERVAL_MULT: function (age) { return age <= 6 ? 0.7 : age <= 8 ? 0.85 : age <= 10 ? 1.0 : 1.15; },
  // §7 step 3c: the third re-ask is TIME-due, not "next session" (h16). A session is just a
  // game entry and may be a minute after the last one — that is no spacing at all.
  ERROR_REASK3_GAP_MS: 4 * 3600 * 1000,
  // --- re-entry probing (T11, SPEC §5) — after a gap, ceremonial recognition sweep -----
  // Checked at game entry (tt_startSession). The DUE filter is the real gate:
  // a short gap leaves little overdue, so the sweep self-limits (near-empty); a long gap
  // (days/weeks) exposes many decayed facts → a bigger, capped sweep. All guesses.
  REENTRY_GAP_MS: 7 * 86400000, // genuine-absence gate:
                                // re-entry probing is for "returned after a week+ away", not daily
                                // play — a daily player's state isn't stale, and a daily ceremonial
                                // sweep starves the division climb (20-seed sim, h4). Kath: 1 week.
  REENTRY_FRAC: 0.5,           // fraction of the due+confirmed pool to probe (scale mildly)
  REENTRY_MAX: 10,             // hard cap on probes per re-entry (never a "test wall")
  REENTRY_WEIGHT_BOOST: 3,     // selection-weight multiplier for a primed fact (land the re-ask soon)
  OPTIONS_R2: 4,   // brief scaffold step only — 1-in-4 luck is tolerable because R2 is transitional
  OPTIONS_R3: 12,  // real discrimination: right, not lucky (h-user; could rise to 20-24 both-tables-full)
  // --- bridge (× → ÷), SPEC §6 — all guesses, tune with real children ------------
  // The gate between R4 (mf tiles) and R5 (÷ tiles); also fires at R7→R8 for facts
  // placement-seeded past the tile rungs. Division then climbs the normal ladder
  // (R5 tiles → R8 keypad IS the post-gate scaffold fade — no separate machinery).
  BRIDGE_MIN_PTR: 0,           // retention required before bridging (0 = as soon as the pre-÷ rung confirms)
  // h16: PACING, not a cap. The old ≤2-launches-per-arc cap queued facts at R4→R5. Now a
  // fresh launch needs only BRIDGE_MIN_GAP_Q ordinary questions since the last battery
  // ended, so a backlog drains at up to ~1 battery per (stages + gap) questions.
  BRIDGE_MIN_GAP_Q: 8,         // Kath h16: 4 felt obtrusive
  // a fact that FAILED a battery isn't freshly relaunched for this many questions (its own
  // middle-fail retrigger is exempt) — stops one failing fact being hammered now there's no cap.
  BRIDGE_FAIL_COOLDOWN_Q: 20,
  BRIDGE_RETRIGGER_MIN: 3, BRIDGE_RETRIGGER_MAX: 5, // §6 middle-fail retrigger gap
  // adaptive fade (h-user): the GATE ceremony shrinks as the child proves ÷ transfer,
  // so an ace child isn't marched through 5 stages every fact. Counts clean+fast passes;
  // a ÷ lapse walks it back (ceremony returns if division is actually shaky).
  BRIDGE_FADE_TO_3: 2,         // clean full-gate passes before the short (3-stage) gate
  BRIDGE_FADE_TO_AUTO: 4,      // clean passes before auto-open (no battery; ÷ still proven on the R5/R8 climb)
  // --- anomaly gate (little-sibling quarantine, SPEC §5; tables_anomaly_design.md) ------
  // A whole SESSION (a game entry) reads grossly below profile → a weaker child
  // grabbed the tablet. Detect retrospectively at the next entry, DON'T fold it into the
  // long-term model, flag the adult, re-establish via a ceremonial assessment. All guesses,
  // tuned so littleSibling FIRES and variableKid's bad day does NOT (20-seed sim).
  ANOMALY_STRONG_RUNG: 5,      // confirmedRung ≥ this = a "strong"/known fact — used to decide a profile EXISTS to fall below
  ANOMALY_MIN_ANSWERS: 12,     // no anomaly verdict on a tiny session (too few ordinary answers to trust the accuracy)
  ANOMALY_MIN_STRONG_FACTS: 3, // the child must have ≥ this many strong facts at entry (an established profile to fall below)
  // SIGNAL = whole-session GLOBAL accuracy (robust over ~20 answers), NOT strong-fact frac: strong facts get too
  // few asks/session for a stable fraction, and lowFails is ~always 0 (strong facts aren't asked at low forms in
  // normal play). Sim: sibling gAcc 0.06–0.50 vs every ordinary persona's worst day ≥ 0.40 (variableKid), so a
  // 0.45 floor catches siblings; the rare variableKid dip self-corrects (its next-entry assessment reinstates).
  ANOMALY_GACC_FLOOR: 0.45,    // session global accuracy below this (with a profile present) = grossly below profile → flag
  ANOMALY_ASSESS_MAX: 8,       // ceremonial assessment probes at the next entry (cap; strongest snapshot claims first)
  ANOMALY_REINSTATE_FRAC: 0.4, // "SOME passes at the claimed level = compatible" (Kath, generous) → reinstate snapshot
};

// --- table groups / intro order (SPEC §1; h-user reorder) ---------------------
// The 1× table is a group-0 easy anchor (h-user T1, h4). REVERSES the earlier "table 1
// ungrouped, 1×k scattered inside each table's sweep" decision: those 1×k facts already
// existed, but 1×7 arrived among the HARD 7s (group 2) and was even mis-classed "hard".
// Now the 1s are explicit easy anchors, introduced together up front: ×1 is identity
// (trivial), and 1×5 / 5×1 is the gentlest COMMUTATIVITY image — the natural first place to
// teach "same fact, both orders" (ties T4 array visual + T7 commutativity fade-in). 1×1 is a
// real member here (its division form gives 1÷1). Order = 1 first → the 1s open the sequence.
var TT_GROUPS = [[1, 10, 5, 2], [3, 11, 4, 8], [6, 9, 7, 12]];

// --- rung ladder as DATA (SPEC §2; a list so reordering is cheap) --------------
// ONE linear climb (h-user): keypad arrives LATE — tiles carry ×, then missing-
// factor, then division; free entry (keypad) only after tile-division. The two
// division rungs (R5 tiles, R8 keypad) are gated PER-FACT by the bridge (§6):
// unavailable until that fact's bridge is open. The bridge sits between R4 and
// R5 for a normal climber (division met right after missing-factor, exploiting
// the ×/÷ link), and at R7→R8 for a fact placement-seeded past the tile rungs.
var TT_RUNGS = [
  { form: "intro",         opts: "intro"    },            // 0
  { form: "product",       opts: "tableFull" },           // 1  full ordered table
  { form: "product",       opts: "same4"    },            // 2  brief scaffold step
  { form: "product",       opts: "mixed12"  },            // 3  right-not-lucky
  { form: "missingFactor", opts: "factors"  },            // 4  1..N number line
  { form: "division",      opts: "factors", div: true },  // 5  ÷ tiles — bridge-gated (§6)
  { form: "product",       opts: null       },            // 6  keypad begins
  { form: "missingFactor", opts: null       },            // 7
  { form: "division",      opts: null, div: true },       // 8  ÷ keypad — bridge-gated (§6)
];
// A division rung is locked for a fact until its bridge is open (§6). Passing
// null for f treats division rungs as locked (the pre-bridge / global view).
function tt_rungLocked(f, i) { return !!TT_RUNGS[i].div && (!f || f.bridge !== "open"); }
function tt_nextUnlocked(f, r) {
  for (var i = r + 1; i < TT_RUNGS.length; i++) if (!tt_rungLocked(f, i)) return i;
  return r;
}
function tt_prevUnlocked(f, r) {
  for (var i = r - 1; i >= 1; i--) if (!tt_rungLocked(f, i)) return i;
  return r;
}
function tt_maxUnlocked(f) {
  for (var i = TT_RUNGS.length - 1; i >= 0; i--) if (!tt_rungLocked(f, i)) return i;
  return 0;
}
function tt_promoteHits(rung) { var v = TT_C.PROMOTE_HITS[rung]; return v == null ? 2 : v; }
function tt_reinforceAfterError(rung) { var v = TT_C.REINFORCE_AFTER_ERROR[rung]; return v == null ? 2 : v; }

// mode normalisation: "any" | {mainly:t|[t]} | {only:t|[t]} → {kind, tables[]}
function tt_modeInfo(mode) {
  if (!mode || mode === "any") return { kind: "any", tables: null };
  var t = mode.mainly !== undefined ? mode.mainly : mode.only;
  var tables = Array.isArray(t) ? t : [t];
  return { kind: mode.mainly !== undefined ? "mainly" : "only", tables: tables };
}
function tt_involves(f, tables) {
  if (!tables) return true;
  return tables.indexOf(f.a) >= 0 || tables.indexOf(f.b) >= 0;
}

function tt_factKey(a, b) { var lo = Math.min(a, b), hi = Math.max(a, b); return lo + "x" + hi; }

// Flat introduction order: tables in flattened group order; within a table t,
// k = 1..t (up to the square) then k = t+1..N; skip facts already introduced
// by an earlier table. Gives every fact a unique introIdx.
function tt_buildIntroOrder(tablesUpTo, claimOut) {
  var order = [], seen = {};
  var flat = [];
  for (var g = 0; g < TT_GROUPS.length; g++)
    for (var i = 0; i < TT_GROUPS[g].length; i++)
      if (TT_GROUPS[g][i] <= tablesUpTo) flat.push(TT_GROUPS[g][i]);
  for (var f = 0; f < flat.length; f++) {
    var t = flat[f];
    for (var k = 1; k <= tablesUpTo; k++) {
      var kk = (k <= t) ? k : k;            // 1..t then t+1..N is just 1..N ascending;
      var key = tt_factKey(t, kk);          // "up to square first" holds because k ascends
      if (!seen[key]) { seen[key] = true; order.push(key); if (claimOut) claimOut[key] = t; }
    }
  }
  // leftovers not covered by any grouped table's sweep. Table 1 is now in group 0 (T1), so the
  // 1s sweep covers 1×1 → this is a no-op today; kept defensively for any future ungrouped table.
  for (var a = 1; a <= tablesUpTo; a++)
    for (var b = a; b <= tablesUpTo; b++) {
      var k2 = tt_factKey(a, b);
      if (!seen[k2]) { seen[k2] = true; order.push(k2); if (claimOut) claimOut[k2] = a; }
    }
  return order;
}

// --- has a table's intro sweep STARTED? (the scaffold's "can the child count in this?") ---
// Derived from the intro pointer: the sweep for table t has begun once any fact CLAIMED by t
// has been seen. Monotone, no stored state, and it cannot drift from the intro order because
// the claim map comes from tt_buildIntroOrder's own loop.
// Deliberately NOT tt_getTableProgress, which counts DUAL membership — that would report the
// 8s as underway on the strength of 2x8, i.e. exactly backwards for this purpose.
function tt_tableStarted(eng, t) {
  var claim = eng._claimOf;
  if (!claim) return true;                 // defensive: no map (hand-built test engine) -> permissive
  for (var k in eng.facts) if (claim[k] === t && eng.facts[k].seen) return true;
  return false;
}

function tt_groupOfTable(t) {
  for (var g = 0; g < TT_GROUPS.length; g++)
    if (TT_GROUPS[g].indexOf(t) >= 0) return g;
  return -1;
}

// --- engine construction ------------------------------------------------------
function tt_newEngine(config) {
  config = config || {};
  var tablesUpTo = config.tablesUpTo === 12 ? 12 : 10;
  var claimOf = {};   // key -> the table whose intro sweep CLAIMS that fact (filled below)
  var eng = {
    schemaVersion: 2,   // v2 = keypad-late ladder (h-user); v1 rungs remap on load
    config: {
      tablesUpTo: tablesUpTo,
      age: config.age || 8,
      timerOptIn: !!config.timerOptIn,
      avatar: config.avatar || null,
    },
    child: {
      forgettingMult: 1.0,     // fitted in Stage 2 (rate-limited) — static here
      learningRate: null,      // estimated below from intro→confirmed attempt counts
      wipCap: config.wipCap || TT_C.WIP_CAP_DEFAULT,
      setpoint: config.setpoint || TT_C.SETPOINT,
      bridgeCleanPasses: 0,    // adaptive-fade counter: clean+fast gate passes (§6)
    },
    facts: {},                 // key -> fact record (SPEC §2)
    introOrder: tt_buildIntroOrder(tablesUpTo, claimOf),
    qCount: 0,                 // question counter (within-session recency clock)
    correctStreak: 0,          // consecutive non-ceremonial correct (panel display)
    compWindow: [],            // rolling per-answer challenge scores — release valve input
    score: 0,                  // effort gauge: +1 per correct, ceremonial INCLUDED (HOOKS §3)
    rolling: [],               // last N non-ceremonial {correct} for band tracking
    recentServed: [],          // [{key, product, q}] for constraint layer
    lastIntroQ: -999,
    lastAnswerTs: 0,
    pendingReveal: null,       // factKey -> next question is the reveal (§7 step 1)
    reaskQueue: [],            // [{key, dueAtQ, stage}] §7 step 3
    spacedReasks: [],          // [{key, dueAtTs}] §7 step 3c — time-due, released into reaskQueue when due
    probe: null,               // placement machine (below); null = done/not needed
    reentry: null,             // re-entry probe machine (T11); built on a gap, null = none active
    battery: null,             // active bridge battery {key, kind, stage, flip} (§6; singleton, contiguous)
    bridgeReask: [],           // [{key, dueAtQ}] middle-fail retriggers (§6) — in-flight, dropped at entry
    lastBatteryEndQ: -999,     // qCount when the last battery ended (bridge pacing, BRIDGE_MIN_GAP_Q)
    // SESSION = one game entry → exit (h16; replaces the 8-min "arc"). Opened by tt_startSession,
    // closed by tt_endSession — or implicitly by the NEXT tt_startSession if the page just died.
    // {id, startTs, asked, correct, factsImproved:{}, tablesTouched:{}, bridgesOpened:{}, warmLeft, lastWasLapse}
    session: null,
    sessionSeq: 0,
    lastSession: null,         // summary of the last CLOSED session (the exit / games-menu map reads it)
    achBest: {},               // factKey -> best-ever achievement tier (child map; never decreases) — h16
    eventLog: [],              // capped
    _handlers: [],
    // anomaly gate (SPEC §5; tables_anomaly_design.md) — whole-SESSION quarantine.
    goodSnapshot: null,        // durable last-known-good mastery state (deep copy of facts); the reinstate target
    pendingAssessment: false,  // prior session flagged → next entry runs the ceremonial re-establish assessment
    anomalyFlag: false,        // persistent adult-facing flag (raised on FLAG, cleared on reinstate, stays on "held")
    sessionMon: null,          // this session's monitor {answers, correct, strongAsks, strongFails} — global-acc anomaly signal
    _assessment: null,         // transient assessment machine (rebuilt each entry from pendingAssessment; not serialized)
  };
  // Underscore = not serialized. It is a pure function of config, so deserialize rebuilds
  // it via tt_newEngine(data.config) before the saved facts are copied over.
  eng._claimOf = claimOf;
  var facts = eng.facts;
  for (var i = 0; i < eng.introOrder.length; i++) {
    var key = eng.introOrder[i], parts = key.split("x");
    facts[key] = tt_newFact(+parts[0], +parts[1], i);
  }
  // T3 (h-user): a restricted profile scope has nothing to place ACROSS the groups, so the
  // cross-group placement probe is pointless — skip it and introduce within scope from scratch
  // (T10: the grid is earned by play, not seeded). The standing profile scope arrives as
  // `config.mode` (same shape as sessionCtx.mode; the shell passes profile.modeCfg to both).
  // "only" = a true restriction → skip. "any"/"mainly" keep full placement: the universe is open,
  // "mainly" only WEIGHTS selection, so cross-group placement is still meaningful.
  var pmi = tt_modeInfo(config.mode);
  eng.probe = pmi.kind === "only" ? null : tt_newProbeMachine(tablesUpTo);
  // (no event here — handlers attach after construction; a restricted profile is signalled by
  // eng.probe === null and the absence of PLACEMENT_DONE. HOOKS §placement notes this.)
  return eng;
}

function tt_newFact(a, b, introIdx) {
  return {
    key: tt_factKey(a, b), a: a, b: b, introIdx: introIdx,
    seen: false, inFlux: false,          // inFlux = counts toward WIP cap
    rung: 0,                             // working frontier (may lead confirmed in-session)
    confirmedRung: 0,                    // highest SPACED-confirmED rung — grid truth
    curvePtr: 0,                         // retention pointer (§3) — WHEN
    lastSuccessTs: 0, dueAtTs: 0,
    // bridge (× → ÷), SPEC §6 — gates the division rungs (R5/R8) on the linear
    // climb. bridge: unbridged | pending | open.
    bridge: "unbridged", lastBridgeFailStage: null,
    bridgeNeedReconfirm: false,  // early-fail: no re-bridge until a product rung re-confirms
    bridgeLastFailQ: -999,       // qCount of the last battery fail (fail cooldown; ≤1 middle-fail retrigger per cooldown)
    bridgeDivFlip: false,        // coin-flip alternation for the battery's ÷ stage divisor
    masteredEmitted: false,      // FACT_MASTERED fired once on the phase transition
    attempts: [], wrongStreak: 0,
    rungHits: 0,            // clean fast+correct at working rung since entry/last error
    reinforceLeft: 0,      // post-error rebuild questions before next rung may be trialled
    rungProvisional: false,// working rung seen once, not yet confirmed
    fluentRung: 0,         // T13: highest rung shown FLUENT (≤ fast-bar); ≤ confirmedRung; gates mastery
    seedVerify: false,     // R3.5 (h-user): placement-aced fact awaiting one unscaffolded × proof before R4/bridge
    placed: false,         // h6 (h-user): placement-SEEDED working rung → confirms on ONE clean in-play hit (not N);
                           //   cleared on that confirm or on any ordinary wrong (estimate then suspect → re-earn normally)
    reentryPrimed: false,  // T11: a failed re-entry probe boosts selection weight until the ordinary re-ask lands
    // commutativity (design doc §2): per-direction gates on the top keypad rung of each form.
    r6Orders: { ab: false, ba: false },   // × commutativity: product orders confirmed (≤confirm-bar) at R6; both → may climb past R6
    r8Dirs: { a: false, b: false },       // ÷ inverse-completeness: division directions fluent (≤fast-bar) at R8; both → mastered
    lastAskedAtQ: -999,
  };
}

// --- events -------------------------------------------------------------------
function tt_onEvent(eng, handler) { eng._handlers.push(handler); }
function tt_emit(eng, type, data) {
  var ev = { type: type, ts: eng.lastAnswerTs, q: eng.qCount };
  for (var k in data) ev[k] = data[k];
  eng.eventLog.push(ev);
  if (eng.eventLog.length > 300) eng.eventLog.shift();
  for (var i = 0; i < eng._handlers.length; i++) eng._handlers[i](ev);
  return ev;
}

// --- helpers ------------------------------------------------------------------
function tt_fastBar(eng, rung) {
  return TT_C.FAST_BAR_BY_RUNG[rung] * TT_C.AGE_FAST_MULT(eng.config.age);
}
// (tt_confirmBar / CONFIRM_BAR_MULT retired h6 — promotion is now accuracy-gated; speed only marks fluency.)
function tt_interval(eng, f) {
  var c = TT_C.RETENTION_CURVE_DAYS;
  var d = c[Math.min(f.curvePtr, c.length - 1)];
  return d * 86400000 * eng.child.forgettingMult * TT_C.AGE_INTERVAL_MULT(eng.config.age);
}
function tt_rollingAcc(eng) {
  var r = eng.rolling;
  if (r.length < 5) return null;
  var c = 0; for (var i = 0; i < r.length; i++) if (r[i]) c++;
  return c / r.length;
}
function tt_inFluxCount(eng) {
  var n = 0; for (var k in eng.facts) if (eng.facts[k].inFlux) n++;
  return n;
}
// challenge index (h-user formula): per-answer competence score, windowed mean.
// accuracy × speed × difficulty × rung-weight — full marks on baby facts scores
// low (release scales with demonstrated DEPTH, not just correctness).
function tt_answerCompScore(eng, d, correct, rtMs) {
  if (!correct) return 0;                          // accuracy multiplier is 0/1
  var bar = tt_fastBar(eng, d.rung);
  var speed = 1.5 - (rtMs / bar);                  // rt=bar/2 → 1.0
  if (speed < TT_C.SPEED_SCORE_MIN) speed = TT_C.SPEED_SCORE_MIN;
  if (speed > TT_C.SPEED_SCORE_MAX) speed = TT_C.SPEED_SCORE_MAX;
  return speed * (d.a + d.b) * (d.rung + 10);      // difficulty proxy: factor sum
}
function tt_challengeIndex(eng) {
  var w = eng.compWindow || [];
  if (w.length < TT_C.COMP_MIN_SAMPLES) return 0;
  var s = 0; for (var i = 0; i < w.length; i++) s += w[i];
  return s / w.length;
}
// bored release valve v2: effective WIP grows with the challenge index.
// Mistype-tolerant: one wrong dents the windowed mean, never zeroes it.
// Band health is a hard gate: under real struggle the index can linger on old
// high scores (error-flow ceremony starves the window of ordinary evidence),
// so a collapsed rolling accuracy zeroes the bonus immediately.
function tt_effectiveWip(eng) {
  var acc = tt_rollingAcc(eng);
  if (acc !== null && acc < eng.child.setpoint - 0.05) return eng.child.wipCap;
  var idx = tt_challengeIndex(eng);
  var bonus = idx < TT_C.CHALLENGE_FLOOR ? 0 : Math.floor(idx / TT_C.CHALLENGE_PER_EXTRA);
  if (bonus > TT_C.WIP_BONUS_MAX) bonus = TT_C.WIP_BONUS_MAX;
  return eng.child.wipCap + bonus;
}
function tt_factRecentAcc(f) {
  var n = 0, c = 0;
  for (var i = f.attempts.length - 1; i >= 0 && n < 6; i--) {
    if (f.attempts[i].ceremonial) continue;
    n++; if (f.attempts[i].correct) c++;
  }
  return n === 0 ? null : c / n;
}
// commutativity gates (design doc §2). Squares (a===b) have one direction → auto-satisfy.
function tt_bothOrders(f) { return f.a === f.b || (f.r6Orders && f.r6Orders.ab && f.r6Orders.ba); }
function tt_bothDivDirs(f) { return f.a === f.b ? !!(f.r8Dirs && (f.r8Dirs.a || f.r8Dirs.b)) : !!(f.r8Dirs && f.r8Dirs.a && f.r8Dirs.b); }
// commutativity §2 (S6): a demotion must re-prove both directions — reset the gate trackers below their rung.
function tt_resetGatesOnDemote(f) {
  if (f.rung <= 6 && f.r6Orders) f.r6Orders = { ab: false, ba: false };
  if (f.confirmedRung < 8 && f.r8Dirs) f.r8Dirs = { a: false, b: false };
}
function tt_phase(eng, f) {
  if (!f.seen) return "unseen";
  if (f.inFlux || f.confirmedRung < TT_C.CONSOLIDATING_MIN_RUNG) return "acquiring";
  // below the fact's own ceiling. For an UNBRIDGED fact the ceiling is R7 (÷ rungs
  // gated), so it can never reach "mastered" — division is a required form (SPEC §6
  // division-lag guard: never "mastered" off × evidence alone).
  if (f.confirmedRung < tt_maxUnlocked(f)) return "consolidating";
  if (f.bridge !== "open") return "consolidating";   // ÷ not yet unlocked → not mastered
  // form mastery reached (÷ keypad R8 confirmed), but "mastered" also needs retention —
  // survived a spacing gap — else it's in-session fluency illusion (honesty gate).
  if (f.curvePtr < TT_C.MASTERED_MIN_PTR) return "consolidating";
  // T13 (h-user): final mastery also needs FLUENCY at the top rung. A child can climb the whole
  // ladder to R8 answering correctly-but-slowly (competent/derived); "mastered" means they're also
  // FAST there (automatic). Some reach fluency before R8, some slowly after — this is the gate.
  if ((f.fluentRung || 0) < f.confirmedRung) return "consolidating";
  // commutativity §2: mastery also needs BOTH ÷ directions fluent at R8 (21÷3 AND 21÷7 — inverse completeness).
  if (!tt_bothDivDirs(f)) return "consolidating";
  return "mastered";
}

// --- descriptor builders --------------------------------------------------------
// presented: known factor in `left`, product in `right` for missing-factor forms;
// missingSlot: "result" | "factor1" (?×left=right) | "factor2" (left×?=right).
// Form derives from the rung spec (TT_RUNGS); intro/reveal callers override after.
function tt_describe(eng, f, rung, rng, flags) {
  var spec = TT_RUNGS[rung] || TT_RUNGS[1];
  var form = spec.form === "intro" ? "product" : spec.form;
  var swap = rng() < 0.5; // both surface orders from the start (SPEC §1)
  // commutativity §2: at R6 with one product order confirmed, force the mirror order (close the gate,
  // don't wait on the coin flip). swap=false → a first ("ab"); swap=true → b first ("ba").
  if (form === "product" && rung === 6 && f.a !== f.b && f.r6Orders) {
    if (f.r6Orders.ab && !f.r6Orders.ba) swap = true;
    else if (f.r6Orders.ba && !f.r6Orders.ab) swap = false;
  }
  var p1 = swap ? f.b : f.a, p2 = swap ? f.a : f.b, prod = f.a * f.b;
  var d = {
    factKey: f.key, a: f.a, b: f.b, form: form, rung: rung,
    scaffold: { options: null, ordered: false },
    flags: { ceremonial: false, probe: false, batteryKind: null, batteryStage: null, errorReask: false, intro: false, maintenance: false, seedVerify: false, reentry: false, assessment: false },
    correctAnswer: prod,
    // Which of this fact's two tables the child has actually MET, keyed by factor. The
    // scaffold counts in steps of one factor or the other, and a step the child cannot
    // take is not a scaffold — `2 x 8` counted 8, 16 skip-counts a table they have never
    // seen. Engine-honest signal: the engine knows the intro order, the shell renders.
    tableStarted: { },
  };
  d.tableStarted[f.a] = tt_tableStarted(eng, f.a);
  d.tableStarted[f.b] = tt_tableStarted(eng, f.b);
  if (form === "product") {
    d.presented = { left: p1, op: "×", right: p2, missingSlot: "result" };
    d.correctAnswer = prod;
  } else if (form === "missingFactor") {
    var hideFirst = rng() < 0.5;
    d.presented = { left: hideFirst ? p2 : p1, op: "×", right: prod, missingSlot: hideFirst ? "factor1" : "factor2" };
    d.correctAnswer = hideFirst ? p1 : p2;
  } else { // division
    var byA = rng() < 0.5;
    // commutativity §2: at R8 with one ÷ direction fluent, force the mirror divisor (close the mastery gate).
    if (rung === 8 && f.a !== f.b && f.r8Dirs) {
      if (f.r8Dirs.a && !f.r8Dirs.b) byA = false;      // force divide by b
      else if (f.r8Dirs.b && !f.r8Dirs.a) byA = true;  // force divide by a
    }
    d.presented = { left: prod, op: "÷", right: byA ? f.a : f.b, missingSlot: "result" };
    d.correctAnswer = byA ? f.b : f.a;
  }
  // scaffold options per rung spec (h-user: tile distractors = SECOND number's table).
  // product form only reaches these branches; p2 = second displayed, p1 = first.
  var sTable = p2, sMult = p1;   // answer = sTable × sMult
  if (spec.opts === "tableFull") {
    // R1: full ordered table of the second number — count-up crutch fully available
    var opts = [];
    for (var k = 1; k <= eng.config.tablesUpTo; k++) opts.push(sTable * k);
    d.scaffold = { options: opts, ordered: true, optionsTable: sTable };
  } else if (spec.opts === "same4") {
    // R2: ordered WINDOW of that table around the answer — countable/familiar,
    // narrower than the full table (no whole-table crutch, same recognisable group)
    d.scaffold = { options: tt_tableWindow(eng, sTable, sMult, TT_C.OPTIONS_R2, rng), ordered: true, optionsTable: sTable };
  } else if (spec.opts === "mixed12") {
    d.scaffold = { options: tt_distractors(eng, f, [f.a, f.b], TT_C.OPTIONS_R3, rng), ordered: false };
  } else if (spec.opts === "factors") {
    // missing-factor / division answer is a factor: ordered 1..N number line
    var fo = [];
    for (var k2 = 1; k2 <= eng.config.tablesUpTo; k2++) fo.push(k2);
    d.scaffold = { options: fo, ordered: true };
  }
  for (var fl in (flags || {})) d.flags[fl] = flags[fl];
  return d;
}

// table window (h-user): tile distractors come from the SECOND-DISPLAYED number's
// table — for "3×2" the 2× table — presented as an ordered slice INCLUDING the
// answer. A young child can lean on rote of the low, familiar table (count in 2s)
// rather than skip-counting the larger factor; the familiar sequence IS the
// scaffold. `table` = second number shown, `mult` = first → answer = table×mult.
function tt_tableWindow(eng, table, mult, count, rng) {
  var N = eng.config.tablesUpTo;
  if (count >= N) { var full = []; for (var m = 1; m <= N; m++) full.push(table * m); return full; }
  var minStart = Math.max(1, mult - count + 1);
  var maxStart = Math.min(mult, N - count + 1);
  if (maxStart < minStart) maxStart = minStart;
  var start = minStart + Math.floor(rng() * (maxStart - minStart + 1));
  var opts = [];
  for (var i = 0; i < count; i++) opts.push(table * (start + i));
  if (opts.indexOf(table * mult) < 0) opts[0] = table * mult;   // guarantee the answer present
  return opts;
}

// same-table distractors near the correct multiple (SPEC §2 R2/R3)
function tt_distractors(eng, f, tables, count, rng) {
  var prod = f.a * f.b, set = {}, pool = [];
  for (var ti = 0; ti < tables.length; ti++) {
    var t = tables[ti];
    for (var k = 1; k <= eng.config.tablesUpTo; k++) {
      var v = t * k;
      if (v !== prod && !set[v]) { set[v] = true; pool.push({ v: v, d: Math.abs(v - prod) }); }
    }
  }
  pool.sort(function (x, y) { return x.d - y.d; });
  var opts = [prod];
  for (var i = 0; i < pool.length && opts.length < count; i++)
    if (rng() < 0.7 || pool.length - i <= count - opts.length) opts.push(pool[i].v);
  // shuffle
  for (var j = opts.length - 1; j > 0; j--) {
    var r = Math.floor(rng() * (j + 1)), tmp = opts[j]; opts[j] = opts[r]; opts[r] = tmp;
  }
  return opts;
}

// A fact's difficulty within its group (h-user): the ×2/×5/×10 tables are
// "free" (trivial), so difficulty is driven by the OTHER factor. easy if that
// factor ≤5 (2×5, 4×10), hard if 6-9 (7×2, 9×5). Group-2 facts (both factors
// ≥6) are always hard — that group has no easy tier.
function tt_factDifficulty(f) {
  // ×1 is IDENTITY — no computation at all, so a 1×k fact is always easy regardless of k
  // (h-user T1). NB: 1 is NOT in the `trivial` set below — that set means "this factor makes
  // the OTHER factor drive difficulty" (×2 still needs doubling); ×1 makes the WHOLE fact free,
  // so 1×7 must be easy, not driven-hard by the 7. Guard it explicitly.
  if (f.a === 1 || f.b === 1) return "easy";
  var trivial = { 2: 1, 5: 1, 10: 1 }, d = 0;
  if (!trivial[f.a]) d = Math.max(d, f.a);
  if (!trivial[f.b]) d = Math.max(d, f.b);
  return d <= 5 ? "easy" : "hard";
}

// --- placement probe machine (SPEC §5; all ceremonial) ---------------------------
// FOUR facts per group (h-user): 2 easier + 2 harder, so placement resolves a
// child who knows the easy facts of a group but not the harder ones. Easy first
// within a group, groups easy→hard; stop after PROBE_MAX_MISSES. Keypad product
// (R6) form so recognition luck can't inflate placement. Seeds per group×tier.
function tt_newProbeMachine(tablesUpTo) {
  // T17 (h-user): each group ends with ONE ÷ probe (a cold R8 keypad ÷ — no recognition luck)
  // to detect a division-strong child. It does NOT count toward the × frontier stop rules; its
  // only job is to license the ÷ back-routing of EASIER groups in tt_probeSeed.
  var groups = [
    [ { k: "2x5", t: "easy" }, { k: "4x10", t: "easy" }, { k: "2x7", t: "hard" }, { k: "5x9", t: "hard" }, { k: "2x10", t: "div", div: true } ],
    [ { k: "3x4", t: "easy" }, { k: "4x4", t: "easy" }, { k: "3x7", t: "hard" }, { k: "4x8", t: "hard" }, { k: "3x8", t: "div", div: true } ],
    [ { k: "6x6", t: "hard" }, { k: "6x7", t: "hard" }, { k: "7x9", t: "hard" }, { k: "9x9", t: "hard" }, { k: "6x9", t: "div", div: true } ],
  ];
  return { groups: groups, gi: 0, ii: 0, misses: 0,
    results: [{ easy: [], hard: [], div: [] }, { easy: [], hard: [], div: [] }, { easy: [], hard: [], div: [] }], done: false };
}

function tt_probeNext(eng, sessionCtx, rng) {
  var pm = eng.probe;
  while (pm.gi < pm.groups.length) {
    if (pm.ii >= pm.groups[pm.gi].length) { pm.gi++; pm.ii = 0; continue; }
    var item = pm.groups[pm.gi][pm.ii], f = eng.facts[item.k];
    if (!f) { pm.ii++; continue; }   // fact absent in this config → skip
    // T17: ÷ probe = cold R8 keypad division (no scaffold, no recognition luck); × probe = R6 keypad product.
    var d = tt_describe(eng, f, item.div ? 8 : 6, rng, { ceremonial: true, probe: true });
    d._probeG = pm.gi; d._probeT = item.t; d._probeDiv = !!item.div;
    d._why = "placement probe g" + (pm.gi + 1) + " " + item.t;
    return d;
  }
  // exhausted (only reachable if trailing items were skipped) — finalize safely
  if (eng.probe && !eng.probe.done) {
    tt_probeSeed(eng); eng.probe.done = true; eng.probe = null;
    tt_emit(eng, "PLACEMENT_DONE", {});
  }
  return null;
}

function tt_probeRecord(eng, d, correct) {
  var pm = eng.probe;
  pm.results[d._probeG][d._probeT].push(!!correct);
  if (!correct && !d._probeDiv) pm.misses++;   // T17: a ÷-probe miss is expected for a non-÷ child — never a × frontier signal
  pm.ii++;   // advance past the item just answered
  // Stop rules (h-user priority principle): (a) PROBE_MAX_MISSES within a group
  // = beginner bail; (b) once a group is COMPLETED with any miss, that group is
  // the child's frontier — stop, don't probe later groups (they release via WIP).
  var finalize = false;
  if (pm.misses >= TT_C.PROBE_MAX_MISSES) {
    finalize = true;
  } else if (pm.ii >= pm.groups[pm.gi].length) {
    var r = pm.results[pm.gi], groupMiss = false;
    r.easy.concat(r.hard).forEach(function (x) { if (!x) groupMiss = true; });
    if (groupMiss) finalize = true;                 // frontier group complete → stop
    else { pm.gi++; pm.ii = 0; if (pm.gi >= pm.groups.length) finalize = true; }
  }
  if (finalize) {
    tt_probeSeed(eng);
    pm.done = true;
    eng.probe = null;
    tt_emit(eng, "PLACEMENT_DONE", {});
  }
}

// A fact belongs to the group of its EASIER factor (h-user): 2×6 is a "2s fact"
// — derivable via the 2× table — so it seeds/introduces with group 0, NOT with
// the hard 6s. This matches the intro order (a fact is introduced at the earliest
// of its two factors' tables). Table 1 is ungrouped → treat as latest.
function tt_introGroupOfFact(f) {
  var ga = tt_groupOfTable(f.a), gb = tt_groupOfTable(f.b);
  var A = ga < 0 ? 99 : ga, B = gb < 0 ? 99 : gb;
  var g = Math.min(A, B);
  return g === 99 ? 0 : g;   // defensive: all tables 1–12 are grouped now (T1), so 99 is
                             // unreachable for real facts — kept for any future ungrouped table
}

// Seed per group × difficulty tier (h-user): easy-probe results seed the group's
// easy facts, hard-probe results seed its hard facts — so a child can end up with
// "easy 2s" solid and "hard 2s" (2×7, 2×8) still to learn.
function tt_probeSeed(eng) {
  var pm = eng.probe, tiers = ["easy", "hard"];
  for (var g = 0; g < pm.groups.length; g++) {
    for (var ti = 0; ti < tiers.length; ti++) {
      var tier = tiers[ti], res = pm.results[g][tier];
      if (!res.length) continue;
      var passes = 0; for (var i = 0; i < res.length; i++) if (res[i]) passes++;
      var strong = res.length >= 2 && passes === res.length;
      var partial = passes >= 1 && !strong;
      if (!strong && !partial) continue;
      for (var key in eng.facts) {
        var f = eng.facts[key];
        if (tt_introGroupOfFact(f) !== g) continue;   // easier-factor group (matches intro order)
        if (tt_factDifficulty(f) !== tier) continue;  // seed only this difficulty tier
        // T10 (h-user): placement ESTIMATES, it doesn't prove — seed the WORKING rung
        // (where to start asking) but leave confirmedRung/curvePtr at 0, so the fact is
        // PROVISIONAL (rung > confirmedRung → uncoloured on the grid) until the child
        // earns it in play. Only tt_recordAnswer's ordinary evidence raises confirmedRung.
        f.seen = true; f.inFlux = false;              // seeded facts don't count toward WIP
        f.confirmedRung = 0; f.curvePtr = 0;           // nothing confirmed/retained yet
        f.placed = true;                               // h6: one clean in-play hit confirms the seeded rung (Issue 2a)
        // R3.5 (h-user): a placement-ACED fact used to seed straight to R6, which routed
        // the child's best-known facts to LATE, HARD ÷ (they bridged only at R7→R8, skipping
        // the gentle R5 ÷ tiles). Instead enter a seed-verify state: skip the easy × ladder,
        // but prove × with ONE clean unscaffolded product, then land on R4 so the ordinary
        // R4→R5 bridge gives gentle EARLY ÷. A partial pass still starts mid-ladder at R3.
        if (strong) { f.rung = 4; f.seedVerify = true; } else { f.rung = 3; }
      }
    }
    // priority gate (h-user): a group not FULLY cleared (every fact probed AND all
    // correct) is the child's frontier — do NOT activate later groups. They release
    // later through WIP-gated introduction, in order. Belt-and-suspenders with the
    // probe stop rule (which already halts probing at the frontier group).
    var existing = 0, misses = 0;
    var probed = pm.results[g].easy.length + pm.results[g].hard.length;
    for (var m = 0; m < pm.groups[g].length; m++) if (eng.facts[pm.groups[g][m].k] && !pm.groups[g][m].div) existing++;  // T17: ÷ probe excluded from the × frontier count
    [].concat(pm.results[g].easy, pm.results[g].hard).forEach(function (r) { if (!r) misses++; });
    if (!(probed >= existing && misses === 0)) break;   // frontier reached — stop
  }
  // T17 (h-user; frontier rule h6): a division-COMPETENT child's facts back-route onto the ÷ ladder
  // by their position relative to the × FRONTIER — an ace who knows division isn't marched through the
  // slow bridge on their simplest facts. The × frontier is `g` after the seeding loop above (the group
  // placement stopped in, or numGroups if all cleared). Rule: every group BELOW the split group →
  // ALL facts R5; the SPLIT group → easy R5 / hard R4 (seed-verify). Split group = frontier−1, but never
  // above where ÷ was actually SHOWN — the ÷-competence gate CAPS the reach (a strong-×-weak-÷ child is
  // NOT over-placed into division). SOME ÷ correct at a group = competence there. Working rung only —
  // confirmedRung stays 0 (T10), grid uncoloured until earned. (`placed` above → one hit confirms.)
  var frontierGroup = g;   // g is function-scoped: post-loop it holds the frontier (or numGroups if all cleared)
  var maxDivGroup = -1;
  for (var dg = 0; dg < pm.groups.length; dg++) {
    var dr = pm.results[dg].div || [];
    for (var dj = 0; dj < dr.length; dj++) if (dr[dj]) { maxDivGroup = dg; break; }   // SOME ÷ correct at this group
  }
  var routeTop = Math.min(frontierGroup - 1, maxDivGroup);    // highest group to ÷-route (frontier-bounded AND ÷-capped)
  if (maxDivGroup >= 0 && routeTop >= 0) {
    for (var dk in eng.facts) {
      var df = eng.facts[dk];
      if (!df.seen) continue;                                 // only facts placement already seeded
      var gg = tt_introGroupOfFact(df);
      if (gg > routeTop) continue;                            // above the routed range → keep normal placement
      if (gg < routeTop || tt_factDifficulty(df) === "easy") {
        df.rung = 5; df.bridge = "open"; df.seedVerify = false;   // below split, or split-group EASY → ÷ tiles now
      } else {
        df.rung = 4; df.seedVerify = true;                       // split-group HARD → R3.5 early-÷ on-ramp
      }
      df.placed = true;
      tt_emit(eng, "SEED_DIV_ROUTED", { factKey: df.key, toRung: df.rung, fromDivGroup: maxDivGroup });
    }
  }
}

// --- re-entry probe machine (T11, SPEC §5; sibling of the placement probe) ---------
// Real children return after days/weeks. The engine must neither mass-demote nor keep
// blindly trusting overdue facts — it PROBES a sample (ceremonial, so the probe itself
// never moves mastery), then lets ordinary evidence adjust. The between-session sibling
// of T9/T10: earned state, not asserted state, across a gap too.

// Build the sweep: DUE + CONFIRMED facts scored by overdue-ness × rung weight (most
// decayed AND highest confirmedRung = biggest false grid claim). Count scales mildly
// with how much is due, capped. Returns null if nothing qualifies (short gap self-limits).
function tt_newReentryMachine(eng, sessionCtx) {
  var now = sessionCtx.nowTs, mi = tt_modeInfo(sessionCtx.mode), cand = [];
  for (var key in eng.facts) {
    var f = eng.facts[key];
    if (!f.seen || f.confirmedRung < 1) continue;         // nothing confirmed → nothing to re-check
    if (f.dueAtTs === 0 || now < f.dueAtTs) continue;     // only DUE (decayed past its interval)
    if (mi.kind === "only" && !tt_involves(f, mi.tables)) continue;  // scoped session: stay in scope
    var overdue = (now - f.dueAtTs) / Math.max(1, tt_interval(eng, f));
    cand.push({ key: key, score: overdue * (1 + f.confirmedRung) });
  }
  if (!cand.length) return null;
  cand.sort(function (a, b) { return b.score - a.score; });
  var n = Math.min(TT_C.REENTRY_MAX, Math.max(1, Math.ceil(cand.length * TT_C.REENTRY_FRAC)));
  if (n > cand.length) n = cand.length;
  var keys = [];
  for (var i = 0; i < n; i++) keys.push(cand[i].key);
  return { keys: keys, i: 0, done: false };
}

// serve the next re-entry probe (advances on record, mirroring the placement probe).
function tt_reentryNext(eng, sessionCtx, rng) {
  var rm = eng.reentry;
  while (rm.i < rm.keys.length) {
    var f = eng.facts[rm.keys[rm.i]];
    if (f && f.confirmedRung >= 1) return tt_reentryDescriptor(eng, f, rng);
    rm.i++;   // demoted/reset since the sweep was built → skip
  }
  rm.done = true; eng.reentry = null;
  return null;
}

// recognition-grade probe at the fact's CONFIRMED form: a keypad confirmation is
// re-checked by RECOGNITION (undecorated options), never a cold keypad ask (no test
// feel, HOOKS §1). ÷ facts get a divTransfer-agnostic ÷ recognition (p÷a | p÷b).
function tt_reentryDescriptor(eng, f, rng) {
  var cr = f.confirmedRung;
  var form = TT_RUNGS[cr] ? TT_RUNGS[cr].form : "product";
  if (form === "intro") form = "product";
  // tile-form rung matching the confirmed form → carries recognition options
  var recRung = form === "division" ? 5 : form === "missingFactor" ? 4 : 3;
  var d = tt_describe(eng, f, recRung, rng, { ceremonial: true, reentry: true });
  d.rung = cr;   // log/panel honesty: this re-checks the CONFIRMED rung
  d._why = "re-entry probe (confirmed R" + cr + ", recognition-grade, ceremonial)";
  return d;
}

// record a re-entry probe answer (ceremonial — never moves mastery, inv4/T10). A fail
// PRIMES: arm reinforcement so the next ORDINARY wrong demotes via T9, and boost weight
// so that re-ask lands soon. A pass does nothing (it just confirms trust). Arming a
// lockout leaves confirmedRung/rung/curvePtr untouched, so inv4 holds.
function tt_reentryRecord(eng, d, correct) {
  var rm = eng.reentry;
  if (rm) rm.i++;                                  // consume this probe
  var f = eng.facts[d.factKey];
  if (!f) return;
  if (!correct && f.confirmedRung >= 1) {
    f.reinforceLeft = tt_reinforceAfterError(f.confirmedRung);
    f.reentryPrimed = true;
    tt_emit(eng, "REENTRY_PRIMED", { factKey: f.key, rung: f.confirmedRung, reinforce: f.reinforceLeft });
  }
}

// --- anomaly gate (little-sibling quarantine, SPEC §5; tables_anomaly_design.md) ------
// A SESSION = a game ENTRY. A whole session grossly below profile = a weaker
// child on the tablet. We DON'T fold it into the long-term model: snapshot the good state
// at entry, detect regression retrospectively, and at the NEXT entry re-establish via a
// ceremonial assessment (reinstate the snapshot if the child shows SOME competence at the
// claimed level; else keep the demoted state + adult flag). Never auto-destroys — the adult
// can tt_forceReinstate. Confirmation-source law holds (the assessment is ceremonial).

function tt_masterySnapshot(eng) {
  return JSON.parse(JSON.stringify(eng.facts));   // deep copy of all fact/progress state
}
function tt_restoreSnapshot(eng) {
  if (!eng.goodSnapshot) return false;
  eng.facts = JSON.parse(JSON.stringify(eng.goodSnapshot));   // copy back (don't alias the stored snapshot)
  return true;
}

// Called at every game ENTRY (shell / sim per day / tests) — the ONLY session boundary (h16).
// (0) closes any session left open (the page died without tt_endSession — no unload hook is
// trusted) and drops IN-FLIGHT state that is meaningless after a break; (1) judges the
// just-ended session's monitor (retrospective detection); (2) sets up the snapshot or the
// recovery assessment; (3) resets the monitor; (4) re-entry sweep after a genuine absence;
// (5) opens the new session. Returns the session id.
function tt_startSession(eng, sessionCtx) {
  if (eng.session) tt_endSession(eng, true);
  // in-flight state: a battery is CONTIGUOUS by design (§6) — resuming stage 3 after a browser
  // close is not that, so drop it (not a fail: the fact stays eligible). A reveal/re-entry of
  // an answer the child gave before the break is out of context. reaskQueue CARRIES OVER (Kath h16).
  eng.battery = null; eng.bridgeReask = []; eng.pendingReveal = null; eng._awaitingReentry = null;
  var m = eng.sessionMon;
  if (m && m.answers >= TT_C.ANOMALY_MIN_ANSWERS) {
    var strongFacts = 0, snap = eng.goodSnapshot || {};
    for (var sk in snap) if (snap[sk].seen && snap[sk].confirmedRung >= TT_C.ANOMALY_STRONG_RUNG) strongFacts++;
    var gacc = m.correct / m.answers;
    if (strongFacts >= TT_C.ANOMALY_MIN_STRONG_FACTS && gacc < TT_C.ANOMALY_GACC_FLOOR) {
      eng.pendingAssessment = true;
      eng.anomalyFlag = true;
      tt_emit(eng, "ANOMALY_FLAGGED", { gacc: Math.round(gacc * 100) / 100, answers: m.answers, strongFacts: strongFacts, strongFails: m.strongFails, strongAsks: m.strongAsks });
    }
  }
  if (eng.pendingAssessment) {
    eng._assessment = tt_newAssessmentMachine(eng);   // test against goodSnapshot; DON'T overwrite it
    if (!eng._assessment) { eng.pendingAssessment = false; eng.anomalyFlag = false; }  // nothing strong to protect
  } else {
    eng.goodSnapshot = tt_masterySnapshot(eng);        // trusted entry → current state is the new baseline
  }
  eng.sessionMon = { answers: 0, correct: 0, strongAsks: 0, strongFails: 0 };
  // T11 re-entry probing: after a GENUINE ABSENCE (REENTRY_GAP_MS), build a ceremonial
  // recognition sweep over the most-decayed CONFIRMED facts (overdue × rung weight; §5).
  // tt_nextQuestion serves it before ordinary selection. A probe fail PRIMES (never demotes —
  // inv4/T10). A daily player's state isn't stale, and a daily sweep starves the division climb
  // (sim, h4). Skipped while placement is still running, and superseded by the anomaly
  // assessment (tables_anomaly_design.md: both re-establish trust — don't run both).
  if (eng.lastAnswerTs && !eng.probe && !eng.pendingAssessment && !eng._assessment
      && sessionCtx.nowTs - eng.lastAnswerTs > TT_C.REENTRY_GAP_MS) {
    var rm = tt_newReentryMachine(eng, sessionCtx);
    if (rm) { eng.reentry = rm; tt_emit(eng, "REENTRY_STARTED", { count: rm.keys.length }); }
  }
  eng.sessionSeq++;
  eng.lastBatteryEndQ = -999;
  eng.session = { id: eng.sessionSeq, startTs: sessionCtx.nowTs, asked: 0, correct: 0, factsImproved: {}, tablesTouched: {}, bridgesOpened: {}, warmLeft: TT_C.SESSION_WARM_QUESTIONS, lastWasLapse: false };
  tt_emit(eng, "SESSION_OPENED", { sessionId: eng.sessionSeq });
  return eng.sessionSeq;
}

// Close the open session (game exit). Idempotent. `implicit` = closed by the next entry
// because the page died. The summary is kept as eng.lastSession (serialized) for the map.
function tt_endSession(eng, implicit) {
  var a = eng.session;
  if (!a) return eng.lastSession;
  var summary = { sessionId: a.id, startTs: a.startTs, asked: a.asked, correct: a.correct,
    factsImproved: Object.keys(a.factsImproved), tablesTouched: Object.keys(a.tablesTouched).map(Number),
    bridgesOpened: Object.keys(a.bridgesOpened), implicit: !!implicit };
  tt_emit(eng, "SESSION_CLOSED", summary);
  eng.session = null;
  eng.lastSession = summary;
  return summary;
}

// Build the recovery assessment from the GOOD snapshot's strong facts (strongest claims
// first). Ceremonial recognition probes at the snapshot's confirmed rung. null if none.
function tt_newAssessmentMachine(eng) {
  var snap = eng.goodSnapshot; if (!snap) return null;
  var cand = [];
  for (var key in snap) {
    var sf = snap[key];
    if (sf && sf.seen && sf.confirmedRung >= TT_C.ANOMALY_STRONG_RUNG) cand.push({ key: key, cr: sf.confirmedRung });
  }
  if (!cand.length) return null;
  cand.sort(function (a, b) { return b.cr - a.cr; });   // strongest claims first
  var n = Math.min(TT_C.ANOMALY_ASSESS_MAX, cand.length);
  var keys = []; for (var i = 0; i < n; i++) keys.push(cand[i].key);
  return { keys: keys, i: 0, asks: 0, passes: 0, done: false };
}

// serve the next assessment probe: recognition-grade at the SNAPSHOT confirmed rung (mirror
// of the re-entry descriptor — options, not a cold keypad; no test feel). Ceremonial.
