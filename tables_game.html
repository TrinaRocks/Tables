function tt_assessmentNext(eng, sessionCtx, rng) {
  var am = eng._assessment;
  while (am.i < am.keys.length) {
    var key = am.keys[am.i], f = eng.facts[key], sf = eng.goodSnapshot[key];
    if (!f || !sf) { am.i++; continue; }
    var cr = sf.confirmedRung;
    var form = TT_RUNGS[cr] ? TT_RUNGS[cr].form : "product";
    if (form === "intro") form = "product";
    var recRung = form === "division" ? 5 : form === "missingFactor" ? 4 : 3;
    var d = tt_describe(eng, f, recRung, rng, { ceremonial: true, assessment: true });
    d.rung = cr;
    d._why = "anomaly assessment (re-establish confirmed R" + cr + ", recognition-grade, ceremonial)";
    return d;
  }
  tt_assessmentResolve(eng);
  return null;
}

// record an assessment probe (ceremonial — moves no mastery). On the last one, resolve.
function tt_assessmentRecord(eng, d, correct) {
  var am = eng._assessment; if (!am) return;
  am.asks++; if (correct) am.passes++; am.i++;
  if (am.i >= am.keys.length) tt_assessmentResolve(eng);
}

// resolve: SOME passes at the claimed level (generous, Kath) → reinstate the good snapshot;
// else keep the demoted state ("special cases of special cases") with the adult flag up.
function tt_assessmentResolve(eng) {
  var am = eng._assessment; if (!am || am.done) return;
  am.done = true;
  var compatible = am.asks > 0 && am.passes / am.asks >= TT_C.ANOMALY_REINSTATE_FRAC;
  if (compatible) {
    tt_restoreSnapshot(eng);
    eng.anomalyFlag = false;
    tt_emit(eng, "ANOMALY_ASSESSMENT", { outcome: "reinstated", passes: am.passes, asks: am.asks });
  } else {
    tt_emit(eng, "ANOMALY_ASSESSMENT", { outcome: "held", passes: am.passes, asks: am.asks });
    // anomalyFlag stays raised: the adult is the backstop, and may tt_forceReinstate.
  }
  eng.pendingAssessment = false;
  eng._assessment = null;
}

// adult override ("yes, it was the sibling"): restore the good snapshot regardless. Never
// auto-destroy — this is the human-decides escape hatch the SPEC §5 gate requires.
function tt_forceReinstate(eng) {
  var ok = tt_restoreSnapshot(eng);
  eng.pendingAssessment = false; eng._assessment = null; eng.anomalyFlag = false;
  if (ok) tt_emit(eng, "ANOMALY_ASSESSMENT", { outcome: "forced" });
  return ok;
}

// strong-fact monitor (every ORDINARY answer; D1 signal = strong facts collapsing, esp. at
// low forms). "Strong at session start" is read from goodSnapshot (set at the entry).
function tt_anomalyMonitor(eng, d, correct) {
  var m = eng.sessionMon, snap = eng.goodSnapshot;
  if (!m || !snap) return;
  m.answers++;
  if (correct) m.correct++;
  var sf = snap[d.factKey];
  if (!sf || sf.confirmedRung < TT_C.ANOMALY_STRONG_RUNG) return;
  m.strongAsks++;
  if (!correct) m.strongFails++;
}

// §7 step 3c: release time-due third re-asks into the question-clock reask queue, staggered
// (+2, +5, +8 …) so a batch released at entry doesn't arrive back-to-back.
function tt_releaseSpacedReasks(eng, nowTs) {
  var n = 0;
  for (var i = 0; i < eng.spacedReasks.length; i++) {
    var it = eng.spacedReasks[i];
    if (it.dueAtTs > nowTs) continue;
    eng.reaskQueue.push({ key: it.key, dueAtQ: eng.qCount + 2 + n * 3, stage: 3 });
    eng.spacedReasks.splice(i, 1); i--; n++;
  }
}

// end-on-success helper (HOOKS §5): a comfortably-known fact at a comfortable rung
function tt_requestClosingQuestion(eng, sessionCtx, rng) {
  var best = null, bestScore = -1;
  for (var key in eng.facts) {
    var f = eng.facts[key];
    if (!f.seen || f.confirmedRung < 2) continue;
    var acc = tt_factRecentAcc(f);
    var s = f.confirmedRung + (acc === null ? 0.5 : acc) + rng() * 0.5;
    if (eng.qCount - f.lastAskedAtQ < 3) continue;
    if (s > bestScore) { bestScore = s; best = f; }
  }
  if (!best) return null;
  var cr = best.confirmedRung >= 6 ? 6 : Math.max(1, Math.min(best.confirmedRung, 3)); // product form
  var d = tt_describe(eng, best, cr, rng, {});
  d._why = "closing question (end on success)";
  tt_markServed(eng, d, sessionCtx);
  return d;
}

// --- selection (SPEC §5 order) ------------------------------------------------------
function tt_nextQuestion(eng, sessionCtx, rng) {
  var mi = tt_modeInfo(sessionCtx.mode);
  eng._sessionFocusTables = mi.tables;

  // (0) reveal pending — §7 step 1: same fact, product + answer shown WITH the array
  // visual, re-entry required. Presented at the CHILD'S LEVEL (h-user): tiles below
  // keypad, keypad at R6+ — mirrors the error re-ask, so the reveal input matches the
  // rung the child is working at (never a fixed keypad ask on a low-rung fact). The
  // rung field is honest for the log/panel (was hardcoded 6 — read as a false advance).
  if (eng.pendingReveal) {
    var rf = eng.facts[eng.pendingReveal];
    var revRung = rf.confirmedRung >= 6 ? 6 : Math.max(1, Math.min(rf.rung, 3)); // product form at the child's level
    var rd = tt_describe(eng, rf, revRung, rng, { ceremonial: true });
    rd.revealAnswer = true;           // pedagogical signal; the skin owns whether/how to draw the array (h12)
    rd._why = "reveal after wrong answer (§7), rung " + revRung;
    eng.pendingReveal = null;
    eng._awaitingReentry = rf.key;
    tt_markServed(eng, rd, sessionCtx);
    return rd;
  }

  // (0a) active bridge battery continues (§6: singleton, contiguous, pre-empts
  // everything except an in-progress reveal above). All stages ceremonial.
  if (eng.battery) {
    var bf = eng.facts[eng.battery.key];
    var bd = tt_batteryDescriptor(eng, bf, eng.battery, rng);
    tt_markServed(eng, bd, sessionCtx);
    return bd;
  }

  // (0b) placement probes for a fresh profile — SKIPPED when the session is scoped to
  // specific tables (mi.kind === "only": an adult `only` set, or a child daily pick).
  // A restricted session doesn't need cross-table placement. `mainly` still places (it only
  // WEIGHTS selection — see tt_newEngine). The probe is DEFERRED, not destroyed: a later
  // OPEN ("any"/"mainly") session resumes placement if it never completed.
  if (eng.probe && !eng.probe.done && mi.kind !== "only") {
    var pd = tt_probeNext(eng, sessionCtx, rng);
    if (pd) { tt_markServed(eng, pd, sessionCtx); return pd; }
  }

  // (0b') anomaly-recovery assessment (SPEC §5): the prior session read grossly below
  // profile → re-establish the confirmed set at the SNAPSHOT rungs before ordinary play.
  // Supersedes the T11 re-entry sweep for this entry (tt_startSession skips building it).
  if (eng._assessment && !eng._assessment.done) {
    var asd = tt_assessmentNext(eng, sessionCtx, rng);
    if (asd) { tt_markServed(eng, asd, sessionCtx); return asd; }
  }

  // (0c) re-entry probes after a gap (T11, §5): a ceremonial recognition sweep over the
  // most-decayed confirmed facts, served before ordinary selection so returning trust is
  // checked, not assumed. A fail PRIMES the fact (arms T9 demotion for its next ordinary
  // wrong + boosts its weight); the probe itself never moves mastery (inv4/T10).
  if (eng.reentry && !eng.reentry.done) {
    var rpd = tt_reentryNext(eng, sessionCtx, rng);
    if (rpd) { tt_markServed(eng, rpd, sessionCtx); return rpd; }
  }

  // (1) error-flow re-asks due (§7 step 3) — product form near the fact's level
  tt_releaseSpacedReasks(eng, sessionCtx.nowTs);   // step 3c items whose time has come
  for (var i = 0; i < eng.reaskQueue.length; i++) {
    if (eng.reaskQueue[i].dueAtQ <= eng.qCount) {
      var item = eng.reaskQueue.splice(i, 1)[0];
      var ef = eng.facts[item.key];
      var rr = ef.rung >= 6 ? 6 : Math.max(1, Math.min(ef.rung, 3));
      var ed = tt_describe(eng, ef, rr, rng, { errorReask: true });
      ed._reaskStage = item.stage;
      ed._why = "error re-ask stage " + item.stage + " (§7)";
      tt_markServed(eng, ed, sessionCtx);
      return ed;
    }
  }

  // (1b) bridge — a middle-fail retrigger due, else a fresh launch on the
  // highest-priority ×-solid fact (paced by BRIDGE_MIN_GAP_Q; §6). The launch
  // itself is served immediately as the battery's first stage.
  var bl = tt_maybeLaunchBridge(eng, sessionCtx, rng);
  if (bl) { tt_markServed(eng, bl, sessionCtx); return bl; }

  // (2) introduction — when WIP has room, band is healthy, and spacing allows.
  // Effective WIP rises with sustained success (bored release valve) and the
  // intro gap tightens while escalated.
  var acc = tt_rollingAcc(eng);
  var bandHealthy = acc === null || acc >= eng.child.setpoint - 0.05;
  var warm = eng.session && eng.session.warmLeft > 0;
  var effWip = tt_effectiveWip(eng);
  if (effWip > (eng._lastWipEff || eng.child.wipCap)) {
    tt_emit(eng, "CHALLENGE_UP", { wip: effWip, index: Math.round(tt_challengeIndex(eng)) });
  }
  eng._lastWipEff = effWip;
  var introGap = effWip > eng.child.wipCap ? TT_C.BORED_INTRO_GAP : TT_C.INTRO_MIN_GAP_Q;
  if (!warm && bandHealthy && tt_inFluxCount(eng) < effWip
      && eng.qCount - eng.lastIntroQ >= introGap) {
    var nf = tt_nextIntroFact(eng, sessionCtx);
    if (nf) return tt_serveIntro(eng, nf, sessionCtx, rng);
  }

  // (3) weighted pool over seen facts, constraint-filtered
  var pick = tt_weightedPick(eng, sessionCtx, rng, /*relax*/0);
  var relaxUsed = 0;
  if (!pick) { pick = tt_weightedPick(eng, sessionCtx, rng, 1); relaxUsed = 1; }
  if (!pick) { pick = tt_weightedPick(eng, sessionCtx, rng, 2); relaxUsed = 2; }
  if (!pick) { // pool empty (fresh profile / tiny early pool): introduce if WIP allows
    if (tt_inFluxCount(eng) < tt_effectiveWip(eng)) {
      var nf2 = tt_nextIntroFact(eng, sessionCtx);
      if (nf2) return tt_serveIntro(eng, nf2, sessionCtx, rng);
    }
    // emergency: least-recently-asked seen fact, gaps waived (never return null mid-session)
    var lru = null;
    for (var lk in eng.facts) {
      var lf = eng.facts[lk];
      if (!lf.seen) continue;
      if (mi.kind === "only" && !tt_involves(lf, mi.tables)) continue;
      if (!lru || lf.lastAskedAtQ < lru.lastAskedAtQ) lru = lf;
    }
    if (!lru) return null;
    pick = lru;
    var d3 = tt_buildAsk(eng, pick, rng);
    d3._why = "emergency LRU pick (pool empty)";
    tt_markServed(eng, d3, sessionCtx);
    return d3;
  }

  var d2 = tt_buildAsk(eng, pick, rng);
  d2._why = tt_explainPick(eng, pick, sessionCtx, relaxUsed);
  tt_markServed(eng, d2, sessionCtx);
  return d2;
}

// panel-facing: why did the pool choose this fact (SPEC §10 — evidence, not verdict)
function tt_explainPick(eng, f, sessionCtx, relaxUsed) {
  var mi = tt_modeInfo(sessionCtx.mode);
  var now = sessionCtx.nowTs;
  var parts = [];
  parts.push("phase " + tt_phase(eng, f));
  if (f.dueAtTs !== 0 && now >= f.dueAtTs) parts.push("DUE " + ((now - f.dueAtTs) / 3600000).toFixed(1) + "h overdue");
  var acc = tt_factRecentAcc(f);
  if (acc !== null && acc < 1) parts.push("recent acc " + Math.round(acc * 100) + "%");
  if (mi.kind === "mainly" && tt_involves(f, mi.tables)) parts.push("focus×5");
  if (eng.session && eng.session.warmLeft >= 0 && eng.session.asked <= TT_C.SESSION_WARM_QUESTIONS) parts.push("session warm-up");
  if (relaxUsed) parts.push("constraints relaxed L" + relaxUsed);
  return "pool: " + parts.join(", ");
}

function tt_nextIntroFact(eng, sessionCtx) {
  var mi = tt_modeInfo(sessionCtx.mode);
  for (var i = 0; i < eng.introOrder.length; i++) {
    var f = eng.facts[eng.introOrder[i]];
    if (f.seen) continue;
    if (mi.kind !== "any" && !tt_involves(f, mi.tables)) continue; // focus intros stay on focus
    return f;
  }
  if (mi.kind === "mainly") { // focus fully introduced: fall back to global order
    for (var j = 0; j < eng.introOrder.length; j++)
      if (!eng.facts[eng.introOrder[j]].seen) return eng.facts[eng.introOrder[j]];
  }
  return null;
}

// R0 introduction: shown WITH answer + visual, child reproduces (ceremonial).
// rung moves 0→1 AT SERVE (introduction machinery, not answer evidence).
function tt_serveIntro(eng, f, sessionCtx, rng) {
  f.seen = true; f.inFlux = true; f.rung = 1;
  eng.lastIntroQ = eng.qCount;
  var d = tt_describe(eng, f, 0, rng, { ceremonial: true, intro: true });
  d.revealAnswer = true;
  d.scaffold = { options: null, ordered: false };
  d.presented = { left: f.a, op: "×", right: f.b, missingSlot: "result" };
  d.correctAnswer = f.a * f.b;
  d._why = "introduction (next in table order)";
  tt_emit(eng, "FACT_INTRODUCED", { factKey: f.key });
  tt_markServed(eng, d, sessionCtx);
  return d;
}

// constraint layer (SPEC §5): hard zero within gaps; relax progressively if pool empties
function tt_constraintOK(eng, f, relax) {
  var prod = f.a * f.b;
  var sameFactGap = relax >= 2 ? 2 : TT_C.SAME_FACT_GAP;
  if (eng.qCount - f.lastAskedAtQ < sameFactGap) return false;
  for (var i = eng.recentServed.length - 1; i >= 0; i--) {
    var r = eng.recentServed[i], gap = eng.qCount - r.q;
    if (gap >= TT_C.SAME_PRODUCT_GAP) break;
    if (relax < 1 && r.product === prod && r.key !== f.key) return false;
    if (relax < 1 && gap < TT_C.NEIGHBOUR_GAP && tt_isNeighbour(eng.facts[r.key], f)) return false;
  }
  return true;
}
function tt_isNeighbour(f1, f2) {
  if (!f1 || f1.key === f2.key) return false;
  // share a factor, other factor adjacent (6×7 vs 6×8)
  var pairs = [[f1.a, f1.b, f2.a, f2.b], [f1.a, f1.b, f2.b, f2.a]];
  for (var i = 0; i < pairs.length; i++) {
    var p = pairs[i];
    if (p[0] === p[2] && Math.abs(p[1] - p[3]) === 1) return true;
    if (p[1] === p[3] && Math.abs(p[0] - p[2]) === 1) return true;
  }
  return false;
}

function tt_weightedPick(eng, sessionCtx, rng, relax) {
  var mi = tt_modeInfo(sessionCtx.mode);
  var warm = eng.session && eng.session.warmLeft > 0;
  var pool = [], total = 0;
  for (var key in eng.facts) {
    var f = eng.facts[key];
    if (!f.seen) continue;
    if (mi.kind === "only" && !tt_involves(f, mi.tables)) continue;
    if (!tt_constraintOK(eng, f, relax)) continue;
    if (warm && relax === 0) { // open on comfortably-known facts; null acc = seeded-known
      var wacc = tt_factRecentAcc(f);
      if (f.confirmedRung < 2 || (wacc !== null && wacc < 0.7)) continue;
    }
    var w = tt_weight(eng, f, sessionCtx, mi);
    if (w > 0) { pool.push({ f: f, w: w }); total += w; }
  }
  if (pool.length === 0) return null;
  var r = rng() * total;
  for (var i = 0; i < pool.length; i++) { r -= pool[i].w; if (r <= 0) return pool[i].f; }
  return pool[pool.length - 1].f;
}

// multiplicative weight (SPEC §5; v8: v8_computeWeight)
function tt_weight(eng, f, sessionCtx, mi) {
  var now = sessionCtx.nowTs;
  var due = f.dueAtTs === 0 ? 1.0 : (now >= f.dueAtTs ? Math.min(4, 1 + (now - f.dueAtTs) / Math.max(1, tt_interval(eng, f))) : 0.3);
  var ph = tt_phase(eng, f);
  var phase = ph === "acquiring" ? 3 : ph === "consolidating" ? 1.5 : 0.5;
  // a fact at/through the bridge boundary is a live frontier, not resting retention:
  // it just confirmed a rung but its next form (÷) is unlearned, and a ×-topped/held
  // fact has a long interval (low due-ness). Lift it, or the bridge never gets turns
  // and division starves (§6).
  if ((f.bridge === "open" && f.confirmedRung < tt_maxUnlocked(f)) || tt_bridgeEligible(eng, f)) {
    due = Math.max(due, 1.5); phase = 3;
  }
  var facc = tt_factRecentAcc(f);
  var accF = facc === null ? 1.2 : 1 + (1 - facc);
  var since = eng.qCount - f.lastAskedAtQ;
  var rec = Math.min(1, 0.4 + since * 0.05);
  var modeF = (mi && mi.kind === "mainly") ? (tt_involves(f, mi.tables) ? 5 : 1) : 1;
  var w = due * phase * accF * rec * modeF;
  // T11: a fact primed by a failed re-entry probe is lifted so its ordinary re-ask
  // lands this session — where its next wrong demotes (T9) or a correct starts clearing.
  if (f.reentryPrimed) w *= TT_C.REENTRY_WEIGHT_BOOST;
  return w;
}

// rung for an ordinary ask (SPEC §2/§5): frontier by default; band-low steps down
// one unlocked rung; retention rotation once keypad-product is confirmed rotates
// BOTH keypad × forms (R6/R7) plus ÷ keypad (R8) once the bridge is open and the
// ÷ rung confirmed. Division rungs (R5/R8) are reachable here only when bridged.
function tt_buildAsk(eng, f, rng) {
  // R3.5 seed-verify (h-user): a placement-aced fact proves × once, UNSCAFFOLDED (the R6
  // product form: keypad, no options), before it earns R4 and the ÷ bridge. tt_recordAnswer
  // routes the answer: one correct → R4 (provisional), a wrong → back to the R1 × ladder.
  if (f.seedVerify) return tt_describe(eng, f, 6, rng, { seedVerify: true });
  var acc = tt_rollingAcc(eng);
  var askRung = Math.min(f.rung, tt_maxUnlocked(f));
  if (tt_rungLocked(f, askRung)) askRung = tt_prevUnlocked(f, askRung);
  if (acc !== null && acc < eng.child.setpoint - TT_C.BAND_TOL) askRung = tt_prevUnlocked(f, askRung);
  // T6 maintenance rotation (h-user): once the working rung reaches R5 (division /
  // missing-factor territory), interleave lower-rung retention asks so earned forms
  // stay exercised while the frontier climbs — a frontier-driller becomes a teacher
  // that revisits. 3/5 frontier, 1/5 one rung lower, 1/5 two rungs lower (60/20/20 —
  // eased down from 1/2 because 50% starved top-end confirmation, h-user). Unlocked-
  // stepping skips bridge-locked ÷ rungs, so e.g. R7→{R6,R5}, R8→{R7,R6}, and an
  // unbridged seeded fact at R6 falls back to {R4,R3}. Below R5, pure frontier.
  // Maintenance asks are ordinary evidence (curvePtr refresh; a single lower-rung
  // wrong only reinforces, consecutive wrongs still disturb — see tt_recordAnswer).
  var maint = false;
  if (askRung >= 5) {
    var r = rng();
    if (r >= 0.6) {
      var one = tt_prevUnlocked(f, askRung);
      askRung = r < 0.8 ? one : tt_prevUnlocked(f, one);
      maint = askRung < f.rung;   // flag only a genuine step below the frontier
    }
  }
  return tt_describe(eng, f, askRung, rng, maint ? { maintenance: true } : {});
}

function tt_markServed(eng, d, sessionCtx) {
  eng.qCount++;
  d._servedAtQ = eng.qCount;
  d._servedTs = sessionCtx.nowTs;
  var f = eng.facts[d.factKey];
  if (f) {
    f.lastAskedAtQ = eng.qCount;
    eng.recentServed.push({ key: d.factKey, product: f.a * f.b, q: eng.qCount });
    if (eng.recentServed.length > 30) eng.recentServed.shift();
  }
  if (eng.session) {
    eng.session.asked++;
    if (eng.session.warmLeft > 0 && !d.flags.probe && !d.flags.batteryKind && !d.flags.reentry && !d.flags.assessment) eng.session.warmLeft--;
    if (f) { eng.session.tablesTouched[f.a] = true; eng.session.tablesTouched[f.b] = true; }
  }
}

// --- bridge (× → ÷), SPEC §6 -----------------------------------------------------
// The transport across the form ladder. The two division rungs (R5 tiles, R8
// keypad) are gated per-fact: a fact must cross the bridge before it can be
// promoted ONTO a division rung. A normal climber meets the gate at R4→R5
// (division right after missing-factor — the ×/÷ link exploited while fresh); a
// fact placement-seeded past the tile rungs meets it at R7→R8. The gate is a
// contiguous ceremonial battery (a ÷ answered seconds after producing both
// factors is not independent retrieval); once open, division climbs the ordinary
// ladder and R5-tiles→R8-keypad IS the post-gate scaffold fade.

// eligible = confirmed at a rung whose NEXT rung is a division rung this fact
// hasn't unlocked (i.e. sitting at the R4→R5 or R7→R8 boundary).
function tt_bridgeEligible(eng, f) {
  if (!f.seen || f.bridge === "open" || f.bridgeNeedReconfirm) return false;
  var nextR = f.confirmedRung + 1;
  if (nextR > 8 || !TT_RUNGS[nextR].div) return false;
  if (f.curvePtr < TT_C.BRIDGE_MIN_PTR) return false;
  return true;
}

// adaptive fade (h-user): gate ceremony shrinks with demonstrated ÷ transfer.
// 5 = full battery, 3 = short battery, 0 = auto-open (no ceremony; ÷ still earned
// on the R5/R8 climb). Returns the stage count for THIS child right now.
function tt_bridgeGateSize(eng) {
  var p = eng.child.bridgeCleanPasses || 0;
  return p < TT_C.BRIDGE_FADE_TO_3 ? 5 : p < TT_C.BRIDGE_FADE_TO_AUTO ? 3 : 0;
}

// open division for a fact and promote it onto the division rung it was held at.
function tt_openBridge(eng, f) {
  f.bridge = "open";
  f.bridgeNeedReconfirm = false; f.lastBridgeFailStage = null;
  var fromR = f.rung;
  if (fromR + 1 <= 8 && TT_RUNGS[fromR + 1].div) {   // step onto the now-unlocked ÷ rung
    f.rung = fromR + 1; f.rungHits = 0; f.rungProvisional = false;
    tt_emit(eng, "FACT_PROMOTED", { factKey: f.key, fromRung: fromR, toRung: f.rung, provisional: true });
  }
  tt_emit(eng, "BRIDGE_OPENED", { factKey: f.key });
  if (eng.session) { eng.session.factsImproved[f.key] = true; eng.session.bridgesOpened[f.key] = true; }
}

// serve a bridge battery: middle-fail retrigger first (same fact, continuation),
// else a fresh launch on the readiest eligible fact once BRIDGE_MIN_GAP_Q questions
// have passed since the last battery ended (§6; h16 — pacing replaced the per-arc
// cap that queued facts at R4→R5). An auto-open (faded gate) opens the bridge and
// returns null — the ordinary climb then serves the ÷ rung next tick.
function tt_maybeLaunchBridge(eng, sessionCtx, rng) {
  if (eng.battery) return null;
  if (eng.session && eng.session.warmLeft > 0) return null;   // not during warm-up
  var mi = tt_modeInfo(sessionCtx.mode);

  // (a) middle-fail retrigger due — relaunch the same fact (a continuation, not a
  // fresh launch: exempt from pacing)
  for (var i = 0; i < eng.bridgeReask.length; i++) {
    if (eng.bridgeReask[i].dueAtQ <= eng.qCount) {
      var item = eng.bridgeReask.splice(i, 1)[0];
      var rf = eng.facts[item.key];
      if (rf && rf.bridge !== "open" && !rf.bridgeNeedReconfirm) return tt_launchGate(eng, rf, rng);
      i--; // spliced — recheck this index
    }
  }

  // (b) fresh launch, paced: pick the readiest eligible fact
  if (eng.qCount - eng.lastBatteryEndQ < TT_C.BRIDGE_MIN_GAP_Q) return null;
  var best = null, bestScore = -1;
  for (var key in eng.facts) {
    var f = eng.facts[key];
    if (!tt_bridgeEligible(eng, f)) continue;
    if (mi.kind === "only" && !tt_involves(f, mi.tables)) continue;
    if (eng.qCount - (f.bridgeLastFailQ == null ? -999 : f.bridgeLastFailQ) < TT_C.BRIDGE_FAIL_COOLDOWN_Q) continue;
    // priority: bridgePending (relaunch owed) > unbridged; then most-retained, earliest
    var s = (f.bridge === "pending" ? 100 : 0) + f.curvePtr * 2 - f.introIdx * 0.001;
    if (s > bestScore) { bestScore = s; best = f; }
  }
  if (!best) return null;
  return tt_launchGate(eng, best, rng);
}

// launch the gate for a fact at the current fade level: full/short battery, or
// auto-open. Battery launches return the first stage; auto-open returns null.
function tt_launchGate(eng, f, rng) {
  var gate = tt_bridgeGateSize(eng);
  if (gate === 0) { tt_openBridge(eng, f); return null; }     // faded to auto-open
  var kind = gate === 5 ? "bridge5" : "bridge3";
  eng.battery = { key: f.key, kind: kind, stage: 0, flip: f.bridgeDivFlip, clean: true };
  tt_emit(eng, "BRIDGE_STARTED", { factKey: f.key, kind: kind });
  var d = tt_batteryDescriptor(eng, f, eng.battery, rng);
  d._why = "bridge battery " + kind + " stage 1 (§6, ceremonial)";
  return d;
}

// build the ceremonial descriptor for the current battery stage. Each stage
// primes the next — the priming IS the scaffold, hence ceremonial.
//   bridge5 (full gate):  a×b → b×a → a×?=p → ?×b=p → (p÷a | p÷b, coin-flip alternates)
//   bridge3 (short gate):  b×a → a×?=p → p÷a   (product one order, mf the other)
function tt_batteryDescriptor(eng, f, bat, rng) {
  var p = f.a * f.b, stage = bat.stage;
  var d = {
    factKey: f.key, a: f.a, b: f.b, form: "product", rung: 6,
    scaffold: { options: null, ordered: false },
    flags: { ceremonial: true, probe: false, batteryKind: bat.kind, batteryStage: stage, errorReask: false, intro: false },
    correctAnswer: p,
  };
  function prod(left, right) { d.form = "product"; d.rung = 6; d.presented = { left: left, op: "×", right: right, missingSlot: "result" }; d.correctAnswer = p; }
  function mf(shown, slot) { d.form = "missingFactor"; d.rung = 7; d.presented = { left: shown, op: "×", right: p, missingSlot: slot }; d.correctAnswer = p / shown; }
  function div(divisor) {
    d.form = "division"; d.rung = 5;
    d.presented = { left: p, op: "÷", right: divisor, missingSlot: "result" };
    d.correctAnswer = p / divisor;
    var fo = []; for (var k = 1; k <= eng.config.tablesUpTo; k++) fo.push(k);
    d.scaffold = { options: fo, ordered: true };
  }
  if (bat.kind === "bridge5") {
    if (stage === 0) prod(f.a, f.b);
    else if (stage === 1) prod(f.b, f.a);
    else if (stage === 2) mf(f.a, "factor2");        // a×?=p, answer b
    else if (stage === 3) mf(f.b, "factor1");        // ?×b=p, answer a
    else div(bat.flip ? f.a : f.b);                  // p÷a | p÷b
  } else { // bridge3 short gate
    if (stage === 0) prod(f.b, f.a);
    else if (stage === 1) mf(f.a, "factor2");        // a×?=p, answer b
    else div(f.a);                                   // p÷a
  }
  return d;
}

// record a battery answer (ceremonial). Advance on correct; passing the last
// stage opens the bridge. A slow stage marks the pass non-clean (holds the fade).
// On wrong, run the error flow on the failed stage then ABORT, routing by stage (§6).
function tt_batteryRecord(eng, d, correct, rtMs, nowTs) {
  var f = eng.facts[d.factKey], bat = eng.battery;
  if (!bat) return;
  var kind = bat.kind, stage = bat.stage, last = kind === "bridge5" ? 4 : 2;
  if (rtMs > tt_fastBar(eng, d.rung)) bat.clean = false;

  if (correct) {
    if (stage < last) { eng.battery.stage++; return; }
    var clean = bat.clean;
    eng.battery = null;                              // battery complete
    eng.lastBatteryEndQ = eng.qCount;                // pacing clock (BRIDGE_MIN_GAP_Q)
    f.bridgeDivFlip = !f.bridgeDivFlip;              // alternate ÷ divisor next time
    if (clean) eng.child.bridgeCleanPasses = (eng.child.bridgeCleanPasses || 0) + 1;  // adaptive fade
    tt_openBridge(eng, f);                           // passing the gate opens division
    return;
  }

  // wrong: reveal + re-entry (error flow), then abort the battery (§6)
  eng.pendingReveal = f.key;
  eng.battery = null;
  eng.lastBatteryEndQ = eng.qCount;
  f.lastBridgeFailStage = stage;
  tt_emit(eng, "BRIDGE_FAILED", { factKey: f.key, kind: kind, stage: stage });
  // route by which stage FORM failed (product/mf/division), independent of gate size
  var failForm = d.form;
  var lastFailQ = f.bridgeLastFailQ == null ? -999 : f.bridgeLastFailQ;
  var recentFail = eng.qCount - lastFailQ < TT_C.BRIDGE_FAIL_COOLDOWN_Q;   // failed already, recently
  f.bridgeLastFailQ = eng.qCount;                     // starts this fact's fresh-launch cooldown
  if (failForm === "product") {                       // early: no re-bridge until × re-confirms
    f.bridgeNeedReconfirm = true;
  } else if (failForm === "missingFactor") {          // middle: retrigger, unless it just failed recently
    if (!recentFail) {
      var span = TT_C.BRIDGE_RETRIGGER_MAX - TT_C.BRIDGE_RETRIGGER_MIN + 1;
      var off = TT_C.BRIDGE_RETRIGGER_MIN + Math.floor((rtMs % 997) / 997 * span);
      eng.bridgeReask.push({ key: f.key, dueAtQ: eng.qCount + off });
    } else {
      f.bridge = "pending";                          // 2nd middle fail in the window → move on (mf already rotates)
    }
  } else {                                            // division (late): bridgePending, relaunch when next selected
    f.bridge = "pending";
  }
}

// --- recordAnswer (HOOKS §1) ---------------------------------------------------------
// nowTs is reconstructed from the served descriptor + latency (engine reads no clock).
// The core has many early returns; the wrapper notes the achievement tier once, after
// whichever path ran (h16 best-ever tracking).
function tt_recordAnswer(eng, d, correct, rtMs, age) {
  tt_recordAnswerCore(eng, d, correct, rtMs, age);
  var f = eng.facts[d.factKey];
  if (f) tt_noteAchievement(eng, f);
}
function tt_recordAnswerCore(eng, d, correct, rtMs, age) {
  correct = !!correct;
  var nowTs = (d._servedTs || 0) + (rtMs || 0);
  eng.lastAnswerTs = nowTs;
  if (age) eng.config.age = age;
  var f = eng.facts[d.factKey];

  // effort gauge: every correct counts, ceremonial included (HOOKS §3)
  if (correct) eng.score++;
  if (eng.session &&correct) eng.session.correct++;

  if (f) {
    f.attempts.push({ ts: nowTs, rung: d.rung, form: d.form, latencyMs: rtMs, correct: correct, ceremonial: !!d.flags.ceremonial, q: d._servedAtQ });
    if (f.attempts.length > TT_C.ATTEMPTS_CAP) f.attempts.shift();
  }

  // ceremonial paths — never ordinary evidence (SPEC §5; SCENARIOS invariant 4)
  if (d.flags.batteryKind) { tt_batteryRecord(eng, d, correct, rtMs, nowTs); return; }
  if (d.flags.probe) { tt_probeRecord(eng, d, correct); return; }
  if (d.flags.reentry) { tt_reentryRecord(eng, d, correct); return; }   // T11: fail primes, pass no-ops
  if (d.flags.assessment) { tt_assessmentRecord(eng, d, correct); return; }  // anomaly gate: tally, resolve on the last
  if (d.flags.intro) return;                       // rung already moved at serve
  if (d.flags.seedVerify) {
    // R3.5 (h-user): one unscaffolded × proof gates a placement-aced fact onto R4.
    // Confirmation stays PROVISIONAL (confirmedRung untouched — earned by play, T10):
    // passing only sets the WORKING rung to R4 so the R4→R5 bridge gives early ÷.
    f.seedVerify = false; f.rungHits = 0; f.rungProvisional = false;
    if (correct) {
      f.rung = 4;                                  // → R4 mf tiles; bridge fires at R4→R5
      tt_emit(eng, "SEED_VERIFIED", { factKey: f.key, toRung: 4 });
    } else {
      f.rung = 1;                                  // placement over-estimated × → full scaffolded ladder
      tt_emit(eng, "SEED_REJECTED", { factKey: f.key, toRung: 1 });
      eng.pendingReveal = f.key;                   // §7 reveal, then re-teach from R1
    }
    return;
  }
  if (d.revealAnswer && eng._awaitingReentry === d.factKey) {
    // §7 step 2 re-entry: on correct, schedule the +3..5 re-ask
    if (correct) {
      eng._awaitingReentry = null;
      var off = TT_C.ERROR_REASK_MIN + Math.floor((rtMs % 997) / 997 * (TT_C.ERROR_REASK_MAX - TT_C.ERROR_REASK_MIN + 1));
      eng.reaskQueue.push({ key: d.factKey, dueAtQ: eng.qCount + off, stage: 1 });
    }
    return;
  }
  if (d.flags.errorReask) {
    // partial-ceremonial (§7): correct → recovery, no promotion/ptr; wrong → full lapse
    if (correct) {
      tt_emit(eng, "LAPSE_RECOVERED", { factKey: d.factKey });
      if (d._reaskStage === 1) {
        eng.reaskQueue.push({ key: d.factKey, dueAtQ: eng.qCount + TT_C.ERROR_REASK2_MIN, stage: 2 });
      } else if (d._reaskStage === 2 && !eng.spacedReasks.some(function (s) { return s.key === d.factKey; })) {
        // §7 step 3c: a spaced third re-ask. Stage 3 ends the chain (h16 — the old
        // "next session" items re-entered as stage 1 and so cycled forever).
        eng.spacedReasks.push({ key: d.factKey, dueAtTs: nowTs + TT_C.ERROR_REASK3_GAP_MS });
      }
    } else {
      tt_lapse(eng, f, nowTs);
    }
    if (eng.session) eng.session.lastWasLapse = !correct;
    return;
  }

  // --- ordinary evidence path ---
  if (f && f.reentryPrimed) f.reentryPrimed = false;   // T11: the primed re-ask has landed → drop the weight boost
  tt_anomalyMonitor(eng, d, correct);                  // anomaly gate: watch strong facts for whole-session collapse
  eng.rolling.push(correct);
  if (eng.rolling.length > TT_C.ROLLING_WINDOW) eng.rolling.shift();
  eng.compWindow.push(tt_answerCompScore(eng, d, correct, rtMs));
  if (eng.compWindow.length > TT_C.COMP_WINDOW) eng.compWindow.shift();
  if (eng.session) eng.session.lastWasLapse = !correct;

  if (correct) {
    f.wrongStreak = 0;
    // early-bridge-fail cooldown lifts once × is demonstrably back (clean product)
    if (f.bridgeNeedReconfirm && d.form === "product" && rtMs <= tt_fastBar(eng, d.rung)) f.bridgeNeedReconfirm = false;
    eng.correctStreak = (eng.correctStreak || 0) + 1;
    var fast = rtMs <= tt_fastBar(eng, d.rung);                  // ≤ fast-bar = FLUENT (T13; speed axis only)
    var spaced = f.dueAtTs === 0 || nowTs >= f.dueAtTs;

    // retention: genuine spaced success advances the pointer (§3). Never faster
    // than real time — within-session repeats are not spaced.
    if (spaced && f.lastSuccessTs !== 0) f.curvePtr = Math.min(f.curvePtr + 1, TT_C.RETENTION_CURVE_DAYS.length - 1);
    f.lastSuccessTs = nowTs;
    f.dueAtTs = nowTs + tt_interval(eng, f);
    if (f.reinforceLeft > 0) f.reinforceLeft -= 1;               // any correct rebuilds, incl. a T6 maintenance ask

    // --- rung trial machine (h-user): provisional → confirm-after-N → promote,
    //     with a post-error reinforcement lockout. Fires only AT the working rung.
    //     Rung (form mastery) and curvePtr (retention) are independent axes: a rung
    //     confirms in-session, but "mastered" phase still needs curvePtr (tt_phase).
    if (d.rung === f.rung) {
      {   // h6 (h-user): promotion/confirmation on ACCURACY ALONE — the enclosing `correct` branch is the
        // only gate; speed is a SEPARATE axis (fluency, below). Gating promotion on speed is a LEARNING
        // DEAD-END for a reliable-but-slow deriver: unpromoted → never asked the next rung → never practises
        // it → cannot learn. Completes T13's loosening (fast → 2.5× → accuracy); CONFIRM_BAR retired.
        // commutativity §2: record which product order was confirmed at R6 (the × gate).
        if (d.rung === 6 && d.form === "product") f.r6Orders[(d.presented.left === f.a) ? "ab" : "ba"] = true;
        f.rungHits = (f.rungHits || 0) + 1;
        if (f.rungHits === 1 && f.rung > f.confirmedRung && !f.rungProvisional) {
          f.rungProvisional = true;
          tt_emit(eng, "RUNG_PROVISIONAL", { factKey: f.key, rung: f.rung });
        }
        // h6 (h-user, Issue 2a): a placement-SEEDED rung confirms on ONE clean in-play hit — colours the
        // grid ("now I rightfully belong to R5, promoted from provisional") so an ace seeded across ~55
        // facts sees earned progress. CRUCIAL (h-user): confirming a PLACED rung does NOT promote PAST it —
        // it confirms IN PLACE, then must earn further climbing normally ("wait there until it's proven").
        var wasPlaced = f.placed;
        var need = wasPlaced ? 1 : tt_promoteHits(f.rung);
        if (f.rungHits >= need && f.reinforceLeft === 0) {
          f.placed = false;
          // confirm the current rung (form mastery → grid truth)
          if (f.rung > f.confirmedRung) {
            f.confirmedRung = f.rung;
            tt_emit(eng, "FACT_CONFIRMED", { factKey: f.key, rung: f.confirmedRung });
            tt_tableProgressEvents(eng, f);
            if (eng.session) eng.session.factsImproved[f.key] = true;
            if (f.inFlux && f.confirmedRung >= 2) { f.inFlux = false; tt_updateLearningRate(eng, f); }
          }
          if (wasPlaced) {
            // confirm-IN-PLACE: coloured at the seeded rung, NOT promoted past it. Reset hits so the next
            // promotion earns the normal PROMOTE_HITS at this rung (it waits there until it's proven).
            f.rungHits = 0; f.rungProvisional = false;
          } else {
            // trial the next rung (linear ladder, contiguous). If the next rung is a
            // division rung this fact hasn't unlocked, HOLD here — the fact is now
            // bridge-eligible and the scheduler launches the gate (§6); do not skip ÷.
            var nextR = f.rung + 1;
            if (nextR <= 8 && TT_RUNGS[nextR].div && f.bridge !== "open") {
              f.rungHits = need; // clamp at the bridge boundary until division opens
            } else if (f.rung === 6 && !tt_bothOrders(f)) {
              f.rungHits = need; // commutativity §2: hold at R6 until BOTH product orders confirmed (× gate)
            } else if (nextR <= 8) {
              var fromR = f.rung;
              f.rung = nextR;
              f.rungHits = 0; f.rungProvisional = false;
              tt_emit(eng, "FACT_PROMOTED", { factKey: f.key, fromRung: fromR, toRung: f.rung, provisional: true });
              if (eng.session) eng.session.factsImproved[f.key] = true;
            } else {
              f.rungHits = need; // clamp at top rung R8 — nothing left to trial
            }
          }
        }
      }
    }
    // T13 fluency axis (h-user): SPEED is tracked separately from competence. A ≤ fast-bar clean
    // retrieval at an already-CONFIRMED rung marks that rung FLUENT (fluentRung ≤ confirmedRung).
    // Fluency can land WITH the confirm (child already fast) or later via T6 maintenance practice;
    // "mastered" needs fluency at the top rung (tt_phase). Child-visible positive progress ("getting
    // speedy on your 2s"). Not fluency for reinforcement re-asks (lockout) — must be clean.
    if (fast && f.reinforceLeft === 0 && d.rung <= f.confirmedRung && d.rung > (f.fluentRung || 0)) {
      f.fluentRung = d.rung;
      tt_emit(eng, "FACT_FLUENT", { factKey: f.key, rung: d.rung });
      if (eng.session) eng.session.factsImproved[f.key] = true;
    }
    // commutativity §2: record which ÷ direction was retrieved FLUENTLY at R8 (the ÷ mastery gate).
    if (fast && f.reinforceLeft === 0 && d.form === "division" && d.rung === 8 && f.confirmedRung >= 8)
      f.r8Dirs[(d.presented.right === f.a) ? "a" : "b"] = true;
    // FACT_MASTERED on the phase transition (÷ keypad R8 confirmed + retention + FLUENT).
    // Fires once; the transition may land at R8-confirm or a later spaced success.
    if (!f.masteredEmitted && tt_phase(eng, f) === "mastered") {
      f.masteredEmitted = true;
      tt_emit(eng, "FACT_MASTERED", { factKey: f.key });
    }
  } else {
    // error (§7) — routed by whether it landed on the frontier or a T6 lower-rung ask.
    f.rungHits = 0; f.rungProvisional = false;
    f.placed = false;   // h6: a wrong answer makes the placement estimate suspect → re-earn the rung normally
    if (d.flags.maintenance && d.rung < f.rung) {
      // T6 (h-user): an error on a LOWER-rung maintenance ask is ordinary evidence but
      // must not crash the fact on a single slip. Reinforce at the asked rung and lapse;
      // only CONSECUTIVE wrongs with no intervening ordinary correct (wrongStreak ≥ 2 —
      // a reveal/re-ask recovery is not an ordinary correct, so it does not reset the
      // streak) disturb the fact: step the frontier down one rung + de-confirm, exactly
      // as a frontier reinforcement failure would (T9).
      var disturb = (f.wrongStreak + 1) >= 2 && f.rung > 1;
      if (disturb) {
        var fromRm = f.rung, newRm = tt_prevUnlocked(f, f.rung);
        f.rung = newRm;
        if (f.confirmedRung >= newRm) f.confirmedRung = tt_prevUnlocked(f, newRm); // → provisional
        if ((f.fluentRung || 0) > f.confirmedRung) f.fluentRung = f.confirmedRung;  // T13: fluency ≤ confirmed
        f.reinforceLeft = 0;
        f.masteredEmitted = false;
        tt_resetGatesOnDemote(f);
        tt_emit(eng, "FACT_DEMOTED", { factKey: f.key, fromRung: fromRm, toRung: newRm });
      } else {
        f.reinforceLeft = tt_reinforceAfterError(d.rung);   // reinforce the asked (lower) form
        tt_emit(eng, "RUNG_REINFORCE", { factKey: f.key, rung: d.rung, n: f.reinforceLeft });
      }
      tt_lapse(eng, f, nowTs, disturb);
    } else {
      // frontier error (§7). First error at a rung ARMS reinforcement. T9 (h-user): if the
      // child errs AGAIN while that reinforcement is still pending (reinforceLeft > 0), the
      // rung was overestimated — step DOWN one unlocked rung for consolidation and drop to
      // PROVISIONAL (confirmedRung strictly below the new working rung).
      var reinfFailed = f.reinforceLeft > 0;
      if (reinfFailed && f.rung > 1) {
        var fromR = f.rung;
        var newRung = tt_prevUnlocked(f, f.rung);
        f.rung = newRung;
        if (f.confirmedRung >= newRung) f.confirmedRung = tt_prevUnlocked(f, newRung); // → provisional
        if ((f.fluentRung || 0) > f.confirmedRung) f.fluentRung = f.confirmedRung;  // T13: fluency ≤ confirmed
        f.reinforceLeft = 0;   // fresh start at the easier rung (the demotion IS the response)
        f.masteredEmitted = false;   // fell out of mastery — a later re-climb re-emits FACT_MASTERED
        tt_resetGatesOnDemote(f);
        tt_emit(eng, "FACT_DEMOTED", { factKey: f.key, fromRung: fromR, toRung: newRung });
      } else {
        f.reinforceLeft = tt_reinforceAfterError(f.rung);
        tt_emit(eng, "RUNG_REINFORCE", { factKey: f.key, rung: f.rung, n: f.reinforceLeft });
      }
      tt_lapse(eng, f, nowTs, reinfFailed);
    }
    eng.pendingReveal = f.key;   // §7 step 1 — next question is the reveal
  }
}

// retention/streak regression on a wrong (rung changes are handled by the caller —
// T9 demotion in the error branch; re-ask lapses never move the rung). `hard` = a
// demotion-grade lapse resets the retention pointer, an ordinary lapse steps it back.
function tt_lapse(eng, f, nowTs, hard) {
  eng.correctStreak = 0;   // closes the bored release valve
  f.wrongStreak++;
  f.curvePtr = hard ? 0 : Math.max(0, f.curvePtr - TT_C.LAPSE_STEPBACK);
  f.dueAtTs = nowTs; // immediately due — it's in the error loop
}

function tt_updateLearningRate(eng, f) {
  var n = 0;
  for (var i = 0; i < f.attempts.length; i++) if (!f.attempts[i].ceremonial) n++;
  var lr = eng.child.learningRate;
  eng.child.learningRate = lr === null ? n : lr * 0.7 + n * 0.3; // EMA, attempts-to-settle
}

function tt_tableProgressEvents(eng, f) {
  var tables = f.a === f.b ? [f.a] : [f.a, f.b];
  for (var i = 0; i < tables.length; i++) {
    var p = tt_getTableProgress(eng, tables[i]);
    tt_emit(eng, "TABLE_ROW_PROGRESS", { table: tables[i], mastered: p.mastered, total: p.total });
    if (p.mastered === p.total) tt_emit(eng, "TABLE_COMPLETED", { table: tables[i] });
  }
}

// --- read-only queries (HOOKS §3) -----------------------------------------------------
function tt_getMasteryGrid(eng) {
  var out = {};
  for (var key in eng.facts) {
    var f = eng.facts[key];
    out[key] = { a: f.a, b: f.b, rung: f.rung, confirmedRung: f.confirmedRung, phase: tt_phase(eng, f), provisional: f.rung > f.confirmedRung,
      // T13: fluency (speed) axis — child-visible positive progress, distinct from competence.
      fluentRung: f.fluentRung || 0, fluent: (f.fluentRung || 0) >= f.confirmedRung && f.confirmedRung > 0 };
  }
  return out;
}
// Read-only per-fact SCHEDULING state (architecture Qc, resolved h13). The mastery
// grid answers "how well is this known"; a non-drill game (Game 1 Pairs) needs the
// SELECTION signals too — what is in flight, newly introduced, being rebuilt after an
// error, or overdue — without reaching into eng.facts (D2). Returns fresh copies.
function tt_getFactStates(eng) {
  var out = [];
  for (var key in eng.facts) {
    var f = eng.facts[key];
    out.push({
      key: f.key, a: f.a, b: f.b, introIdx: f.introIdx,
      seen: f.seen, inFlux: f.inFlux, phase: tt_phase(eng, f),
      rung: f.rung, confirmedRung: f.confirmedRung, fluentRung: f.fluentRung || 0,
      reinforceLeft: f.reinforceLeft, dueAtTs: f.dueAtTs, bridge: f.bridge,
      lastAskedAtQ: f.lastAskedAtQ,
    });
  }
  return out;
}
// Descriptor for a fact BY KEY at an explicitly chosen rung — the entry point for a
// non-drill game that presents a fact in the form the CHILD chose rather than the one
// the ladder would serve next. Null for an unknown key. It only BUILDS the ask (so a
// card can never be shaped in a way the engine wouldn't produce); whether the answer
// counts as evidence is the caller's gate (tables_game1_pairs_design.md §2.1).
function tt_describeFactKey(eng, factKey, rung, rng, flags) {
  var f = eng.facts[factKey];
  return f ? tt_describe(eng, f, rung, rng, flags) : null;
}
function tt_getTableProgress(eng, table) {
  var mastered = 0, learning = 0, unseen = 0, total = 0, fluent = 0;
  for (var key in eng.facts) {
    var f = eng.facts[key];
    if (f.a !== table && f.b !== table) continue;
    total++;
    var ph = tt_phase(eng, f);
    if (ph === "mastered") mastered++;
    else if (ph === "unseen") unseen++;
    else learning++;
    // T13: fluency count drives child-visible "getting speedy on your Xs" (speed, not competence)
    if ((f.fluentRung || 0) >= f.confirmedRung && f.confirmedRung > 0) fluent++;
  }
  return { mastered: mastered, learning: learning, unseen: unseen, total: total, fluent: fluent };
}
function tt_getScore(eng) { return eng.score; }

// --- achievement tiers (h16, Kath scheme 2) ----------------------------------------------
// One monotonic symbol per fact for the adult card + child map, mirroring the reef's
// achievements card. Tier = the stage the child is PRACTISING, read from the EARNED rung
// (confirmedRung), so the ladder's form repeats (×/?/÷ on tiles, then again on keypad)
// never show as a regression:
//   0 ·  not started          !seen
//   1 ×  practising ×          confirmed R0–R2
//   2 ?  practising missing    confirmed R3 — next is R4 mf; or R6 for an unbridged seeded fact (next R7 mf)
//   3 ÷  practising division   confirmed R4+ (except unbridged R6), or seeded onto a ÷ working rung
//   4 ★ silver                 confirmed R8: known every way, by recall
//   5 ★ gold                   tt_phase "mastered": R8 + fluent + retained + both ÷ directions
// Child map shows BEST-EVER of this monotonic tier (eng.achBest — a lost star would punish the
// child for the engine's honesty). achBest is kept OUTSIDE eng.facts so an anomaly snapshot
// restore never rewrites it. The ADULT card uses tt_focusTier instead (below): what the fact
// is being practised as RIGHT NOW (Kath h16 — a fact held at R4 waiting for the ÷ gate is
// practising missing numbers, and the monotonic tier called it ÷).
var TT_ACH_TIERS = ["unstarted", "multiply", "missing", "divide", "silver", "gold"];
function tt_achTier(eng, f) {
  if (!f.seen) return 0;
  if (tt_phase(eng, f) === "mastered") return 5;
  var cr = f.confirmedRung;
  if (cr >= 8) return 4;
  if (cr === 6 && f.bridge !== "open") return 2;                 // seeded past the tiles: next is R7 mf
  // ÷ stage: earned R4+ (next is the gate or the ÷ climb), or a placement-seeded fact whose
  // WORKING rung is already on ÷ (bridge opened at seeding, nothing confirmed yet). Keyed on
  // the working rung, NOT bridge state alone — a bridged fact demoted to R3 keeps its open
  // bridge but is practising × again, and the adult card must say so.
  if (cr >= 4 || (f.bridge === "open" && f.rung >= 5)) return 3;
  if (cr === 3) return 2;
  return 1;
}
// Adult "current focus": the FORM of the working rung (×/?/÷ — tiles or keypad alike), with
// silver/gold as earned. NOT monotonic: R5 ÷ tiles → R6 × keypad shows ÷ → ×, which is
// progress (recall replacing tiles), and the adult card's explainer says so.
function tt_focusTier(eng, f) {
  if (!f.seen) return 0;
  if (tt_phase(eng, f) === "mastered") return 5;
  if (f.confirmedRung >= 8) return 4;
  var form = TT_RUNGS[f.rung] ? TT_RUNGS[f.rung].form : "product";
  return form === "missingFactor" ? 2 : form === "division" ? 3 : 1;   // intro/product → ×
}
function tt_noteAchievement(eng, f) {
  if (!eng.achBest) eng.achBest = {};
  var t = tt_achTier(eng, f);
  if (t > (eng.achBest[f.key] || 0)) eng.achBest[f.key] = t;
}
// Read-only. tier/counts = current FOCUS (adult); best/bestCounts = best-ever monotonic
// tier (child). Facts are the unique facts (3×4 and 4×3 are ONE fact): 78 at tablesUpTo 12.
function tt_getAchievements(eng) {
  var facts = {}, counts = [0, 0, 0, 0, 0, 0], bestCounts = [0, 0, 0, 0, 0, 0], total = 0;
  var best = eng.achBest || {};
  for (var key in eng.facts) {
    var f = eng.facts[key], t = tt_focusTier(eng, f), b = Math.max(tt_achTier(eng, f), best[key] || 0);
    facts[key] = { a: f.a, b: f.b, tier: t, best: b };
    counts[t]++; bestCounts[b]++; total++;
  }
  return { tiers: TT_ACH_TIERS.slice(), facts: facts, counts: counts, bestCounts: bestCounts, total: total };
}

// --- panel: child stats + evidence-cited inferences (SPEC §10) -------------------------
function tt_getChildStats(eng) {
  return {
    rollingAcc: tt_rollingAcc(eng),
    setpoint: eng.child.setpoint,
    wipCap: eng.child.wipCap,
    wipEffective: tt_effectiveWip(eng),
    challengeIndex: tt_challengeIndex(eng),
    correctStreak: eng.correctStreak || 0,
    inFlux: tt_inFluxCount(eng),
    learningRate: eng.child.learningRate,
    forgettingMult: eng.child.forgettingMult,
    score: eng.score,
    qCount: eng.qCount,
  };
}

// STATE_INFERRED-grade heuristics, verdict WITH evidence (never verdict-only).
function tt_getInferences(eng) {
  var out = [];
  var recent = [];
  for (var key in eng.facts) {
    var f = eng.facts[key];
    for (var i = 0; i < f.attempts.length; i++) {
      var a = f.attempts[i];
      if (!a.ceremonial) recent.push({ f: f, a: a });
    }
  }
  recent.sort(function (x, y) { return x.a.q - y.a.q; });
  var last10 = recent.slice(-10);
  var fastWrong = 0, slowCorrectKnown = 0, knownCount = 0, streak = 0;
  for (var j = 0; j < last10.length; j++) {
    var r = last10[j];
    var bar = tt_fastBar(eng, r.a.rung);
    if (!r.a.correct && r.a.latencyMs < bar * 0.4) fastWrong++;
    if (r.f.confirmedRung >= 3) {
      knownCount++;
      if (r.a.correct && r.a.latencyMs > bar * 1.5) slowCorrectKnown++;
    }
  }
  streak = eng.correctStreak || 0;   // engine-tracked (drives the release valve live)
  if (fastWrong >= 3)
    out.push({ kind: "rushing", evidence: fastWrong + " of last 10 answers fast+wrong (guess pattern)" });
  if (knownCount >= 4 && slowCorrectKnown / knownCount >= 0.5)
    out.push({ kind: "underConfident", evidence: slowCorrectKnown + "/" + knownCount + " well-known facts answered correct but >1.5× fast-bar" });
  var chIdx = tt_challengeIndex(eng);
  if (chIdx >= TT_C.CHALLENGE_FLOOR && tt_effectiveWip(eng) > eng.child.wipCap)
    out.push({ kind: "bored", evidence: "challenge index " + Math.round(chIdx) + " (acc×speed×difficulty×rung, window " + eng.compWindow.length + ") — valve open: effective WIP " + tt_effectiveWip(eng) + " (base " + eng.child.wipCap + "), streak " + streak });
  for (var e = 0; e < out.length; e++) tt_noteInference(eng, out[e]);
  return out;
}
function tt_noteInference(eng, inf) {
  var last = eng._lastInferred || {};
  if (last[inf.kind] && eng.qCount - last[inf.kind] < 10) return; // don't spam events
  eng._lastInferred = last; last[inf.kind] = eng.qCount;
  tt_emit(eng, "STATE_INFERRED", { kind: inf.kind, evidence: inf.evidence });
}

// --- serialize / deserialize (HOOKS §3; schemaVersion from day one, SPEC §9) ------------
function tt_serialize(eng) {
  var copy = {};
  for (var k in eng) {
    if (k === "_handlers" || k === "eventLog" || k.charAt(0) === "_") continue;
    copy[k] = eng[k];
  }
  return JSON.stringify(copy);
}
function tt_deserialize(json) {
  var data = JSON.parse(json);
  // migrations live here; NEVER discard a child's history (SPEC §9)
  if (data.schemaVersion === 1) {
    // v1 ladder: R4 = keypad product, R5 = keypad missing-factor.
    // v2 keypad-late ladder: those live at R6 / R7; tile rungs 1-3 unchanged.
    var map = { 0: 0, 1: 1, 2: 2, 3: 3, 4: 6, 5: 7 };
    for (var fk in data.facts) {
      var f = data.facts[fk];
      f.rung = map[f.rung] !== undefined ? map[f.rung] : f.rung;
      f.confirmedRung = map[f.confirmedRung] !== undefined ? map[f.confirmedRung] : f.confirmedRung;
    }
    data.schemaVersion = 2;
  }
  if (data.schemaVersion !== 2) throw new Error("tt: unknown schemaVersion " + data.schemaVersion);
  // h16: arcs retired (session = game entry). "Next session" re-asks become time-due items.
  if (data.nextSessionReasks) {
    data.spacedReasks = data.nextSessionReasks.map(function (key) { return { key: key, dueAtTs: (data.lastAnswerTs || 0) + TT_C.ERROR_REASK3_GAP_MS }; });
  }
  delete data.nextSessionReasks; delete data.arc; delete data.arcSeq;
  for (var hk in data.facts) delete data.facts[hk].bridgeRetriggeredArc;
  var eng = tt_newEngine(data.config);
  for (var k in data) if (k !== "config") eng[k] = data[k];
  // commutativity §2: backfill gate trackers for pre-commutativity saves — grandfather anything
  // already past the gate rung so an existing mastery/climb doesn't silently regress.
  for (var fk in eng.facts) {
    var ff = eng.facts[fk];
    if (!ff.r6Orders) ff.r6Orders = { ab: ff.confirmedRung >= 7, ba: ff.confirmedRung >= 7 };
    if (!ff.r8Dirs) { var m8 = ff.confirmedRung >= 8 && (ff.fluentRung || 0) >= 8; ff.r8Dirs = { a: m8, b: m8 }; }
  }
  eng.schemaVersion = 2;
  eng._handlers = [];
  eng.eventLog = [];
  return eng;
}

// --- node export hook (no-op in browser) -------------------------------------------------
if (typeof module !== "undefined" && module.exports) {
  module.exports = {
    TT_C: TT_C, TT_GROUPS: TT_GROUPS, TT_RUNGS: TT_RUNGS,
    tt_maxUnlocked: tt_maxUnlocked, tt_nextUnlocked: tt_nextUnlocked,
    tt_newEngine: tt_newEngine, tt_factKey: tt_factKey, tt_buildIntroOrder: tt_buildIntroOrder,
    tt_nextQuestion: tt_nextQuestion, tt_recordAnswer: tt_recordAnswer,
    tt_requestClosingQuestion: tt_requestClosingQuestion,
    tt_startSession: tt_startSession, tt_endSession: tt_endSession, tt_forceReinstate: tt_forceReinstate,
    tt_onEvent: tt_onEvent, tt_getMasteryGrid: tt_getMasteryGrid, tt_getTableProgress: tt_getTableProgress,
    tt_getFactStates: tt_getFactStates, tt_describeFactKey: tt_describeFactKey, tt_markServed: tt_markServed,
    tt_getScore: tt_getScore, tt_getChildStats: tt_getChildStats, tt_getInferences: tt_getInferences,
    tt_serialize: tt_serialize, tt_deserialize: tt_deserialize,
    tt_inFluxCount: tt_inFluxCount, tt_effectiveWip: tt_effectiveWip, tt_challengeIndex: tt_challengeIndex,
    tt_phase: tt_phase, tt_fastBar: tt_fastBar, tt_describe: tt_describe, tt_buildAsk: tt_buildAsk, tt_tableWindow: tt_tableWindow,
    tt_bothOrders: tt_bothOrders, tt_bothDivDirs: tt_bothDivDirs,
    tt_factDifficulty: tt_factDifficulty, tt_introGroupOfFact: tt_introGroupOfFact,
    tt_tableStarted: tt_tableStarted,
    tt_bridgeEligible: tt_bridgeEligible,
    TT_ACH_TIERS: TT_ACH_TIERS, tt_achTier: tt_achTier, tt_focusTier: tt_focusTier, tt_getAchievements: tt_getAchievements,
  };
}
// ==== MODULE tt_engine.js [END] ====
</script>
<script>
// ==== MODULE tt_view.js [BEGIN] ====
// ============================================================================
// tt_view.js — PURE presentation logic (skin-side, engine-agnostic, DOM-free)
// ----------------------------------------------------------------------------
// Turns an engine question descriptor (tt_describe / tt_nextQuestion output)
// into a render-ready view-model. No DOM, no engine calls → cold-run testable.
// Consumed by tt_panels.js (DOM renderers). This is game/skin-layer code, NOT
// engine code. Descriptor contract: tables_architecture.md §2; tt_engine.js:407.
// Assembled by cat (never a PowerShell round-trip) into tt_play.html.
// ============================================================================

var TT_BLANK = "▢"; // ▢ placeholder for the missing slot

// presented = {left, op:"×"|"÷", right, missingSlot:"result"|"factor1"|"factor2"}
// → ordered slot list for "a op b = c", exactly one blank. Input type is DATA:
// scaffold.options present ⇒ tiles (recognition), absent ⇒ keypad (recall).
function ttQuestionView(d) {
  var p = d.presented, op = p.op;
  var L = String(p.left), R = String(p.right);
  var slots;
  if (p.missingSlot === "factor1") {
    slots = [ttBlankSlot(), ttSym(op), ttLit(L), ttSym("="), ttLit(R)];     // ▢ × shown = product
  } else if (p.missingSlot === "factor2") {
    slots = [ttLit(L), ttSym(op), ttBlankSlot(), ttSym("="), ttLit(R)];     // shown × ▢ = product
  } else {
    slots = [ttLit(L), ttSym(op), ttLit(R), ttSym("="), ttBlankSlot()];     // a op b = ▢
  }
  var tiles = (d.scaffold && d.scaffold.options) ? d.scaffold.options : null;
  return {
    factKey: d.factKey, rung: d.rung, form: d.form,
    slots: slots,
    exprText: slots.map(function (s) { return s.blank ? TT_BLANK : s.text; }).join(" "),
    inputType: tiles ? "tiles" : "keypad",
    options: tiles ? tiles.slice() : null,
    ordered: !!(d.scaffold && d.scaffold.ordered),
    correctAnswer: d.correctAnswer,
  };
}
function ttLit(t) { return { text: t, blank: false, sep: false }; }
function ttSym(t) { return { text: t, blank: false, sep: t === "=" }; }
function ttBlankSlot() { return { text: null, blank: true, sep: false }; }

// The FULL solved equation for a descriptor — the blank filled with the answer,
// e.g. "6 × 7 = 42" (not "▢ = 42"). Used for corrective/reveal help so the child
// sees the whole fact, not a bare answer (Kath h12).
function ttSolvedText(d) {
  var p = d.presented, A = String(d.correctAnswer), L = String(p.left), R = String(p.right);
  if (p.missingSlot === "factor1") return A + " " + p.op + " " + L + " = " + R;   // ▢ × shown = product
  if (p.missingSlot === "factor2") return L + " " + p.op + " " + A + " = " + R;   // shown × ▢ = product
  return L + " " + p.op + " " + R + " = " + A;                                    // a op b = ▢
}

// Feedback view — anti-praise (PRINCIPLES §1). Correct = brief + factual, never
// "clever/amazing". Wrong = show the WHOLE solved fact as HELP (corrective, S2a),
// a scaffold not a scold. Copy is placeholder — a skin may override the strings.
function ttFeedbackView(correct, d) {
  return correct
    ? { kind: "correct", text: "correct" }
    : { kind: "corrective", text: ttSolvedText(d), answer: d.correctAnswer };
}

// ============================================================================
// end tt_view.js
// ============================================================================
// ==== MODULE tt_view.js [END] ====
</script>
<script>
// ==== MODULE tt_scope.js [BEGIN] ====
// ============================================================================
// tt_scope.js — PURE scope/table-selection logic (DOM-free, clock-injected).
// ----------------------------------------------------------------------------
// The D5 "who chooses the tables" resolution, extracted from tt_flow so it can
// be cold-run tested (like tt_view). tt_flow supplies `today` from the real
// clock; tests pass it explicitly. See child_table_choice_design.md and
// tables_architecture.md (D3/D5).
//
//   scope   = { control: "game"|"adult"|"child", tables:[], strict:"mainly"|"only" }
//   pick    = { date: <today-string>|null, tables:[] }   (child's daily pick, per player)
//   today   = the current calendar-date string (tt_flow: todayStr())
//
// Engine mode shape (consumed by tt_engine tt_modeInfo): "any" | {only:[...]} | {mainly:[...]}.
// ============================================================================

// The child's pick counts ONLY on the day it was made — a new calendar date
// blanks it (daily reset: engine becomes the default; deviation is deliberate,
// re-done each day). Returns a fresh array (never the stored reference).
function ttScopeTablesToday(pick, today) {
  return (pick && pick.date === today && pick.tables) ? pick.tables.slice() : [];
}

// Resolve the adult policy + child pick into an engine session mode.
//  - adult + tables → {only} or {mainly} per strict (hard lock vs weighting)
//  - child + a pick made TODAY → {only} (agency: the child's choice is honoured hard)
//  - everything else (game, child-with-no-pick, stale pick, empty set) → "any"
function ttResolveMode(scope, pick, today) {
  if (scope && scope.control === "adult" && scope.tables && scope.tables.length) {
    return (scope.strict === "only") ? { only: scope.tables.slice() } : { mainly: scope.tables.slice() };
  }
  if (scope && scope.control === "child") {
    var ct = ttScopeTablesToday(pick, today);
    return ct.length ? { only: ct } : "any";
  }
  return "any";
}

// Build a child pick stamped with today's date (persisted per player by the host).
function ttMakePick(tables, today) {
  return { date: today, tables: (tables || []).slice() };
}

if (typeof module !== "undefined" && module.exports) {
  module.exports = { ttScopeTablesToday: ttScopeTablesToday, ttResolveMode: ttResolveMode, ttMakePick: ttMakePick };
}
// ==== MODULE tt_scope.js [END] ====
</script>
<script>
// ==== MODULE tt_scaffold.js [BEGIN] ====
// ============================================================================
// tt_scaffold.js — PURE array-scaffolding script generator (reusable core).
// ----------------------------------------------------------------------------
// Engine-agnostic, DOM-free, clock-free. Given array geometry + a help level it
// emits a declarative SCRIPT: an ordered list of tagged steps a player renders
// in sequence (tt_scaffold_play.js). Knows nothing about the engine, the drill,
// or tables — so it lifts out as "general scaffolding code" for any game.
// Design: tables_game3_design.md §3, §4, §6.1. Mirrors the tt_view→tt_panels
// pure→DOM split. Assembled by cat (never a PowerShell round-trip).
//
//   ttBuildScaffold(spec) -> script
//     spec = { a, b, op:"×"|"÷", level:1|2|3, unknown:"rows"|"cols"|null,
//              lead:"rows"|"cols" }   // which phase leads (default "rows")
//            a rows × b columns, AS PRESENTED (not normalised, §3).
//            unknown = which DIMENSION the child does not know (h14):
//              null   both dimensions given (ordinary ×, `a × b = ?`)
//              "rows" the row count is the answer (÷; `? × b = c`)
//              "cols" the column count is the answer (`a × ? = c`)
//            Default for op "÷" is "rows" (÷ always asks the quotient), else null.
//     script = { dims:{a,b}, countAxis, steps:[Step], answer, equationText }
//
//   countAxis (h14) = spec.unknown, restated for the renderer. It is the ONE
//   field the player needs to apply the h14 rule (§4.3):
//     **a number the question gives you is static; a number the loops discover
//     counts up** — and, as its corollary, the array is only dealt out
//     progressively along an axis whose size is unknown. So:
//       null   → all dots drawn at once; a and b both static (a left-middle,
//                b top-centre); only the black dot count moves.
//       "rows" → dots dealt row by row; the row ordinal counts up beside the
//                current row; b static top-centre.
//       "cols" → dots dealt column by column; the column ordinal counts up above
//                the current column; a static left-middle.
//
//   Step (tagged union, pure data — no rendering):
//     { kind:"row", index, loopColor:"orange", ordinal, dots }  // row `index`(1..a)
//     { kind:"col", index, loopColor:"blue",   ordinal, dots }  // col `index`(1..b)
//         ordinal = how many rows/cols so far. ALWAYS present (it is a true fact
//           about the step); whether it is DRAWN is countAxis's business, not the
//           step's — the renderer draws it only on the counting axis.
//         dots    = how many dots so far (counts up, BLACK).
//     { kind:"clear" }                              // clear loops+numbers between phases (L2)
//     { kind:"equation", a, b, c, highlight:true, answerSlot }  // × terminal; player colours a=orange b=blue c=black
//     { kind:"sentence", text, parts }               // ÷ terminal; persists until answered/replay
//         parts = [{text, role?, answer?}] — text concatenates to `text`. role "a"|"b"|"c" tags
//         each NUMBER so the player colours it like the array (a orange, b blue, c black) in
//         the explanation AND the equation (h16); `answer:true` marks the quotient — both
//         occurrences, the "a groups" and the closing "= a".
//         answerSlot ("a"|"b"|"c") = WHICH number the child must copy (h16). It is the
//         unknown, not always the product: `a × ? = c` copies b, `? × b = c` copies a, ÷ copies
//         the quotient. The player marks exactly that number for the copy-to-proceed hint.
//
// Level → steps (§4):
//   countAxis null  : L1 = rows + terminal · L2 = rows + clear + cols + terminal
//   countAxis "rows": L1 = L2 = rows + terminal       (no second phase, h14)
//   countAxis "cols": L1 = L2 = cols + terminal       (no second phase, h14)
//   L3 (any axis)   : terminal only.
// The second (commutativity) phase runs ONLY when both dimensions are given: when
// one is the answer, the opposite phase would count something already known.
// ============================================================================

function ttScaffoldRowSteps(a, b) {
  var steps = [];
  for (var i = 1; i <= a; i++) steps.push({ kind: "row", index: i, loopColor: "orange", ordinal: i, dots: i * b });
  return steps;
}

function ttScaffoldColSteps(a, b) {
  var steps = [];
  for (var j = 1; j <= b; j++) steps.push({ kind: "col", index: j, loopColor: "blue", ordinal: j, dots: j * a });
  return steps;
}

// The ÷ teaching sentence (§3.1): "There are a groups of b in c, so c ÷ b = a."
// As tagged parts: every number carries its role so the player can colour it like the
// array, and the closing quotient (the number to copy) is flagged on its own.
function ttScaffoldSentenceParts(a, b, c) {
  function n(v, role, ans) { var p = { text: String(v), role: role }; if (ans) p.answer = true; return p; }
  // BOTH occurrences of the quotient are marked (Kath h16): the sentence's "4 groups" IS the
  // answer, so the copy hint links the explanation to the equation as well as to the box.
  return [{ text: "There are " }, n(a, "a", true), { text: " groups of " }, n(b, "b"), { text: " in " }, n(c, "c"),
          { text: ", so " }, n(c, "c"), { text: " ÷ " }, n(b, "b"), { text: " = " }, n(a, "a", true), { text: "." }];
}
function ttScaffoldSentence(a, b, c) {
  return ttScaffoldSentenceParts(a, b, c).map(function (p) { return p.text; }).join("");
}

function ttBuildScaffold(spec) {
  var a = spec.a, b = spec.b;
  var op = spec.op || "×";
  var level = spec.level || 1;
  var c = a * b;                                   // product / dividend
  var isDiv = op === "÷";
  // Which dimension is the answer (h14). ÷ always asks the quotient = the row
  // count, so that is its default; anything unrecognised falls back to null.
  var unknown = spec.unknown;
  if (unknown !== "rows" && unknown !== "cols") unknown = isDiv ? "rows" : null;
  // The answer = the UNKNOWN (h16 fix: was always c for ×, so a missing-factor caption told
  // the child to copy the product): ÷ → quotient a; `? × b` → a; `a × ?` → b; `a × b` → c.
  var answerSlot = isDiv || unknown === "rows" ? "a" : unknown === "cols" ? "b" : "c";
  var answer = answerSlot === "a" ? a : answerSlot === "b" ? b : c;
  var equationText = isDiv ? ttScaffoldSentence(a, b, c) : a + " × " + b + " = " + c;
  var terminal = isDiv
    ? { kind: "sentence", text: equationText, parts: ttScaffoldSentenceParts(a, b, c) }
    : { kind: "equation", a: a, b: b, c: c, highlight: true, answerSlot: answerSlot };

  // Which phase LEADS when both dimensions are given. The row phase counts in steps of `b`
  // (the second displayed factor), the column phase in steps of `a`. A step the child has
  // never met is not a scaffold: `2 x 8` led by rows counts 8, 16 — skip-counting a table
  // they have not been introduced to. Leading with columns gives 2, 4 ... 16 on the SAME
  // dots, every hop inside a table they have. Caller decides (it knows which tables have
  // started); default "rows" keeps every existing caller byte-identical.
  var lead = spec.lead === "cols" ? "cols" : "rows";

  var steps = [];
  if (level >= 1 && level <= 2) {                  // L1 + L2 draw an array phase
    if (unknown === "cols") {
      steps = steps.concat(ttScaffoldColSteps(a, b));   // deal along the unknown axis
    } else if (unknown === "rows") {
      steps = steps.concat(ttScaffoldRowSteps(a, b));   // ditto (no second phase, h14)
    } else {
      // Both dims given: lead with the countable axis, and at L2 play the other one after.
      // L2 keeps BOTH counts deliberately (Kath h15) — the harder table still has to be
      // introduced at some point or `16 / 8` is a cold start later. Leading with the
      // countable one means the child can follow the first pass and merely SEES the second.
      var first  = lead === "cols" ? ttScaffoldColSteps(a, b) : ttScaffoldRowSteps(a, b);
      var second = lead === "cols" ? ttScaffoldRowSteps(a, b) : ttScaffoldColSteps(a, b);
      steps = steps.concat(first);
      if (level === 2) {                           // commutativity phase: both dims given only
        steps.push({ kind: "clear" });
        steps = steps.concat(second);
      }
    }
  }
  steps.push(terminal);                            // L3 (and any out-of-range level) = terminal only

  return { dims: { a: a, b: b }, countAxis: unknown, steps: steps, answer: answer, equationText: equationText };
}

if (typeof module !== "undefined" && module.exports) {
  module.exports = {
    ttBuildScaffold: ttBuildScaffold,
    ttScaffoldSentence: ttScaffoldSentence,
  };
}
// ==== MODULE tt_scaffold.js [END] ====
</script>
<script>
// ==== MODULE tt_scaffold_play.js [BEGIN] ====
// ============================================================================
// tt_scaffold_play.js — the array-scaffolding PLAYER (impure boundary).
// ----------------------------------------------------------------------------
// The ONLY DOM/timer-coupled part of the scaffolding subsystem. Takes a pure
// script from tt_scaffold.js (ttBuildScaffold) + a mount element and plays it:
// draws the white panel + SVG array (black dots), runs the ~1s/loop clock, and
// shows the running numbers one-at-a-time (§4.3). The terminal equation is drawn
// larger, coloured a=orange b=blue c=black.
// No engine calls, no fact knowledge — reusable "general scaffolding".
// Design: tables_game3_design.md §6.2. Browser-verified (needs a DOM).
//
// NUMBERS + DOT REVEAL follow script.countAxis (h14 — one rule, three cases):
// **a number the question gives you is static; a number the loops discover counts
// up**, and the array is dealt out progressively ONLY along an unknown axis.
//   countAxis null   (a × b = ?):  all dots up front; orange a static at the
//     LEFT MIDDLE, blue b static at the TOP CENTRE; black dot count walks the
//     right edge (row phase) / bottom edge (column phase).
//   countAxis "rows" (÷, ? × b = c): dots dealt row by row with their loop;
//     orange ordinal counts 1..a beside the current row; blue b static top.
//   countAxis "cols" (a × ? = c):  dots dealt column by column with their loop;
//     blue ordinal counts 1..b above the current column; orange a static left.
// Geometry is IDENTICAL in all three cases — same cell size, same dot centres,
// same number positions — so only the arrival order differs (Kath, h14).
//
//   ttPlayScaffold(mountEl, script, opts) -> handle
//     opts   = { stepMs?:1000, onDone?, reduceMotion? }
//     handle = { replay(), stop(), destroy() }
// ============================================================================

var TT_SCAFFOLD_STEP_MS = 1000;          // §4.2 / §6.3 — per-loop pace (tunable)
var TT_SCAFFOLD_ORANGE  = "#ffb347";     // row loops / row factor / row ordinal (Cave part-a)
var TT_SCAFFOLD_BLUE    = "#5ab4ff";     // column loops / column factor / column ordinal (Cave part-b)
var TT_SCAFFOLD_DOT     = "#000000";     // array dots + the dot-count number — black (§2)
var TT_SVG_NS = "http://www.w3.org/2000/svg";

function ttSvgEl(name, attrs) {
  var el = document.createElementNS(TT_SVG_NS, name);
  for (var k in attrs) if (attrs.hasOwnProperty(k)) el.setAttribute(k, attrs[k]);
  return el;
}

// Responsive geometry for an a×b array: cell sized so the array + a left number
// column + a right dot-count + top/bottom strips fit the mount width (mobile, §4).
// Horizontal margins are DIGIT-AWARE (h12 fix): the left number reaches `rows`
// (≤2 digits) and the right cumulative dot-count reaches `rows·cols` (up to 3
// digits, e.g. 110, 144). Each number is drawn text-anchor:middle, centred
// ~0.95·cell outside the array, so the SVG must reserve that offset PLUS half the
// number's width — otherwise a 3-digit count (10×11 = 110) overflows the viewBox
// and the last digit is clipped by the white panel edge.
// Geometry does NOT depend on countAxis (h14): the same reservations serve the
// right-edge count (row phase) and the bottom-edge count (column phase), so every
// ask type of a given fact renders its dots and numbers in exactly the same places.
function ttScaffoldGeom(dims, availW) {
  var rows = dims.a, cols = dims.b;
  var w = availW && availW > 40 ? availW : 320;
  var leftD = String(rows).length, rightD = String(rows * cols).length;   // left-number / dot-count digits
  var leftCells  = 0.95 + 0.28 * leftD  + 0.15;    // number offset + half-width + pad, in cells
  var rightCells = 0.95 + 0.28 * rightD + 0.15;
  var cell = Math.floor(w / ((cols - 1) + leftCells + rightCells));
  cell = Math.max(14, Math.min(44, cell));
  var ox = Math.round(cell * leftCells), oy = Math.round(cell * 1.4);   // top-left dot centre (room L/T)
  return {
    rows: rows, cols: cols, cell: cell, ox: ox, oy: oy,
    dotR: Math.max(3, Math.round(cell * 0.16)),
    width:  ox + (cols - 1) * cell + Math.round(cell * rightCells),
    height: oy + (rows - 1) * cell + Math.round(cell * 1.4),
    cx: function (c) { return ox + c * cell; },   // c: 0..cols-1
    cy: function (r) { return oy + r * cell; },   // r: 0..rows-1
  };
}

function ttPlayScaffold(mountEl, script, opts) {
  opts = opts || {};
  // FIXED game pace: TT_SCAFFOLD_STEP_MS (1s). No global/harness override — tests run at the real pace.
  // (opts.stepMs stays as an explicit reusable-module API, e.g. a future "slow mode"; the drill never sets it.)
  var stepMs = opts.stepMs || TT_SCAFFOLD_STEP_MS;
  var reduceMotion = opts.reduceMotion ||
    (typeof window !== "undefined" && window.matchMedia &&
     window.matchMedia("(prefers-reduced-motion: reduce)").matches);

  var hasArray = script.steps.some(function (s) { return s.kind === "row" || s.kind === "col"; });
  var countAxis = script.countAxis || null;        // "rows" | "cols" | null (h14)
  var progressive = countAxis !== null;            // deal the dots out along the unknown axis
  var g = ttScaffoldGeom(script.dims, mountEl.clientWidth);

  // --- panel DOM ------------------------------------------------------------
  mountEl.innerHTML = "";
  var panel = document.createElement("div");
  panel.className = "tt-scaffold-panel";
  panel.style.cssText = "position:relative;background:#fff;border-radius:16px;padding:16px 18px;" +
    "display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:0 4px 18px rgba(0,0,0,0.25);";

  var svg = null, dotLayer = null, loopLayer = null, leftEl = null, topEl = null, dotEl = null;
  if (hasArray) {
    svg = ttSvgEl("svg", { width: g.width, height: g.height, viewBox: "0 0 " + g.width + " " + g.height });
    dotLayer = ttSvgEl("g", {});                   // the array itself (all at once, or dealt out)
    loopLayer = ttSvgEl("g", {});
    svg.appendChild(dotLayer); svg.appendChild(loopLayer);
    var numAttrs = { "text-anchor": "middle", "dominant-baseline": "central", dy: "0.02em",
      "font-weight": "bold", "font-size": Math.round(g.cell * 0.9) };
    leftEl = ttSvgEl("text", numAttrs);   // LEFT number — orange: static `a`, or the row ordinal
    topEl  = ttSvgEl("text", numAttrs);   // TOP number  — blue:   static `b`, or the column ordinal
    dotEl  = ttSvgEl("text", numAttrs);   // running dot count — black
    svg.appendChild(leftEl); svg.appendChild(topEl); svg.appendChild(dotEl);
    panel.appendChild(svg);
  }

  var caption = document.createElement("div");     // terminal equation / ÷ sentence — larger (§ user)
  caption.className = "tt-scaffold-caption";
  caption.style.cssText = "font-weight:bold;font-size:1.9rem;text-align:center;min-height:1.4em;color:#123;line-height:1.5;";   // 1.5 (h16): a wrapped ÷ sentence's copy underline crowded the line below at 1.2
  panel.appendChild(caption);
  mountEl.appendChild(panel);

  // The terminal caption is BUILT AT MOUNT and merely HIDDEN until its step lands
  // (h14). Reserving its box from the start stops the panel resizing at the exact
  // moment the answer appears: a skin may pad the caption to clear an overlaid
  // replay button (tt_skin_drill.css ↻ clearance), which on a tall narrow panel
  // makes the caption wider than the array, and a ÷ sentence is several lines
  // taller than an empty box. Measured at h14: without this the 10×2 panel jumped
  // 226px → 281px on the last step. `visibility:hidden` (not opacity) also keeps
  // the answer out of the accessibility tree until it is meant to be read.
  function buildTerminal() {
    var t = script.steps[script.steps.length - 1];
    caption.innerHTML = "";
    if (t && t.kind === "equation") {              // a (orange) × b (blue) = c (black)
      var part = function (txt, col, cls) {
        var sp = document.createElement("span"); sp.textContent = txt;
        if (col) sp.style.color = col;
        if (cls) sp.className = cls;        // hook for the copy-to-proceed hint (h15)
        return sp;
      };
      // mark the number the child must COPY (answerSlot, h16) — not always c
      var slot = t.answerSlot || "c";
      var mark = function (s) { return slot === s ? "tt-scaffold-answer" : null; };
      caption.appendChild(part(t.a, TT_SCAFFOLD_ORANGE, mark("a")));
      caption.appendChild(part(" × "));
      caption.appendChild(part(t.b, TT_SCAFFOLD_BLUE, mark("b")));
      caption.appendChild(part(" = "));
      caption.appendChild(part(t.c, TT_SCAFFOLD_DOT, mark("c")));
    } else if (t && t.kind === "sentence") {
      // h16: numbers coloured like the array — a (rows) orange, b (columns) blue, c (dots)
      // black — in the explanation and the equation alike; the closing quotient is the copy target.
      var ROLE_COL = { a: TT_SCAFFOLD_ORANGE, b: TT_SCAFFOLD_BLUE, c: TT_SCAFFOLD_DOT };
      if (t.parts) {
        t.parts.forEach(function (p) {
          if (!p.role) { caption.appendChild(document.createTextNode(p.text)); return; }
          var sp = document.createElement("span"); sp.textContent = p.text; sp.style.color = ROLE_COL[p.role];
          if (p.answer) sp.className = "tt-scaffold-answer";
          caption.appendChild(sp);
        });
      } else caption.textContent = t.text;
    }
  }
  function hideTerminal() { buildTerminal(); caption.style.visibility = "hidden"; }
  function showTerminal() { caption.style.visibility = "visible"; }
  hideTerminal();                                  // reserve the box before the first tick

  // --- step renderers -------------------------------------------------------
  function loopRect(attrs) { loopLayer.appendChild(ttSvgEl("rect", attrs)); }
  function dot(r, c) { dotLayer.appendChild(ttSvgEl("circle", { cx: g.cx(c), cy: g.cy(r), r: g.dotR, fill: TT_SCAFFOLD_DOT })); }
  function dealRow(r) { for (var c = 0; c < g.cols; c++) dot(r, c); }
  function dealCol(c) { for (var r = 0; r < g.rows; r++) dot(r, c); }
  function dealAll() { for (var r = 0; r < g.rows; r++) dealRow(r); }
  function setNum(el, x, y, val, fill) {
    el.setAttribute("x", x); el.setAttribute("y", y); el.setAttribute("fill", fill); el.textContent = val;
  }
  // The two factor numbers in their STATIC homes: `a` centred on the left side,
  // `b` centred across the top. A counting axis overwrites its own one per step.
  function staticLeft() { setNum(leftEl, g.ox - g.cell * 0.95, g.cy((g.rows - 1) / 2), g.rows, TT_SCAFFOLD_ORANGE); }
  function staticTop()  { setNum(topEl, (g.cx(0) + g.cx(g.cols - 1)) / 2, g.oy - g.cell * 0.9, g.cols, TT_SCAFFOLD_BLUE); }

  function drawRow(s) {
    var i = s.index - 1, m = g.cell * 0.42;
